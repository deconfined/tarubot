# Production: the bot against the external managed PostgreSQL, the release's web proxy, and the
# updater that follows the `production` tags. Start it once with the project's settings in its
# environment (production.env.example lists them); after that the approved Deploy workflow only
# moves the tags, and Watchtower replaces each container when its tag moves, keeping the settings
# and hardening the container was created with. Changing a setting needs `up` again.
# Exactly one writer holds the database lease: Watchtower stops the old bot before it starts the
# new one, and the new bot applies pending migrations, after an encrypted backup, before it takes
# the lease. Tools run as one-off containers of the same image (docker compose run --rm tarubot).
name: tarubot

include:
  - ./docker-compose.web.yml

x-logging: &logging
  # Bounded local logs so a busy day can't fill the disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  tarubot:
    image: ghcr.io/deconfined/tarubot:${TARUBOT_IMAGE_TAG:?Set TARUBOT_IMAGE_TAG to production}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: tarubot
    environment:
      # The managed cluster's direct connection, verified with its CA.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the managed tarubot database}
      DATABASE_CA_CERT: ${DATABASE_CA_CERT:?Set DATABASE_CA_CERT to the managed cluster CA}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:?Set DISCORD_APPLICATION_ID to the production application}
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:-}
      WEB_PORT: ${WEB_PORT:-8080}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # Tools run inside this container (docker compose run) resolve the production profile.
      TARUBOT_ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTH_PORT: "3000"
      ENABLE_EFFECTS: "true"
      # Production never carries development scoping.
      TEST_GUILD_ID: ""
      PUBLIC_TEST_RESPONSES: "false"
      TEST_PLAN_CHANNEL_ID: ""
      ROSTER_INTERVAL_SECONDS: ${ROSTER_INTERVAL_SECONDS:-21600}
      PROFILE_INTERVAL_SECONDS: ${PROFILE_INTERVAL_SECONDS:-86400}
      VERIFICATION_SECONDS: ${VERIFICATION_SECONDS:-1800}
      GUEST_COOLDOWN_SECONDS: ${GUEST_COOLDOWN_SECONDS:-86400}
      # The Lodestone parser runs in the bot (2.21.0: no sidecar).
      LODESTONE_REGION: ${LODESTONE_REGION:-na}
      LODESTONE_CONCURRENCY: ${LODESTONE_CONCURRENCY:-2}
      LODESTONE_START_MS: ${LODESTONE_START_MS:-1000}
      LODESTONE_TIMEOUT_MS: ${LODESTONE_TIMEOUT_MS:-15000}
      LODESTONE_BODY_BYTES: ${LODESTONE_BODY_BYTES:-2000000}
      LODESTONE_REQUEST_TIMEOUT_MS: ${LODESTONE_REQUEST_TIMEOUT_MS:-35000}
      LODESTONE_JOB_TIMEOUT_MS: ${LODESTONE_JOB_TIMEOUT_MS:-300000}
      LODESTONE_ATTEMPTS: ${LODESTONE_ATTEMPTS:-3}
      LODESTONE_MAX_PAGES: ${LODESTONE_MAX_PAGES:-100}
      LODESTONE_SELECTOR_CHECK_SECONDS: ${LODESTONE_SELECTOR_CHECK_SECONDS:-900}
      # Issue reports (2.18.0): empty saves reports unsent.
      GITHUB_REPORTS_TOKEN: ${GITHUB_REPORTS_TOKEN:-}
      GITHUB_REPORTS_REPO: ${GITHUB_REPORTS_REPO:-deconfined/tarubot-reports}
      # Public suggestions (2.28.0): the TaruBot GitHub App that opens /suggest issues in the public
      # repository. Production only: docker-compose.yml never passes them. The key is a PEM quoted
      # across lines, like the CA; either one empty switches /suggest off.
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      # Heartbeat (2.22.0): empty turns the heartbeat off, and healthchecks.io then alerts because
      # the pings stopped.
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL:-}
      MODMAIL_KEY: ${MODMAIL_KEY:-}
      # Backups (2.46.0): the bot takes the daily backup and the one before it migrates, so the
      # production profile refuses to migrate without these. Each backup also carries an encrypted
      # copy of these settings, the mod mail key included.
      BACKUP_STORAGE_ENDPOINT: ${BACKUP_STORAGE_ENDPOINT:-}
      BACKUP_STORAGE_ACCESS_KEY: ${BACKUP_STORAGE_ACCESS_KEY:-}
      BACKUP_STORAGE_SECRET_KEY: ${BACKUP_STORAGE_SECRET_KEY:-}
      BACKUP_STORAGE_REGION: ${BACKUP_STORAGE_REGION:-}
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-03:00}
      HEALTHCHECKS_BACKUP_URL: ${HEALTHCHECKS_BACKUP_URL:-}
      # Only for one-off restore and restore-check runs of this service; empty for the bot.
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:-}
      RESTORE_DATABASE_CA_CERT: ${RESTORE_DATABASE_CA_CERT:-}
    healthcheck:
      test: [CMD, bun, -e, "const r=await fetch('http://localhost:3000/health/ready');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      # A new bot is unready while it backs up, migrates and waits for the writer lease.
      start_period: 300s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    # Read-only root, no capabilities and no way to gain privileges. The only writable path is a
    # small /tmp, where pg_dump and pg_restore read the database CA from a private file.
    read_only: true
    tmpfs: ["/tmp:size=1m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Follows the `production` tags: every 300 seconds it compares each labelled container's image
  # with its tag in the registry and, when the tag moved, pulls it, stops the old container (within
  # its own stop_grace_period, the bot's 30 seconds; --stop-timeout covers the proxy, which it
  # stops first because it depends on the bot), starts the new one with the old one's
  # configuration, then removes the old image. --include-restarting also replaces a crash-looping
  # bot, so deploying the previous version still rolls back a release that never stays up.
  # A `docker compose run` of the bot carries its labels too: a tool run that may outlast a tag
  # move needs --label com.centurylinklabs.watchtower.enable=false, or Watchtower replaces it and
  # runs its command again. The Docker socket is root-equivalent on this Docker host: only this
  # pinned image gets it.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1.23.2@sha256:62fb91130ddb493f869cad7e198fa260dd16c5da293ed092cbd5d8781566f7a6
    labels:
      com.centurylinklabs.watchtower.scope: tarubot
    command:
      - --label-enable
      - --scope
      - tarubot
      - --interval
      - "300"
      - --stop-timeout
      - 40s
      - --include-restarting
      - --cleanup
      - --no-startup-message
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    logging: *logging
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
