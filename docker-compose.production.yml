# Production bot against external managed PostgreSQL. Deploy with an exact digest;
# the private host .env supplies settings, not release identity. ops/deploy.sh passes
# --project-name tarubot, the central --env-file and the release worktree manifest.
# Exactly one writer holds the database lease; migrations run only while it is stopped.
include:
  - ./docker-compose.web.yml

x-logging: &logging
  # Bounded local logs so a busy day can't fill the disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  tarubot:
    image: ghcr.io/deconfined/tarubot@${TARUBOT_IMAGE_DIGEST:?Set TARUBOT_IMAGE_DIGEST to the approved release digest}
    environment:
      # The managed cluster's direct connection, verified with its CA.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the managed tarubot database}
      DATABASE_CA_CERT: ${DATABASE_CA_CERT:?Set DATABASE_CA_CERT to the managed cluster CA}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:?Set DISCORD_APPLICATION_ID to the production application}
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:-}
      WEB_PORT: ${WEB_PORT:-8080}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # Tools run inside this container (docker compose run) resolve the production profile.
      TARUBOT_ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTH_PORT: "3000"
      ENABLE_EFFECTS: "true"
      # Production never carries development scoping.
      TEST_GUILD_ID: ""
      PUBLIC_TEST_RESPONSES: "false"
      TEST_PLAN_CHANNEL_ID: ""
      ROSTER_INTERVAL_SECONDS: ${ROSTER_INTERVAL_SECONDS:-21600}
      PROFILE_INTERVAL_SECONDS: ${PROFILE_INTERVAL_SECONDS:-86400}
      VERIFICATION_SECONDS: ${VERIFICATION_SECONDS:-1800}
      GUEST_COOLDOWN_SECONDS: ${GUEST_COOLDOWN_SECONDS:-86400}
      # The Lodestone parser runs in the bot (2.21.0: no sidecar).
      LODESTONE_REGION: ${LODESTONE_REGION:-na}
      LODESTONE_CONCURRENCY: ${LODESTONE_CONCURRENCY:-2}
      LODESTONE_START_MS: ${LODESTONE_START_MS:-1000}
      LODESTONE_TIMEOUT_MS: ${LODESTONE_TIMEOUT_MS:-15000}
      LODESTONE_BODY_BYTES: ${LODESTONE_BODY_BYTES:-2000000}
      LODESTONE_REQUEST_TIMEOUT_MS: ${LODESTONE_REQUEST_TIMEOUT_MS:-35000}
      LODESTONE_JOB_TIMEOUT_MS: ${LODESTONE_JOB_TIMEOUT_MS:-300000}
      LODESTONE_ATTEMPTS: ${LODESTONE_ATTEMPTS:-3}
      LODESTONE_MAX_PAGES: ${LODESTONE_MAX_PAGES:-100}
      LODESTONE_SELECTOR_CHECK_SECONDS: ${LODESTONE_SELECTOR_CHECK_SECONDS:-900}
      # Issue reports (2.18.0): the token lives in the host's .env; empty saves reports unsent.
      GITHUB_REPORTS_TOKEN: ${GITHUB_REPORTS_TOKEN:-}
      GITHUB_REPORTS_REPO: ${GITHUB_REPORTS_REPO:-deconfined/tarubot-reports}
      # Public suggestions (2.28.0): the TaruBot GitHub App that opens /suggest issues in the public
      # repository. Production only: docker-compose.yml never passes them. The key is a PEM quoted
      # across lines in the host's .env, like the CA; either one empty switches /suggest off.
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      # Heartbeat (2.22.0): the production check's ping URL lives in the host's .env; empty turns the
      # heartbeat off, and healthchecks.io then alerts because the pings stopped.
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL:-}
    healthcheck:
      test: [CMD, bun, -e, "const r=await fetch('http://localhost:3000/health/ready');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      # A new bot waits (unready) for the writer lease while a previous one stops.
      start_period: 60s
    # Delivery forces "no" until sustained observation and durable acceptance.
    restart: ${TARUBOT_RESTART_POLICY:-unless-stopped}
    stop_grace_period: 30s
    logging: *logging
    # The bot writes no runtime file: read-only root, no writable mounts, no
    # capabilities, and no opportunity to gain privileges.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # The daily database dump (2.24.0): ops/backup.sh runs it with `docker compose run -T backup`,
  # encrypts its output with age as it streams, and uploads it. The profile keeps `up` from ever
  # starting it. pg_dump reads the bot's own connection settings; $$ defers expansion to the
  # container's shell, so Compose doesn't splice the multi-line CA into the command. Its stdout is
  # the unencrypted dump, and a logging driver would copy it to disk even while it is piped, so
  # logging is off; `docker compose run` still streams stdout to the pipe.
  backup:
    image: docker.io/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    profiles: [backup]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the managed tarubot database}
      DATABASE_CA_CERT: ${DATABASE_CA_CERT:?Set DATABASE_CA_CERT to the managed cluster CA}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /tmp/ca.crt
    entrypoint:
      - sh
      - -c
      - umask 077 && printf '%s\n' "$$DATABASE_CA_CERT" > /tmp/ca.crt && exec pg_dump --format=custom --no-owner --no-privileges "$$DATABASE_URL"
    logging:
      driver: none
    # Container hardening (2.30.3, #51): /tmp/ca.crt is the only file the job writes (tested), so
    # the root filesystem is read-only and /tmp is a small tmpfs, private to the image's root user
    # (who runs pg_dump) and gone when the run ends. The job keeps no capability and gains no
    # privilege.
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
