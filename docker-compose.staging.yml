# Staging: the bot against its own external managed database (never a local one), the release's
# web proxy, and the updater that follows the `staging` tags, on staging's own Docker host. It
# works like docker-compose.production.yml: start it once with the project's settings in its
# environment (staging.env.example lists them); the approved Deploy workflow then only moves the
# tags, and Watchtower replaces the stale containers, stopping the old bot before the new one starts.
name: tarubot

include:
  - ./docker-compose.web.yml

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  tarubot:
    image: ghcr.io/deconfined/tarubot:${TARUBOT_IMAGE_TAG:?Set TARUBOT_IMAGE_TAG to staging}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: tarubot
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the managed staging database}
      DATABASE_CA_CERT: ${DATABASE_CA_CERT:?Set DATABASE_CA_CERT to the managed cluster CA}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN to the staging bot token}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:?Set DISCORD_APPLICATION_ID to the staging application}
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:-}
      WEB_PORT: ${WEB_PORT:-8080}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      TARUBOT_ENVIRONMENT: staging
      TEST_GUILD_ID: ${TEST_GUILD_ID:?Set TEST_GUILD_ID to the staging test guild}
      PUBLIC_TEST_RESPONSES: ${PUBLIC_TEST_RESPONSES:-false}
      TEST_PLAN_CHANNEL_ID: ${TEST_PLAN_CHANNEL_ID:-}
      TEST_PLAN_FILE: ${TEST_PLAN_FILE:-test-plans/current.json}
      ENABLE_EFFECTS: ${ENABLE_EFFECTS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTH_PORT: "3000"
      ROSTER_INTERVAL_SECONDS: ${ROSTER_INTERVAL_SECONDS:-21600}
      VERIFICATION_SECONDS: ${VERIFICATION_SECONDS:-1800}
      GUEST_COOLDOWN_SECONDS: ${GUEST_COOLDOWN_SECONDS:-86400}
      LODESTONE_REGION: ${LODESTONE_REGION:-na}
      LODESTONE_CONCURRENCY: ${LODESTONE_CONCURRENCY:-2}
      LODESTONE_START_MS: ${LODESTONE_START_MS:-1000}
      LODESTONE_TIMEOUT_MS: ${LODESTONE_TIMEOUT_MS:-15000}
      LODESTONE_BODY_BYTES: ${LODESTONE_BODY_BYTES:-2000000}
      LODESTONE_REQUEST_TIMEOUT_MS: ${LODESTONE_REQUEST_TIMEOUT_MS:-35000}
      LODESTONE_JOB_TIMEOUT_MS: ${LODESTONE_JOB_TIMEOUT_MS:-300000}
      LODESTONE_ATTEMPTS: ${LODESTONE_ATTEMPTS:-3}
      LODESTONE_MAX_PAGES: ${LODESTONE_MAX_PAGES:-100}
      LODESTONE_SELECTOR_CHECK_SECONDS: ${LODESTONE_SELECTOR_CHECK_SECONDS:-900}
      GITHUB_REPORTS_TOKEN: ${GITHUB_REPORTS_TOKEN:-}
      GITHUB_REPORTS_REPO: ${GITHUB_REPORTS_REPO:-deconfined/tarubot-reports}
      # Production's suggestion App credentials are intentionally not passed.
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL:-}
      # Staging's own mod mail key (2.43.0), never production's.
      MODMAIL_KEY: ${MODMAIL_KEY:-}
      # Backups (2.46.0) into staging's own bucket, for staging's own age recipients; the staging
      # profile refuses to migrate without them.
      BACKUP_STORAGE_ENDPOINT: ${BACKUP_STORAGE_ENDPOINT:-}
      BACKUP_STORAGE_ACCESS_KEY: ${BACKUP_STORAGE_ACCESS_KEY:-}
      BACKUP_STORAGE_SECRET_KEY: ${BACKUP_STORAGE_SECRET_KEY:-}
      BACKUP_STORAGE_REGION: ${BACKUP_STORAGE_REGION:-}
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-03:00}
      HEALTHCHECKS_BACKUP_URL: ${HEALTHCHECKS_BACKUP_URL:-}
      # Only for one-off restore and restore-check runs of this service; empty for the bot.
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:-}
      RESTORE_DATABASE_CA_CERT: ${RESTORE_DATABASE_CA_CERT:-}
    healthcheck:
      test: [CMD, bun, -e, "const r=await fetch('http://localhost:3000/health/ready');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      # A new bot is unready while it backs up, migrates and waits for the writer lease.
      start_period: 300s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    read_only: true
    tmpfs: ["/tmp:size=1m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # The same pinned updater and flags as production (see docker-compose.production.yml), following
  # the `staging` tags. The Docker socket is root-equivalent on this Docker host.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1.23.2@sha256:62fb91130ddb493f869cad7e198fa260dd16c5da293ed092cbd5d8781566f7a6
    labels:
      com.centurylinklabs.watchtower.scope: tarubot
    command:
      - --label-enable
      - --scope
      - tarubot
      - --interval
      - "300"
      - --stop-timeout
      - 40s
      - --include-restarting
      - --cleanup
      - --no-startup-message
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    logging: *logging
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
