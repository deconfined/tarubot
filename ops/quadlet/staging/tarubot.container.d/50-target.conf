# Staging's target (#50). The staging host links ~/.config/containers/systemd/tarubot-target to
# ~/tarubot/ops/quadlet/staging, and Quadlet finds this drop-in for units/tarubot.container there.
# It adds staging's settings after the base list; it may change nothing else
# (tests/unit/quadlet.test.ts). The path uses %h because a relative one would resolve against the
# unit's directory, not this one.
[Container]
EnvironmentFile=%h/tarubot/ops/quadlet/staging/target.env
