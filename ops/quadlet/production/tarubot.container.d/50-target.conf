# Production's target (#50). A production host links ~/.config/containers/systemd/tarubot-target
# to ~/tarubot/ops/quadlet/production, and Quadlet finds this drop-in for units/tarubot.container
# there. It adds production's settings after the base list, and the GitHub App's private key as a
# secret mounted like the unit's own (/suggest posts only in production); it may change nothing
# else (tests/unit/quadlet.test.ts). The path uses %h because a relative one would resolve against
# the unit's directory, not this one.
[Container]
EnvironmentFile=%h/tarubot/ops/quadlet/production/target.env
Secret=tarubot-github-app-private-key,type=mount,target=/run/secrets/github_app_private_key,uid=1000,gid=1000,mode=0400
