# Production's target (#50). A production host links ~/.config/containers/systemd/tarubot-target
# to ~/tarubot/ops/quadlet/production, and Quadlet finds this drop-in for units/tarubot.container
# there. It adds production's settings after the base list; it may change nothing else
# (tests/unit/quadlet.test.ts). The path uses %h because a relative one would resolve against the
# unit's directory, not this one.
[Container]
EnvironmentFile=%h/tarubot/ops/quadlet/production/target.env
