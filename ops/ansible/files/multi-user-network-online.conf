# Installed by TaruBot's host playbook as /etc/systemd/system/multi-user.target.d/50-tarubot.conf
# (#62). Every boot reaches network-online.target (and so tarubot-ipv6-online.service). Quadlet's
# podman-user-wait-network-online.service, in tarubot's user manager, only waits for that target;
# a user unit can't pull in a system target itself.
[Unit]
Wants=network-online.target
