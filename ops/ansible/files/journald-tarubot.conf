# Installed by TaruBot's host playbook as /etc/systemd/journald.conf.d/50-tarubot.conf (#50).
# The bot logs to the journal (LogDriver=journald), and deploys read the writer-lease lines of each
# container from tarubot's own journal file, so the journal must survive reboots and keep per-user
# files. EL10 keeps it in memory only by default.
[Journal]
Storage=persistent
# Replaces Docker's 10 MB x 5 log files; a removed container's lines stay until this cap rotates.
SystemMaxUse=1G
# One file per user for UIDs outside the system range (tarubot's is 1000 or higher).
SplitMode=uid
