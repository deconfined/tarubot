# Installed by TaruBot's host playbook as /etc/systemd/journald.conf.d/50-tarubot.conf (#62).
# The bot and its backup log to the journal (LogDriver=journald), so the journal must survive
# reboots and keep a file per user: tarubot then reads its own lines with journalctl --user.
# EL10 keeps the journal in memory only by default.
[Journal]
Storage=persistent
# A removed container's lines stay until this cap rotates them.
SystemMaxUse=1G
# One file per user for UIDs outside the system range (tarubot's is 1000 or higher).
SplitMode=uid
