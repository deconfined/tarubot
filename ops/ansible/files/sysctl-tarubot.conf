# Installed by TaruBot's host playbook as /etc/sysctl.d/90-tarubot.conf (#62).

# Hardening. A process may attach (ptrace) to its own descendants only, so one process running as
# tarubot, such as something escaping the bot's container, can't read or steer another.
kernel.yama.ptrace_scope = 1

# Only CAP_SYS_ADMIN may push input into a terminal (TIOCSTI). Otherwise a process running as
# tarubot in a root terminal, such as a `runuser -u tarubot` from a root shell, could queue
# keystrokes that root's shell runs once it exits. EL10's kernel still allows it by default.
dev.tty.legacy_tiocsti = 0

# No temporary (privacy) IPv6 addresses: outbound IPv6 must come from the host's stable address,
# which is the one on the database's access list.
net.ipv6.conf.all.use_tempaddr = 0
net.ipv6.conf.default.use_tempaddr = 0
