# Installed by TaruBot's host playbook as /etc/sysctl.d/90-tarubot.conf (#50).

# A process may attach to its own descendants only. Ansible's tasks run as tarubot are then out of
# reach of any other process running as tarubot.
kernel.yama.ptrace_scope = 1

# Only CAP_SYS_ADMIN may push input into a terminal (TIOCSTI). Otherwise code running as tarubot in
# a root terminal, such as a `su` or `runuser` from a root shell, could queue keystrokes that root's
# shell runs once that code exits. EL10's kernel still allows it by default.
dev.tty.legacy_tiocsti = 0

# No temporary (privacy) IPv6 addresses: outbound IPv6 must come from the stable address that is
# on the database's access list.
net.ipv6.conf.all.use_tempaddr = 0
net.ipv6.conf.default.use_tempaddr = 0
