# Installed by TaruBot's host playbook as /etc/ssh/sshd_config.d/00-tarubot.conf (#62), replacing
# the one-line seed cloud-init writes at the same path on the first boot.
# sshd keeps the first value it reads for each setting. The main sshd_config includes this
# directory before its own settings, and 00- sorts before EL's drop-ins (including cloud-init's
# 50-cloud-init.conf and the 01- file EL writes when root password login is enabled), so these
# values win. The playbook checks the effective settings with sshd -T after installing this file.

# Keys only: no passwords, no keyboard-interactive prompts, no Kerberos. A console password that
# cloud-init may set for root works only on the provider's console.
PasswordAuthentication no
KbdInteractiveAuthentication no
GSSAPIAuthentication no

# root is the only account that logs in over SSH, and only with a key: the owner's FIDO2 key,
# an optional operator key and the Configure key, all written by cloud-init. The tarubot account
# has no SSH login; operators reach it from root with run0 --user=tarubot.
PermitRootLogin prohibit-password
AllowUsers root

# A FIDO key (sk-...) must prove user verification, its PIN or biometric, on every login, not just
# a touch. cloud-init drops the options on root's key lines, verify-required included, so sshd
# enforces it here for every key. It affects FIDO keys only: plain ssh-ed25519 keys, such as the
# Configure key, carry no verification flag to check.
PubkeyAuthOptions verify-required

# A server with no display: EL's 50-redhat.conf would turn X11 forwarding on.
X11Forwarding no

# Nothing on these hosts needs forwarding: no TCP ports or Unix sockets (such as those under
# /run/user) through SSH, no agent, and no ~/.ssh/rc run at login.
DisableForwarding yes
PermitUserRC no

# One Ed25519 host key, so the host has one fingerprint. The Deploy job the owner approves pins it
# on first use (2.37.0): it scans the new host once and stores the key in the pin store beside
# OpenTofu's state (tarubot/pins/<staging|prod>.json), before any login. Every Configure and
# deploy after that connects only if the host still shows this key.
HostKey /etc/ssh/ssh_host_ed25519_key
