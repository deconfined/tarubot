# Installed by TaruBot's host playbook as /etc/ssh/sshd_config.d/00-tarubot.conf (#50).
# sshd keeps the first value it reads for each setting. The main sshd_config includes this
# directory before its own settings, and 00- sorts before EL's drop-ins (including the 01- file EL
# writes when root password login is enabled), so these values win.

# Keys only: no passwords, no keyboard-interactive prompts, no Kerberos.
PasswordAuthentication no
KbdInteractiveAuthentication no
GSSAPIAuthentication no

# root logs in with a key only: the break-glass key. The provider's console is the fallback.
PermitRootLogin prohibit-password

# A server with no display: EL's 50-redhat.conf would turn X11 forwarding on.
X11Forwarding no

# Nothing on these hosts needs forwarding: no TCP ports or Unix sockets (such as those under
# /run/user) through SSH, no agent, and no ~/.ssh/rc run at login. The deploy key's restrict
# already turns these off for its own line; this covers the operator and break-glass keys too.
DisableForwarding yes
PermitUserRC no

# One Ed25519 host key, so the host has one fingerprint to publish and pin. The playbook masks
# the units that would generate RSA and ECDSA keys.
HostKey /etc/ssh/ssh_host_ed25519_key

# tarubot's keys come from a root-owned file the playbook writes from the host settings: the deploy
# key's restricted line and the operator keys. tarubot can't grant itself access through ~/.ssh.
# A Match block in an included file ends at the end of that file.
Match User tarubot
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
