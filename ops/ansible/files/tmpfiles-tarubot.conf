# TaruBot's host lock (#50, 2.33.0), installed by the host playbook as /etc/tmpfiles.d/tarubot.conf.
# systemd-tmpfiles creates it at every boot (/run is a tmpfs) and whenever the playbook runs, and
# sets the mode and owner of what is already there. ops/deploy.sh's Quadlet modes hold
# /run/tarubot/host.lock with flock around every change, the playbook's user-manager commands take
# it, and the pull unit (2.34.0) will hold it around a whole run. Root owns the directory and the
# file, so no root process ever opens a file the tarubot user could replace; flock needs only read
# access, so everyone opens it read-only. tests/unit/playbook.test.ts pins these two lines to
# deploy.sh's QUADLET_LOCK.
d /run/tarubot 0755 root root -
f /run/tarubot/host.lock 0644 root root -
