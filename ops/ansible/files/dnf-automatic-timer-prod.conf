# Installed by TaruBot's host playbook on prod only (tarubot_role=prod), as
# /etc/systemd/system/dnf-automatic.timer.d/50-tarubot.conf (#62, answer 3; named for prod since
# 2.37.0). dnf-automatic.timer's own schedule is 06:00 with a random delay of up to an hour, which
# staging keeps. Prod runs four hours later, so an update that breaks the bot, or its reboot, shows
# on staging first. The empty line clears the unit's OnCalendar; the delay and Persistent= stay.
[Timer]
OnCalendar=
OnCalendar=*-*-* 10:00:00 UTC
