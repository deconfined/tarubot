# Installed by TaruBot's host playbook (#50, 2.34.0) on production only, as
# /etc/systemd/system/tarubot-host-config.timer.d/10-production.conf: the pull unit polls every 10
# minutes there instead of 5. The empty OnCalendar= clears the timer's own schedule first; without
# it systemd would keep both. Like the timer, it changes no namespace option (the service's header
# says why it has none).
[Timer]
OnCalendar=
OnCalendar=*:0/10
