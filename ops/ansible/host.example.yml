---
# site.yml's one setting (#62), for a hand run from the owner's machine while Actions is down:
#
#   ansible-playbook -i INVENTORY site.yml -e @host.example.yml
#
# or, the same, -e tarubot_role=staging. The Configure step of .github/workflows/host.yml passes it
# with -e itself. site.yml reads no secrets and has no other settings: cloud-init owns the
# hostname, root's keys and root's password, and bot.yml takes the bot's settings.

# staging or prod. The two differ only in when dnf-automatic runs: staging at 06:00 UTC (plus up
# to an hour), prod at 10:00 UTC.
tarubot_role: staging
