---
# Actual staging acceptance, not a configure/preflight result. Called inside the target writer group.
# All host/tool/probe data stays no_log; only validated public release identity leaves the target.
- name: Verify the running staging release
  hosts: target
  gather_facts: false
  become: false
  no_log: true
  tasks:
    - name: Require the explicit staging acceptance request
      ansible.builtin.assert:
        that:
          - tarubot_target == 'staging'
          - tarubot_commit is match('^[0-9a-f]{40}$')
          - tarubot_digest is match('^sha256:[0-9a-f]{64}$')
          - tarubot_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
          - tarubot_schema_head is match('^[0-9]{3}_[a-z0-9_]+[.]sql$')
          - tarubot_publication_run is match('^[1-9][0-9]*$')
          - tarubot_acceptance is match('^/')
        quiet: true
    - name: Look up the runtime account
      ansible.builtin.getent:
        database: passwd
        key: tarubot
    - name: Record the private runtime context
      ansible.builtin.set_fact:
        accept_uid: "{{ ansible_facts.getent_passwd.tarubot[1] }}"
        accept_home: "{{ ansible_facts.getent_passwd.tarubot[4] }}"
    - name: Run the acceptance checks as the runtime user
      become: true
      become_user: tarubot
      vars:
        ansible_remote_tmp: /run/user/{{ accept_uid }}
      environment:
        XDG_RUNTIME_DIR: /run/user/{{ accept_uid }}
        DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/{{ accept_uid }}/bus
        PYTHONNOUSERSITE: "1"
      block:
        - name: Read the exact candidate image
          ansible.builtin.command:
            argv: [podman, image, inspect, "ghcr.io/deconfined/tarubot@{{ tarubot_digest }}"]
          register: accept_image
          changed_when: false
        - name: Require source and version labels on the candidate
          ansible.builtin.assert:
            that:
              - (accept_image.stdout | from_json)[0].Config.Labels['org.opencontainers.image.revision'] == tarubot_commit
              - (accept_image.stdout | from_json)[0].Config.Labels['org.opencontainers.image.version'] == tarubot_version
            quiet: true
        - name: Read the running container
          ansible.builtin.command:
            argv: [podman, container, inspect, tarubot]
          register: accept_first
          changed_when: false
        - name: Require the candidate healthy and running
          ansible.builtin.assert:
            that:
              - (accept_first.stdout | from_json)[0].Image == (accept_image.stdout | from_json)[0].Id
              - (accept_first.stdout | from_json)[0].State.Status == 'running'
              - (accept_first.stdout | from_json)[0].State.Health.Status == 'healthy'
              - (accept_first.stdout | from_json)[0].State.StartedAt is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T')
              - (accept_first.stdout | from_json)[0].RestartCount is integer
              - (accept_first.stdout | from_json)[0].RestartCount >= 0
            quiet: true
        - name: Verify live readiness and the exact database schema without migration
          ansible.builtin.command: &accept_readiness_probe
            argv:
              - podman
              - exec
              - tarubot
              - bun
              - -e
              - >-
                const r=await fetch('http://localhost:3000/health/ready');
                const s=await r.json();
                if(!r.ok||![s.ready,s.database,s.discord,s.writerLease].every(v=>v===true))process.exit(1);
                const{Database,SCHEMA_VERSION}=await import('/app/dist/src/infrastructure/postgres/database.js');
                const{secretSetting}=await import('/app/dist/src/config/secrets.js');
                if(SCHEMA_VERSION!==process.argv[1])process.exit(1);
                const d=new Database(secretSetting(process.env,'DATABASE_URL'));
                try{await d.schema();}finally{await d.close();}
              - "{{ tarubot_schema_head }}"
          changed_when: false
        - name: Read back the command inventory
          ansible.builtin.command:
            # Bind discovery to this candidate even if the installed default image file changes.
            argv:
              - "{{ accept_home }}/.local/bin/tarubot-tool"
              - --image
              - "ghcr.io/deconfined/tarubot@{{ tarubot_digest }}"
              - commands.js
              - list
          changed_when: false
        - name: Require the enabled active backup timer
          ansible.builtin.command:
            argv: [systemctl, --user, show, tarubot-backup.timer, --property=ActiveState, --property=UnitFileState]
          register: accept_timer
          changed_when: false
        - name: Check the timer result
          ansible.builtin.assert:
            that:
              - "'ActiveState=active' in accept_timer.stdout_lines"
              - "'UnitFileState=enabled' in accept_timer.stdout_lines"
            quiet: true
        - name: Refuse to mistake an already running backup for this acceptance backup
          ansible.builtin.command:
            argv: [systemctl, --user, is-active, tarubot-backup.service]
          register: accept_backup_before
          changed_when: false
          failed_when: accept_backup_before.rc != 3
        - name: Read the previous backup invocation before requesting a fresh run
          ansible.builtin.command:
            argv:
              - systemctl
              - --user
              - show
              - tarubot-backup.service
              - --property=ActiveState,InvocationID,ExecMainStartTimestampMonotonic
          register: accept_backup_previous
          changed_when: false
        - name: Require a stopped backup and a readable invocation baseline
          ansible.builtin.assert:
            that:
              - "'ActiveState=inactive' in accept_backup_previous.stdout_lines or 'ActiveState=failed' in accept_backup_previous.stdout_lines"
              - accept_backup_previous.stdout_lines | select('match', '^InvocationID=([0-9a-f]{32})?$') | list | length == 1
              - accept_backup_previous.stdout_lines | select('match', '^ExecMainStartTimestampMonotonic=[0-9]+$') | list | length == 1
            quiet: true
        - name: Run a fresh encrypted off-site backup and require its success
          ansible.builtin.systemd_service:
            name: tarubot-backup.service
            state: started
            scope: user
        - name: Read the completed backup invocation and exit status
          ansible.builtin.command:
            argv:
              - systemctl
              - --user
              - show
              - tarubot-backup.service
              - --property=ActiveState,SubState,InvocationID,ExecMainStartTimestampMonotonic,ExecMainExitTimestampMonotonic,ExecMainCode,ExecMainStatus,Result
          register: accept_backup_completed
          changed_when: false
        - name: Require a new successful completed backup invocation
          ansible.builtin.assert:
            # A timer may race a start request. Fresh invocation/start/exit evidence refuses a
            # no-op, a still-running job, a stale successful status or a failed upload.
            that:
              - "'ActiveState=inactive' in accept_backup_completed.stdout_lines"
              - "'SubState=dead' in accept_backup_completed.stdout_lines"
              - "'Result=success' in accept_backup_completed.stdout_lines"
              - "'ExecMainCode=1' in accept_backup_completed.stdout_lines"
              - "'ExecMainStatus=0' in accept_backup_completed.stdout_lines"
              - accept_backup_completed.stdout_lines | select('match', '^InvocationID=[0-9a-f]{32}$') | list | length == 1
              - "'InvocationID=00000000000000000000000000000000' not in accept_backup_completed.stdout_lines"
              - accept_backup_completed.stdout_lines | select('match', '^ExecMainStartTimestampMonotonic=[1-9][0-9]*$') | list | length == 1
              - accept_backup_completed.stdout_lines | select('match', '^ExecMainExitTimestampMonotonic=[1-9][0-9]*$') | list | length == 1
              - >-
                (accept_backup_completed.stdout_lines | select('match', '^InvocationID=') | first | default('')) !=
                (accept_backup_previous.stdout_lines | select('match', '^InvocationID=') | first | default(''))
              - >-
                (accept_backup_completed.stdout_lines | select('match', '^ExecMainStartTimestampMonotonic=') | first | default('=0')).split('=')[1] | int >
                (accept_backup_previous.stdout_lines | select('match', '^ExecMainStartTimestampMonotonic=') | first | default('=0')).split('=')[1] | int
              - >-
                (accept_backup_completed.stdout_lines | select('match', '^ExecMainExitTimestampMonotonic=') | first | default('=0')).split('=')[1] | int >=
                (accept_backup_completed.stdout_lines | select('match', '^ExecMainStartTimestampMonotonic=') | first | default('=0')).split('=')[1] | int
            quiet: true
        - name: Observe a no-restart stability interval after the acceptance work
          ansible.builtin.pause:
            seconds: 60
        - name: Recheck live readiness and the exact schema after the stability interval
          ansible.builtin.command: *accept_readiness_probe
          changed_when: false
        - name: Read the running container again
          ansible.builtin.command:
            argv: [podman, container, inspect, tarubot]
          register: accept_last
          changed_when: false
        - name: Require the same healthy candidate after backup and the stability interval
          ansible.builtin.assert:
            that:
              - (accept_last.stdout | from_json)[0].Id == (accept_first.stdout | from_json)[0].Id
              # Podman can restart a container without changing its ID.
              - (accept_last.stdout | from_json)[0].State.StartedAt == (accept_first.stdout | from_json)[0].State.StartedAt
              - (accept_last.stdout | from_json)[0].RestartCount == (accept_first.stdout | from_json)[0].RestartCount
              - (accept_last.stdout | from_json)[0].State.Status == 'running'
              - (accept_last.stdout | from_json)[0].State.Health.Status == 'healthy'
              - (accept_last.stdout | from_json)[0].Image == (accept_image.stdout | from_json)[0].Id
            quiet: true
        - name: Mark completed target acceptance
          ansible.builtin.set_fact:
            accept_completed: true

- name: Write only the bound public acceptance evidence
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Require all target checks to have completed
      ansible.builtin.assert:
        that:
          - hostvars['target'].accept_completed | default(false) | bool
        quiet: true
    - name: Write the public release result
      ansible.builtin.copy:
        dest: "{{ tarubot_acceptance }}"
        mode: "0600"
        content: >-
          {{ {'schema': 1, 'target': 'staging', 'outcome': 'accepted',
              'release': {'version': tarubot_version, 'commit': tarubot_commit,
                'digest': tarubot_digest, 'config_commit': tarubot_commit,
                'publication_run': tarubot_publication_run, 'schema_head': tarubot_schema_head},
              'checks': {'image': true, 'database': true, 'discord': true, 'writer_lease': true,
                'schema': true, 'commands': true, 'timer': true, 'backup': true, 'stability': true}}
             | to_json }}
