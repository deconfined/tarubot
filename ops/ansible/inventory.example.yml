---
# Example inventory for a hand run of TaruBot's playbooks (#62) from the owner's machine, while
# Actions is down. Copy it outside the repository (the repository names no host) and replace the
# placeholders. The Deploy workflow builds the same inventory on its runner from the host's pin
# (ops/tofu/ci/host.sh connect): one host, always called target, reached as root.
#
# The key is the environment's Configure key (ANSIBLE_SSH_KEY's private half), and
# known_hosts_tarubot holds one line, `target <the pin's host_key>`: the alias, then the host key
# the approving Deploy job pinned on first use. For a hand run, read the pin,
# tarubot/pins/<staging|prod>.json in the OpenTofu state bucket, with your own bucket credentials,
# and copy its host_key. HostKeyAlias makes ssh look the key up under that alias, whatever name or
# address reaches the host. AddressFamily=any tries IPv6 first where the name has an AAAA record
# and the machine has IPv6, and IPv4 otherwise.
all:
  hosts:
    target:
      ansible_host: staging.example.org
      ansible_user: root
      ansible_ssh_private_key_file: ~/.ssh/REPLACE_WITH_CONFIGURE_KEY
      ansible_ssh_common_args: >-
        -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=target
        -o UserKnownHostsFile=~/.ssh/known_hosts_tarubot -o AddressFamily=any
