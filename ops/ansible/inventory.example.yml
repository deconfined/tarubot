---
# Example inventory for a hand run of TaruBot's playbooks (#62) from the owner's machine, while
# Actions is down. Copy it outside the repository (the repository names no host) and replace the
# placeholders. The Deploy workflow builds the same inventory on its runner from the environment's
# secrets (.github/workflows/host.yml): one host, always called target, reached as root.
#
# The key is the environment's Configure key (ANSIBLE_SSH_KEY's private half), and
# known_hosts_tarubot holds one line, `target <TARGET_HOST_KEY>`: the alias, then the host key the
# owner pinned after the build (ops/tofu/README.md, "Pinning a new host key"). HostKeyAlias makes
# ssh look the key up under that alias, whatever name or address reaches the host.
# AddressFamily=any tries IPv6 first where the name has an AAAA record and the machine has IPv6,
# and IPv4 otherwise.
all:
  hosts:
    target:
      ansible_host: staging.example.org
      ansible_user: root
      ansible_ssh_private_key_file: ~/.ssh/REPLACE_WITH_CONFIGURE_KEY
      ansible_ssh_common_args: >-
        -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=target
        -o UserKnownHostsFile=~/.ssh/known_hosts_tarubot -o AddressFamily=any
