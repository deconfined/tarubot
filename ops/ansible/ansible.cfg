# Configuration for TaruBot's host playbook (#50). Point ANSIBLE_CONFIG at this file, or run from
# this directory: ansible reads ./ansible.cfg only when the directory isn't world-writable. On a
# host, run only from a root-owned checkout that tarubot can't write, never from ~tarubot/tarubot:
# this file and the playbook beside it decide what root runs (site.yml's header).
# ansible-core 2.16 (AlmaLinux 10.2's AppStream version) refuses to start under LC_ALL=C, so run
# it under a UTF-8 locale such as C.UTF-8.

[defaults]
# Facts stay under ansible_facts and never become top-level variables. A task run as tarubot
# could otherwise return facts that override a setting a later root task reads (site.yml's rules).
inject_facts_as_vars = False
# ansible.builtin only: no Galaxy roles or collections. /dev/null holds no collections, and
# Python's own path isn't searched either, so a collection installed elsewhere on the machine
# running the playbook can't shadow a builtin module.
collections_path = /dev/null
collections_scan_sys_path = False
roles_path = /dev/null
# ansible-core 2.16 doesn't know EL10 and would guess, with a warning, on every run.
interpreter_python = /usr/bin/python3
# Refuse an unknown host key rather than trusting it on first use.
host_key_checking = True
retry_files_enabled = False
duplicate_dict_key = error
nocows = True

[inventory]
# A typo in the inventory fails the run instead of leaving an empty host list.
unparsed_is_failed = True

[privilege_escalation]
# site.yml's second play runs as tarubot, reached from root through sudo (root needs no password).
become_method = sudo

[connection]
# Modules reach the host over stdin rather than as files in a temporary directory, for the ssh and
# local connections alike (only the ssh plugin reads [ssh_connection]). This is defence in depth,
# not the boundary: a module run as tarubot still unpacks itself into a directory tarubot owns, so
# code running as tarubot can change what a tarubot task does. The boundary is site.yml's rule that
# no root task follows the tarubot play. The acl package covers any module that needs a file.
pipelining = True
