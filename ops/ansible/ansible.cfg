# Configuration for TaruBot's playbooks (#62): site.yml, which configures a host, and bot.yml, which
# deploys the bot on it. The controller is a GitHub-hosted runner, in the Deploy workflow's host job
# (.github/workflows/host.yml), or the owner's own machine for a hand run while Actions is down.
# The hosts carry only Python. Point ANSIBLE_CONFIG at this file, and run under a UTF-8 locale such
# as C.UTF-8: ansible-core refuses LC_ALL=C.

[defaults]
# Facts stay under ansible_facts and never become top-level variables, so a fact can't shadow a
# playbook variable of the same name.
inject_facts_as_vars = False
# ansible.builtin only: no Galaxy roles or collections. /dev/null holds no collections, and
# Python's own path isn't searched either, so a collection installed elsewhere on the controller
# can't shadow a builtin module.
collections_path = /dev/null
collections_scan_sys_path = False
roles_path = /dev/null
# The hosts' own Python (AlmaLinux 10's 3.12), with no interpreter discovery on each run.
interpreter_python = /usr/bin/python3
# Refuse an unknown host key rather than trusting it: the inventory names the one pinned key.
host_key_checking = True
retry_files_enabled = False
duplicate_dict_key = error
nocows = True
# Modules never log their arguments to the host's journal, so nothing a task passes, such as a
# secret fed to podman on stdin by bot.yml, reaches a host log.
no_target_syslog = True

[inventory]
# A typo in the inventory fails the run instead of leaving an empty host list.
unparsed_is_failed = True

[privilege_escalation]
# bot.yml runs its tasks as tarubot, reached from root through sudo (root needs no password).
become_method = sudo

[connection]
# Modules reach the host over the SSH session's stdin rather than as files in a temporary
# directory: fewer round trips, and nothing a task sends sits on the host's disk.
pipelining = True

[ssh_connection]
# A dropped connection (a runner's network blip, sshd reloading) is retried up to three times.
retries = 3
