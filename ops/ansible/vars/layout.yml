---
# site.yml's fixed layout (#62). The one setting, the host's role, arrives as an extra var
# (-e tarubot_role=staging|production; host.example.yml), and tb_role only reads it once, so every
# task uses the same value. site.yml asserts it before anything changes.

# staging or production. They differ only in when dnf-automatic runs (tb_production_timer).
tb_role: "{{ tarubot_role | default('') }}"

# The account the bot runs as, under rootless Podman. Nothing logs in as it over SSH (the sshd
# drop-in allows root only); operators reach it from root with run0 --user=tarubot.
tb_user: tarubot
tb_home: /home/tarubot

# Packages from AlmaLinux's own repositories, installed if missing and never upgraded by the
# playbook: dnf-automatic is the hosts' only updater after the first Configure.
# - podman, crun, passt, container-selinux: rootless Podman, its runtime, its network and its
#   SELinux policy.
# - acl: lets a task run as tarubot read the files Ansible uploads as root.
# - chrony: the clock. dnf-automatic: the updater. dnf-plugins-core: needs-restarting, which
#   dnf-automatic's reboot = when-needed runs.
# - polkit: the rule in files/polkit-10-tarubot.rules needs it installed to take effect.
# - python3-libselinux: Ansible's file tasks on an SELinux host (cloud-init installs it first).
# - sudo: how bot.yml becomes tarubot from root; tarubot itself has no sudo rights.
tb_packages:
  - podman
  - crun
  - passt
  - container-selinux
  - acl
  - chrony
  - dnf-automatic
  - dnf-plugins-core
  - polkit
  - python3-libselinux
  - sudo

# From EPEL, which epel-release enables: age, which encrypts the backups.
tb_epel_packages:
  - age

# Production's drop-in for dnf-automatic's timer (files/dnf-automatic-timer-production.conf). It
# moves production's updates to 10:00 UTC, after staging's 06:00 run and its random delay of up
# to an hour. On staging the playbook makes sure it is absent.
tb_production_timer: /etc/systemd/system/dnf-automatic.timer.d/50-tarubot.conf
