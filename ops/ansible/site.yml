---
# TaruBot's host configuration (#62): the host layer of the staging and production hosts, which run
# AlmaLinux 10 with SELinux enforcing and the bot as a rootless Quadlet unit under the tarubot
# account. The Configure step of the Deploy workflow's host job (.github/workflows/host.yml) runs it
# from main's head, on a GitHub runner, as root over SSH, before the release's own bot.yml deploys
# the bot:
#
#   ansible-playbook -i INVENTORY site.yml -e tarubot_role=staging|production
#
# Its one input is tarubot_role. It reads no secrets and nothing from the controller's
# environment: every other value is in this file or vars/layout.yml.
#
# Who owns what on a host:
# - OpenTofu builds the machine (ops/tofu/). cloud-init, from Tofu's user data, owns the hostname,
#   root's SSH keys and root's password (an optional console hash, or locked), turns password SSH
#   off and installs python3-libselinux. Nothing here writes any of those.
# - This playbook owns the rest of the host: packages, updates, time, kernel settings, the
#   journal, the boot's network wait, sshd, su and polkit, and the tarubot account.
# - bot.yml owns everything under tarubot's home: the bot's unit, its secrets, its settings and
#   the backup timer.
#
# dnf-automatic is the hosts' only updater. A new host (one with no tarubot account yet) is
# upgraded in full and rebooted once, on its first Configure; after that the playbook installs only
# what is missing and never upgrades a package.
#
# It is idempotent: a second run reports changed=0. For a hand run while Actions is down, from the
# owner's machine with requirements.txt's pins (inventory.example.yml says how to reach the host,
# host.example.yml holds the role):
#
#   cd ops/ansible
#   LC_ALL=C.UTF-8 ANSIBLE_CONFIG="$PWD/ansible.cfg" ansible-playbook -i INVENTORY site.yml \
#     -e @host.example.yml
#
# The workflow's logs are public, so its runs print task names and results only: no file diffs and
# no verbose output, and no task here reads a secret.

- name: Configure a TaruBot host as root
  hosts: all
  become: false
  gather_facts: false
  # One host per run, so a failure anywhere stops the run.
  any_errors_fatal: true
  # A task that fails after others changed a unit or a drop-in still leaves their reloads run, so
  # the host never keeps a changed file that systemd, sshd or journald hasn't read.
  force_handlers: true
  vars_files:
    - vars/layout.yml

  tasks:
    # ------------------------------------------------------------------------------------------
    # Checks, before anything changes.

    # cloud-init writes root's keys and installs python3-libselinux, which Ansible's file tasks
    # need under SELinux, on the first boot. Exit 0 is done, 2 is done with a recoverable error
    # (degraded; the checks below still decide), and anything else is a failure.
    - name: Wait for cloud-init to finish
      ansible.builtin.command:
        argv:
          - cloud-init
          - status
          - --wait
      register: tb_cloud_init
      changed_when: false
      failed_when: tb_cloud_init.rc not in [0, 2]
      check_mode: false

    # Just what the check below needs; no local facts (/etc/ansible/facts.d) and no hardware scan.
    - name: Read the facts the checks need
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - distribution
          - platform
          - selinux
          - cmdline
          - user

    - name: Refuse anything but root on AlmaLinux 10 with SELinux enforcing, or an unknown role
      ansible.builtin.assert:
        that:
          - ansible_facts.user_uid == 0
          - ansible_facts.distribution == 'AlmaLinux'
          - ansible_facts.distribution_major_version == '10'
          - ansible_facts.architecture == 'x86_64'
          - ansible_facts.selinux.status | default('') == 'enabled'
          - ansible_facts.selinux.mode | default('') == 'enforcing'
          - ansible_facts.selinux.config_mode | default('') == 'enforcing'
          # Neither selinux=0 nor enforcing=0 on the kernel's command line.
          - "'0' not in ([ansible_facts.proc_cmdline.selinux | default('1')] | flatten)"
          - "'0' not in ([ansible_facts.proc_cmdline.enforcing | default('1')] | flatten)"
          - tb_role in ['staging', 'production']
        fail_msg: >-
          This playbook runs as root on AlmaLinux 10 (x86_64) with SELinux enforcing, in the
          configuration and on the kernel command line, and python3-libselinux installed (cloud-init
          installs it); never lower SELinux to make it pass. tarubot_role must be staging or
          production.
        quiet: true

    - name: Look up the tarubot account
      ansible.builtin.getent:
        database: passwd
        key: "{{ tb_user }}"
        fail_key: false

    # The account is created near the end of a run, so its absence means no Configure has
    # finished on this host yet: it is new.
    - name: Record whether this is the host's first Configure
      ansible.builtin.set_fact:
        tb_first_configure: "{{ ansible_facts.getent_passwd[tb_user] is none }}"

    # ------------------------------------------------------------------------------------------
    # A new host only: everything up to date, then one reboot onto the new kernel and libraries.
    # After this, dnf-automatic alone updates the host. Every dnf task waits up to five minutes for
    # the package lock, which dnf-automatic may hold.
    - name: Upgrade every package on a new host
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: true
        lock_timeout: 300
      when: tb_first_configure

    # Unconditional on a new host: needs-restarting, which could say whether it is needed, comes
    # with dnf-plugins-core, which isn't installed yet.
    - name: Reboot a new host onto the upgraded packages
      ansible.builtin.reboot:
        reboot_timeout: 900
      when: tb_first_configure

    # ------------------------------------------------------------------------------------------
    # Packages: installed if missing, never upgraded here.
    - name: Install the host's packages from AlmaLinux's repositories
      ansible.builtin.dnf:
        name: "{{ tb_packages }}"
        state: present
        lock_timeout: 300

    # AlmaLinux ships epel-release in its own extras repository, with EPEL's key.
    - name: Enable EPEL
      ansible.builtin.dnf:
        name: epel-release
        state: present
        lock_timeout: 300
      register: tb_epel

    - name: Install age from EPEL
      ansible.builtin.dnf:
        name: "{{ tb_epel_packages }}"
        state: present
        lock_timeout: 300
      # In check mode EPEL may not be enabled yet, so dnf couldn't find age.
      when: not (ansible_check_mode and tb_epel is changed)

    # What is installed now, for the services below that a check run may not have installed yet,
    # and for rpcbind, which the image may or may not carry.
    - name: Read the installed packages
      ansible.builtin.package_facts:
        manager: rpm

    # ------------------------------------------------------------------------------------------
    # Updates: dnf-automatic applies every update daily and reboots when one needs it (#62,
    # answer 3). Production runs four hours after staging, through a timer drop-in.
    - name: Configure dnf-automatic, the hosts' only updater
      ansible.builtin.template:
        src: dnf-automatic.conf.j2
        dest: /etc/dnf/automatic.conf
        owner: root
        group: root
        mode: "0644"

    - name: Create the dnf-automatic timer's drop-in directory (production)
      ansible.builtin.file:
        path: "{{ tb_production_timer | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: tb_role == 'production'

    - name: Run production's updates at 10:00 UTC, after staging's
      ansible.builtin.copy:
        src: dnf-automatic-timer-production.conf
        dest: "{{ tb_production_timer }}"
        owner: root
        group: root
        mode: "0644"
      when: tb_role == 'production'
      notify:
        - Reload systemd
        - Restart the dnf-automatic timer

    - name: Keep staging on the timer's own schedule (06:00 UTC)
      ansible.builtin.file:
        path: "{{ tb_production_timer }}"
        state: absent
      when: tb_role == 'staging'
      notify:
        - Reload systemd
        - Restart the dnf-automatic timer

    - name: Run dnf-automatic daily
      ansible.builtin.systemd_service:
        name: dnf-automatic.timer
        enabled: true
        state: started
      when: "'dnf-automatic' in ansible_facts.packages"

    # ------------------------------------------------------------------------------------------
    # Time.
    - name: Keep the clock in UTC
      ansible.builtin.file:
        src: ../usr/share/zoneinfo/UTC
        dest: /etc/localtime
        state: link
        force: true
        follow: false

    - name: Keep chrony synchronising the clock
      ansible.builtin.systemd_service:
        name: chronyd.service
        enabled: true
        state: started
      when: "'chrony' in ansible_facts.packages"

    # ------------------------------------------------------------------------------------------
    # Kernel settings and services the hosts don't need.
    - name: Create sysctl's drop-in directory
      ansible.builtin.file:
        path: /etc/sysctl.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Set the kernel settings (ptrace, terminal input injection, a stable IPv6 address)
      ansible.builtin.copy:
        src: sysctl-tarubot.conf
        dest: /etc/sysctl.d/90-tarubot.conf
        owner: root
        group: root
        mode: "0644"
      notify: Apply the sysctl settings

    - name: Stop and mask rpcbind, which listens on port 111 and serves nothing here
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        masked: true
      loop:
        - rpcbind.socket
        - rpcbind.service
      when: "'rpcbind' in ansible_facts.packages"

    # ------------------------------------------------------------------------------------------
    # The journal, and the boot's wait for the network and IPv6.
    - name: Create journald's drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Keep the journal on disk, capped, with per-user files
      ansible.builtin.copy:
        src: journald-tarubot.conf
        dest: /etc/systemd/journald.conf.d/50-tarubot.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart journald

    - name: Create multi-user.target's drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/multi-user.target.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Make every boot reach network-online.target, which Quadlet's wait unit only polls
      ansible.builtin.copy:
        src: multi-user-network-online.conf
        dest: /etc/systemd/system/multi-user.target.d/50-tarubot.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Install the IPv6 wait script
      ansible.builtin.copy:
        src: tarubot-ipv6-online
        dest: /usr/local/sbin/tarubot-ipv6-online
        owner: root
        group: root
        mode: "0755"

    - name: Install the IPv6 wait unit, ordered before network-online.target
      ansible.builtin.copy:
        src: tarubot-ipv6-online.service
        dest: /etc/systemd/system/tarubot-ipv6-online.service
        owner: root
        group: root
        mode: "0644"
      register: tb_ipv6_unit
      notify: Reload systemd

    # Enabled only: it first runs at the next boot, since running it now would only wait for an
    # address the host already has. systemd reads a new or changed unit file first.
    - name: Enable the IPv6 wait unit
      ansible.builtin.systemd_service:
        name: tarubot-ipv6-online.service
        enabled: true
        daemon_reload: "{{ tb_ipv6_unit is changed }}"
      # In check mode the unit file may not be there yet.
      when: not (ansible_check_mode and tb_ipv6_unit is changed)

    # ------------------------------------------------------------------------------------------
    # SSH: keys only, root only, a verified FIDO key, one host key.
    - name: Install the sshd drop-in over cloud-init's seed, checked on its own first
      ansible.builtin.copy:
        src: sshd-00-tarubot.conf
        dest: /etc/ssh/sshd_config.d/00-tarubot.conf
        owner: root
        group: root
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd

    # sshd -T reads the files on disk, so this sees the drop-in above before the reload.
    - name: Read sshd's effective settings for root
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
          - -C
          - user=root,host=localhost,addr=127.0.0.1
      register: tb_sshd_effective
      changed_when: false
      # In check mode the drop-in isn't in place, so the result would describe the old settings.
      when: not ansible_check_mode

    - name: Refuse sshd settings other than the drop-in's
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in tb_sshd_effective.stdout_lines"
          - "'kbdinteractiveauthentication no' in tb_sshd_effective.stdout_lines"
          - "'gssapiauthentication no' in tb_sshd_effective.stdout_lines"
          # OpenSSH 9.9 prints prohibit-password under its older name.
          - >-
            'permitrootlogin without-password' in tb_sshd_effective.stdout_lines
            or 'permitrootlogin prohibit-password' in tb_sshd_effective.stdout_lines
          - "'pubkeyauthoptions verify-required' in tb_sshd_effective.stdout_lines"
          - "'allowusers root' in tb_sshd_effective.stdout_lines"
          - "'x11forwarding no' in tb_sshd_effective.stdout_lines"
          - "'disableforwarding yes' in tb_sshd_effective.stdout_lines"
          - "'permituserrc no' in tb_sshd_effective.stdout_lines"
          - >-
            tb_sshd_effective.stdout_lines | select('match', '^hostkey ') | list
            == ['hostkey /etc/ssh/ssh_host_ed25519_key']
          # Without a console hash, cloud-init locks root's password, and sshd admits a key login
          # to a locked account only through PAM.
          - "'usepam yes' in tb_sshd_effective.stdout_lines"
        fail_msg: >-
          sshd's effective settings for root don't match 00-tarubot.conf; another drop-in wins.
        quiet: true
      when: not ansible_check_mode

    # ------------------------------------------------------------------------------------------
    # root's console password, if cloud-init set one, stays on the console: su needs the wheel
    # group, which has no members on these hosts, and polkit refuses pkexec and run0 to everyone
    # but root.
    - name: Let only the wheel group use su
      ansible.builtin.lineinfile:
        path: /etc/pam.d/su
        # EL ships the line commented out; this uncomments it, or adds it after pam_rootok.
        regexp: '^#?\s*auth\s+required\s+pam_wheel\.so\s+use_uid\s*$'
        line: "auth\t\trequired\tpam_wheel.so use_uid"
        insertafter: '^auth\s+sufficient\s+pam_rootok\.so'

    - name: Refuse every polkit request from anyone but root
      ansible.builtin.copy:
        src: polkit-10-tarubot.rules
        dest: /etc/polkit-1/rules.d/10-tarubot.rules
        owner: root
        group: root
        mode: "0644"

    # ------------------------------------------------------------------------------------------
    # The tarubot account: no supplementary groups, no sudo, no password and no SSH login (sshd's
    # AllowUsers root). EL10 runs pam_umask for sessions and for the user manager, and it reads
    # the umask= field in the GECOS first, so tarubot's umask stays 0022 whatever login.defs says.
    - name: Create the tarubot account
      ansible.builtin.user:
        name: "{{ tb_user }}"
        comment: TaruBot,umask=0022
        home: "{{ tb_home }}"
        create_home: true
        shell: /bin/bash
        groups: []
        append: false
        password_lock: true
        system: false
        state: present

    - name: Let tarubot's user manager run without a login, for the bot's unit and the backup timer
      ansible.builtin.command:
        argv:
          - loginctl
          - enable-linger
          - "{{ tb_user }}"
        creates: /var/lib/systemd/linger/{{ tb_user }}

  handlers:
    # Handlers run in this order, whatever order they were notified in: systemd reads changed
    # units before the timer restarts.
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    # journald can't reload its configuration; a restart keeps its sockets, so nothing is lost.
    - name: Restart journald
      ansible.builtin.systemd_service:
        name: systemd-journald.service
        state: restarted
      notify: Move the in-memory journal to disk

    - name: Move the in-memory journal to disk
      ansible.builtin.command:
        argv:
          - journalctl
          - --flush
      changed_when: true

    - name: Apply the sysctl settings
      ansible.builtin.command:
        argv:
          - /usr/sbin/sysctl
          - -q
          - -p
          - /etc/sysctl.d/90-tarubot.conf
      changed_when: true

    # sshd -t reads the whole configuration, drop-ins included; if it fails, the reload never runs
    # and the running sshd keeps its old settings.
    - name: Check the whole sshd configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false
      listen: Reload sshd

    - name: Reload sshd with the checked configuration
      ansible.builtin.systemd_service:
        name: sshd.service
        state: reloaded
      listen: Reload sshd

    # A timer computes its next run when it starts, so a changed schedule needs a restart.
    - name: Restart the dnf-automatic timer
      ansible.builtin.systemd_service:
        name: dnf-automatic.timer
        state: restarted
