---
# TaruBot's host playbook (#50): the host layer of the staging and production hosts. Both run
# AlmaLinux 10 with SELinux enforcing, and the bot runs as a rootless Quadlet unit under the tarubot
# user's systemd. The unit belongs to the release (ops/quadlet/); this playbook prepares the host
# around it and never links, starts, stops or restarts the bot. The start tag, which links the
# release's unit and starts it for the first time, arrives with 2.33.0 (#50 part 2); runs already
# pass --skip-tags start, which changes nothing before then, so the commands stay the same.
#
# Run it as root, with this directory's ansible.cfg and a UTF-8 locale, and always check first:
#
#   cd ops/ansible
#   LC_ALL=C.UTF-8 ansible-playbook -i INVENTORY site.yml -e @HOST.yml --check --diff --skip-tags start
#   LC_ALL=C.UTF-8 ansible-playbook -i INVENTORY site.yml -e @HOST.yml --skip-tags start
#
# INVENTORY says only how to reach the host (inventory.example.yml), and HOST.yml holds the host's
# settings (host.example.yml). Both live outside the repository, which names no host. The playbook
# assumes nothing about the machine that runs it, so a host can also apply it to itself as root, as
# the pull unit will (#50 part 2):
#
#   ansible-playbook -c local -i localhost, site.yml -e @/etc/tarubot/host.yml --skip-tags start
#
# Only ever from a root-owned checkout that tarubot can't write, such as the pull unit's own clone
# in /var/lib/tarubot-config/repo (2.33.0), and never from ~tarubot/tarubot or anything else under
# /home. Ansible runs this file, reads ansible.cfg from its directory and loads the files beside it,
# so a checkout tarubot can write would hand root to tarubot. No check in this file can catch
# that, because a changed copy would simply leave the check out.
#
# Rules that keep code running as tarubot from steering anything root does (tests/unit/
# playbook.test.ts enforces the checkable ones):
# - Two plays. The first runs as root and writes only system paths: /etc, /usr/local, /root,
#   system and global user units, lingering and sysctl. It only looks at tarubot's home. The
#   second and last play runs every task in tarubot's context (become_user), and nothing runs as
#   root after it, so no root task reads what a tarubot task returned. This is the boundary: code
#   running as tarubot can change what a tarubot task does, and even with pipelining a tarubot
#   module unpacks itself into a directory tarubot owns. PYTHONNOUSERSITE, ptrace_scope=1 and
#   legacy_tiocsti=0 are defence in depth.
# - Facts are gathered once, at the start, and stay under ansible_facts
#   (inject_facts_as_vars = False in ansible.cfg).
# - Settings arrive only as extra vars. Nothing in this directory sets them: there are no
#   group_vars, host_vars, roles, library or plugin directories, which Ansible would load from
#   beside this file, and vars/layout.yml only reads them.
# - ansible.builtin only, with no lookups or delegation. Every file task sets its mode, and the
#   playbook reads nothing from outside this directory.
# - Handlers only reload: systemd, sshd (after sshd -t), journald's configuration and sysctl.

- name: Configure the host as root
  hosts: all
  become: false
  gather_facts: true
  # Just what the asserts need; no local facts (/etc/ansible/facts.d) and no hardware scan.
  gather_subset:
    - "!all"
    - "!min"
    - distribution
    - platform
    - selinux
    - user
    - cmdline
    - service_mgr
    - pkg_mgr
  vars_files:
    - vars/layout.yml

  pre_tasks:
    - name: Refuse anything but root on AlmaLinux 10, x86_64, with SELinux enforcing
      ansible.builtin.assert:
        that:
          - ansible_facts.user_uid == 0
          - ansible_facts.distribution == 'AlmaLinux'
          - ansible_facts.distribution_major_version == '10'
          - ansible_facts.architecture == 'x86_64'
          - ansible_facts.service_mgr == 'systemd'
          - ansible_facts.selinux.status | default('') == 'enabled'
          - ansible_facts.selinux.mode | default('') == 'enforcing'
          - ansible_facts.selinux.config_mode | default('') == 'enforcing'
          # Neither selinux=0 nor enforcing=0 on the kernel's command line.
          - "'0' not in ([ansible_facts.proc_cmdline.selinux | default('1')] | flatten)"
          - "'0' not in ([ansible_facts.proc_cmdline.enforcing | default('1')] | flatten)"
        fail_msg: >-
          This playbook runs as root on AlmaLinux 10 (x86_64) with SELinux enforcing, in the
          configuration and on the kernel command line. Fix the host (docs/HOSTING.md); never
          lower SELinux to make it pass.
        quiet: true

    - name: Refuse missing or malformed host settings
      ansible.builtin.assert:
        that:
          - tb_role in ['staging', 'production']
          # One DNS name or label, lowercase, at most 64 characters.
          - tb_hostname is match(tb_hostname_pattern)
          - tb_deploy_key is string
          - tb_deploy_key == '' or tb_deploy_key is match(tb_pubkey_pattern)
          - tb_operator_keys is sequence and tb_operator_keys is not string and tb_operator_keys is not mapping
          - tb_operator_keys | reject('string') | list == []
          - tb_operator_keys | map('trim') | reject('match', tb_pubkey_pattern) | list == []
          - tb_root_keys is sequence and tb_root_keys is not string and tb_root_keys is not mapping
          - tb_root_keys | reject('string') | list == []
          - tb_root_keys | map('trim') | reject('match', tb_pubkey_pattern) | list == []
        fail_msg: >-
          Host settings: tarubot_role must be staging or production, tarubot_hostname a lowercase
          host name, and every key (tarubot_deploy_key_public, tarubot_operator_keys,
          tarubot_root_keys) one public key line without options. host.example.yml shows the form.
        quiet: true

  tasks:
    # ------------------------------------------------------------------------------------------
    # Identity and time.
    - name: Set the hostname
      ansible.builtin.hostname:
        name: "{{ tb_hostname }}"
        use: systemd

    - name: Look for cloud-init's configuration directory
      ansible.builtin.stat:
        path: /etc/cloud/cloud.cfg.d
      register: tb_cloud_cfg_d

    - name: Keep cloud-init from resetting the hostname at boot
      ansible.builtin.copy:
        src: cloud-init-tarubot.cfg
        dest: /etc/cloud/cloud.cfg.d/90-tarubot.cfg
        owner: root
        group: root
        mode: "0644"
      when: tb_cloud_cfg_d.stat.isdir | default(false)

    - name: Keep the clock in UTC
      ansible.builtin.file:
        src: ../usr/share/zoneinfo/UTC
        dest: /etc/localtime
        state: link
        force: true
        follow: false

    # ------------------------------------------------------------------------------------------
    # Packages. Refuse Docker before installing anything, so a host that carries it is left as it
    # was; then AlmaLinux's own packages first: they include gnupg2, which rpm_key needs.
    - name: Read the packages already installed
      ansible.builtin.package_facts:
        manager: rpm

    - name: Refuse Docker and the Docker shims before changing anything
      ansible.builtin.assert:
        that:
          - ansible_facts.packages.keys() | select('match', tb_forbidden_packages_pattern) | list == []
        fail_msg: >-
          Remove Docker, docker-compose-plugin, podman-docker and podman-compose first: the bot runs
          under rootless Podman and Quadlet only.
        quiet: true

    - name: Install the host's packages from AlmaLinux's repositories
      ansible.builtin.dnf:
        name: "{{ tb_packages }}"
        state: present
        lock_timeout: 300

    - name: Install EPEL's signing key, shipped with the playbook
      ansible.builtin.copy:
        src: RPM-GPG-KEY-EPEL-10
        dest: /etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-10
        owner: root
        group: root
        mode: "0644"
      register: tb_epel_key

    - name: Trust EPEL's key only if its fingerprint matches the pinned one
      ansible.builtin.rpm_key:
        key: /etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-10
        fingerprint: "{{ tb_epel_fingerprint }}"
        state: present
      # In check mode the key file may not be there yet.
      when: not (ansible_check_mode and tb_epel_key is changed)

    - name: Add EPEL, limited to age
      ansible.builtin.copy:
        src: tarubot-epel.repo
        dest: /etc/yum.repos.d/tarubot-epel.repo
        owner: root
        group: root
        mode: "0644"
      register: tb_epel_repo

    - name: Install age from EPEL
      ansible.builtin.dnf:
        name: "{{ tb_epel_packages }}"
        state: present
        lock_timeout: 300
      # In check mode the repository file may not be there yet, so dnf couldn't find age.
      when: not (ansible_check_mode and tb_epel_repo is changed)

    - name: Read the installed packages again
      ansible.builtin.package_facts:
        manager: rpm

    - name: Refuse the Docker shims as dependencies, and a Podman older than the one the units were checked with
      ansible.builtin.assert:
        that:
          - ansible_facts.packages.keys() | select('match', tb_forbidden_packages_pattern) | list == []
          - >-
            'podman' not in ansible_facts.packages
            or ansible_facts.packages.podman[0].version is version(tb_podman_minimum, '>=')
        fail_msg: >-
          Neither Docker nor a Docker shim may arrive with the host's packages, and Podman must be
          {{ tb_podman_minimum }} or newer.
        quiet: true

    - name: Record whether Podman is installed (not yet, in a check run before the first real one)
      ansible.builtin.set_fact:
        tb_podman_installed: "{{ 'podman' in ansible_facts.packages }}"

    # ------------------------------------------------------------------------------------------
    # Automatic security updates and time.
    - name: Configure dnf-automatic (security updates; staging reboots when needed, production never)
      ansible.builtin.template:
        src: dnf-automatic.conf.j2
        dest: /etc/dnf/automatic.conf
        owner: root
        group: root
        mode: "0644"

    - name: Run dnf-automatic daily
      ansible.builtin.systemd_service:
        name: dnf-automatic.timer
        enabled: true
        state: started
      when: "'dnf-automatic' in ansible_facts.packages"

    - name: Keep chrony synchronising the clock
      ansible.builtin.systemd_service:
        name: chronyd.service
        enabled: true
        state: started
      when: "'chrony' in ansible_facts.packages"

    # ------------------------------------------------------------------------------------------
    # Kernel settings and services the hosts don't need.
    - name: Create sysctl's drop-in directory
      ansible.builtin.file:
        path: /etc/sysctl.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Set the kernel settings (ptrace limited to descendants, no terminal input injection, no temporary IPv6 addresses)
      ansible.builtin.copy:
        src: sysctl-tarubot.conf
        dest: /etc/sysctl.d/90-tarubot.conf
        owner: root
        group: root
        mode: "0644"
      notify: Apply the sysctl settings

    - name: Stop and mask rpcbind, which listens on port 111 on this image and serves nothing here
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        masked: true
      loop:
        - rpcbind.socket
        - rpcbind.service
      when: "'rpcbind' in ansible_facts.packages"

    - name: Mask the units that would generate RSA and ECDSA host keys (Ed25519 only)
      ansible.builtin.file:
        src: /dev/null
        dest: "/etc/systemd/system/{{ item }}"
        state: link
        owner: root
        group: root
      loop:
        - sshd-keygen@rsa.service
        - sshd-keygen@ecdsa.service
      notify: Reload systemd

    # These links are exactly what `systemctl mask` and `systemctl --global mask` make; writing them
    # directly also works before Podman is installed and in check mode.
    - name: Mask Podman's API socket, API service and auto-update for the system
      ansible.builtin.file:
        src: /dev/null
        dest: "/etc/systemd/system/{{ item }}"
        state: link
        owner: root
        group: root
      loop: "{{ tb_podman_masks }}"
      notify: Reload systemd

    # A default for every user's systemd, not a barrier: a user's own ~/.config/systemd/user comes
    # first on its search path, so tarubot could shadow these (it can run podman directly anyway).
    # The second play checks at each run that tarubot's user manager still sees them masked.
    - name: Mask the same Podman units for every user's systemd, tarubot's included
      ansible.builtin.file:
        src: /dev/null
        dest: "/etc/systemd/user/{{ item }}"
        state: link
        owner: root
        group: root
      loop: "{{ tb_podman_masks }}"
      # The second play reloads tarubot's user manager when this changed.
      register: tb_global_user_masks

    - name: Refuse a running system Podman API socket
      ansible.builtin.stat:
        path: /run/podman/podman.sock
      register: tb_system_socket
      failed_when: tb_system_socket.stat.exists

    # ------------------------------------------------------------------------------------------
    # The journal, boot order and IPv6.
    - name: Create journald's drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Keep the journal on disk, capped, with per-user files
      ansible.builtin.copy:
        src: journald-tarubot.conf
        dest: /etc/systemd/journald.conf.d/50-tarubot.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart journald

    - name: Create multi-user.target's drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/multi-user.target.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Make every boot reach network-online.target, which Quadlet's wait unit only polls
      ansible.builtin.copy:
        src: multi-user-network-online.conf
        dest: /etc/systemd/system/multi-user.target.d/50-tarubot.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Install the IPv6 wait script
      ansible.builtin.copy:
        src: tarubot-ipv6-online
        dest: /usr/local/sbin/tarubot-ipv6-online
        owner: root
        group: root
        mode: "0755"

    - name: Install the IPv6 wait unit, ordered before network-online.target
      ansible.builtin.copy:
        src: tarubot-ipv6-online.service
        dest: /etc/systemd/system/tarubot-ipv6-online.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Create network-online.target's wants directory
      ansible.builtin.file:
        path: /etc/systemd/system/network-online.target.wants
        state: directory
        owner: root
        group: root
        mode: "0755"

    # What `systemctl enable` makes for WantedBy=network-online.target. The unit first runs at the
    # next boot; running it now would only wait for an address the host already has. force lets
    # check mode show the link before the unit file above exists.
    - name: Enable the IPv6 wait unit
      ansible.builtin.file:
        src: /etc/systemd/system/tarubot-ipv6-online.service
        dest: /etc/systemd/system/network-online.target.wants/tarubot-ipv6-online.service
        state: link
        force: true
        owner: root
        group: root
      notify: Reload systemd

    - name: Read logind's KillUserProcesses setting
      ansible.builtin.command:
        argv:
          - busctl
          - get-property
          - org.freedesktop.login1
          - /org/freedesktop/login1
          - org.freedesktop.login1.Manager
          - KillUserProcesses
      register: tb_kill_user_processes
      changed_when: false
      check_mode: false

    - name: Refuse logind killing a user's processes at logout (it would stop the bot's conmon)
      ansible.builtin.assert:
        that:
          - tb_kill_user_processes.stdout | trim == 'b false'
        fail_msg: logind's KillUserProcesses must stay off (EL's default).
        quiet: true

    # ------------------------------------------------------------------------------------------
    # The tarubot account.
    - name: Create the skeleton directories for tarubot's account
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/tarubot
        - /etc/tarubot/skel

    - name: Install the skeleton's shell files, which return at once for non-interactive shells
      ansible.builtin.copy:
        src: "skel/{{ item }}"
        dest: "/etc/tarubot/skel/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - .bashrc
        - .bash_profile

    # No supplementary groups, no sudo, no password. EL10 runs pam_umask for SSH sessions
    # (postlogin) and for the user manager (systemd-user), and it reads the umask= field in the
    # GECOS first. Its 0022 matches login.defs' UMASK: pam_umask 1.6.1 never applies
    # USERGROUPS_ENAB's 0002 (usergroups is a build-time default, off on EL10; checked on an EL10
    # userland), so the field only pins tarubot's umask whatever login.defs says later.
    - name: Create the tarubot account
      ansible.builtin.user:
        name: "{{ tb_user }}"
        comment: TaruBot,umask=0022
        home: "{{ tb_home }}"
        create_home: true
        skeleton: /etc/tarubot/skel
        shell: /bin/bash
        groups: []
        append: false
        password_lock: true
        system: false
        state: present
      register: tb_account

    - name: Record tarubot's UID (none yet in a check run before the account exists)
      ansible.builtin.set_fact:
        tb_uid: "{{ tb_account.uid | default('none') }}"

    - name: Refuse a system-range UID (journald keeps per-user files only above it)
      ansible.builtin.assert:
        that:
          - tb_uid | int >= 1000
        fail_msg: tarubot's UID must be 1000 or higher.
        quiet: true
      when: tb_uid != 'none'

    - name: Read the subordinate UID and GID ranges
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/subuid
        - /etc/subgid
      register: tb_subids
      when: tb_uid != 'none'

    - name: Refuse anything but one 65536-ID range each for tarubot (rootless Podman's user namespace)
      ansible.builtin.assert:
        that:
          - (item.content | b64decode).splitlines() | select('match', '^tarubot:') | list | length == 1
          - (item.content | b64decode).splitlines() | select('match', '^tarubot:[0-9]+:65536$') | list | length == 1
        fail_msg: >-
          {{ item.source }} must hold exactly one tarubot line with 65536 IDs (useradd adds it from
          login.defs; otherwise usermod --add-subuids/--add-subgids with a free range).
        quiet: true
      loop: "{{ tb_subids.results | default([]) }}"
      loop_control:
        label: "{{ item.source | default('') }}"
      when: tb_uid != 'none'

    - name: Let tarubot's user manager run without a login, for boot starts and health checks
      ansible.builtin.command:
        argv:
          - loginctl
          - enable-linger
          - "{{ tb_user }}"
        creates: /var/lib/systemd/linger/{{ tb_user }}

    - name: Wait for tarubot's user manager
      ansible.builtin.wait_for:
        path: /run/user/{{ tb_uid }}/bus
        timeout: 60
      when: tb_uid != 'none' and not ansible_check_mode

    - name: Look for tarubot's user manager
      ansible.builtin.stat:
        path: /run/user/{{ tb_uid }}/bus
        get_checksum: false
      register: tb_user_bus
      when: tb_uid != 'none'

    - name: Record whether the second play can run as tarubot
      ansible.builtin.set_fact:
        tb_user_ready: "{{ tb_uid != 'none' and (tb_user_bus.stat.exists | default(false)) }}"

    # sudo is installed for become (root to tarubot), never for tarubot. sudo -l -U reads every
    # sudoers source, /etc/sudoers.d included.
    - name: Read tarubot's sudo rights
      ansible.builtin.command:
        argv:
          - sudo
          - -l
          - -U
          - "{{ tb_user }}"
      register: tb_sudo_rights
      changed_when: false
      check_mode: false
      when: tb_uid != 'none'

    - name: Refuse any sudo rights for tarubot
      ansible.builtin.assert:
        that:
          - tb_sudo_rights.rc == 0
          - "'is not allowed to run sudo' in tb_sudo_rights.stdout"
        fail_msg: "{{ tb_user }} must have no sudo rights; remove every sudoers line that names it."
        quiet: true
      when: tb_uid != 'none'

    # Root never writes under tarubot's home; every task there runs as tarubot in the last play.
    # These checks only look, without following links, so that a link planted in the home (say
    # ~/.config/containers/systemd pointing at a root directory) stops the run instead.
    - name: Look at tarubot's home and the directories on Quadlet's search path
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
      loop:
        - "{{ tb_home }}"
        - "{{ tb_home }}/.config"
        - "{{ tb_home }}/.config/containers"
        - "{{ tb_links_dir }}"
      register: tb_home_paths
      when: tb_uid != 'none'

    - name: Refuse a home, or a directory on Quadlet's search path, that is a link or isn't tarubot's
      ansible.builtin.assert:
        that:
          - item.stat.exists or item.item != tb_home
          - not item.stat.exists or (item.stat.isdir and not item.stat.islnk and item.stat.pw_name == tb_user)
        fail_msg: "{{ item.item }} must be a real directory owned by {{ tb_user }}."
        quiet: true
      loop: "{{ tb_home_paths.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('') }}"
      when: tb_uid != 'none' and not (ansible_check_mode and tb_account is changed)

    - name: Look for rootless Quadlet files that every user's generator would read
      ansible.builtin.stat:
        path: /etc/containers/systemd/users
      register: tb_global_quadlet_dir

    - name: List them
      ansible.builtin.find:
        paths: /etc/containers/systemd/users
        file_type: any
        recurse: true
        hidden: true
      register: tb_global_quadlet_files
      when: tb_global_quadlet_dir.stat.isdir | default(false)

    - name: Refuse any (Quadlet would merge them into, or shadow, the release's unit)
      ansible.builtin.assert:
        that:
          - tb_global_quadlet_files.matched | default(0) == 0
        fail_msg: /etc/containers/systemd/users must hold no units or drop-ins.
        quiet: true

    # ------------------------------------------------------------------------------------------
    # SSH: keys only, tarubot's keys in a root-owned file, root's break-glass keys, and then no
    # root password.
    - name: Create the directory for root-owned authorized_keys files
      ansible.builtin.file:
        path: /etc/ssh/authorized_keys
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write tarubot's keys (the deploy key's restricted line, then the operator keys)
      ansible.builtin.template:
        src: authorized_keys-tarubot.j2
        dest: /etc/ssh/authorized_keys/{{ tb_user }}
        owner: root
        group: root
        mode: "0644"

    - name: Create root's SSH directory
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    # A managed block, so keys the provider or an operator added outside it stay. A FIDO key
    # (sk-...) needs its PIN or biometric on every use (verify-required), not just a touch.
    - name: Write root's break-glass keys
      ansible.builtin.blockinfile:
        path: /root/.ssh/authorized_keys
        marker: "# {mark} TaruBot break-glass keys (host settings: tarubot_root_keys)"
        block: >-
          {{ tb_root_keys | map('trim') | map('regex_replace', '^sk-', 'verify-required sk-') | join('\n') }}
        state: "{{ 'present' if tb_root_keys | length > 0 else 'absent' }}"
        create: true
        owner: root
        group: root
        mode: "0600"

    - name: Refuse to go on without the Ed25519 host key that sshd will keep
      ansible.builtin.stat:
        path: /etc/ssh/ssh_host_ed25519_key
        get_checksum: false
      register: tb_ed25519_key
      failed_when: not tb_ed25519_key.stat.exists

    - name: Install the sshd drop-in, checked on its own first
      ansible.builtin.copy:
        src: sshd-00-tarubot.conf
        dest: /etc/ssh/sshd_config.d/00-tarubot.conf
        owner: root
        group: root
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd

    - name: Remove the drop-in made by hand before the playbook existed
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/10-tarubot.conf
        state: absent
      notify: Reload sshd

    - name: Apply pending reloads before checking their effect
      ansible.builtin.meta: flush_handlers

    - name: Read sshd's effective settings for root and for tarubot
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
          - -C
          - user={{ item }},host=localhost,addr=127.0.0.1,laddr=127.0.0.1,lport=22
      loop:
        - root
        - "{{ tb_user }}"
      register: tb_sshd_effective
      changed_when: false
      # In check mode the drop-in isn't in place, so the result would describe the old settings.
      when: not ansible_check_mode

    - name: Refuse sshd settings other than the drop-in's
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in item.stdout_lines"
          - "'kbdinteractiveauthentication no' in item.stdout_lines"
          - "'gssapiauthentication no' in item.stdout_lines"
          - "'x11forwarding no' in item.stdout_lines"
          - "'disableforwarding yes' in item.stdout_lines"
          - "'permituserrc no' in item.stdout_lines"
          # Key logins to a locked account (root's, below) work only through PAM.
          - "'usepam yes' in item.stdout_lines"
          # OpenSSH 9.9 prints prohibit-password under its older name.
          - "'permitrootlogin prohibit-password' in item.stdout_lines or 'permitrootlogin without-password' in item.stdout_lines"
          - item.stdout_lines | select('match', '^hostkey ') | list == ['hostkey /etc/ssh/ssh_host_ed25519_key']
          - >-
            ('authorizedkeysfile /etc/ssh/authorized_keys/%u' in item.stdout_lines)
            == (item.item == tb_user)
        fail_msg: "sshd's effective settings for {{ item.item }} don't match 00-tarubot.conf; another drop-in wins."
        quiet: true
      loop: "{{ tb_sshd_effective.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('') }}"
      when: not ansible_check_mode

    # No host has a root password (question 20). This comes after the check above that sshd uses
    # PAM (UsePAM yes), which doesn't refuse a key login to a locked account; without PAM, sshd
    # would. Linode's Reset Root Password with the Lish console is the break-glass, and a locked
    # password leaves `su -` nothing to guess.
    - name: Lock root's password
      ansible.builtin.user:
        name: root
        password_lock: true

    - name: Read the ptrace and terminal-injection settings
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /proc/sys/kernel/yama/ptrace_scope
        - /proc/sys/dev/tty/legacy_tiocsti
      register: tb_kernel_guards
      when: not ansible_check_mode

    # ptrace: no other tarubot process can trace the tasks run as tarubot. TIOCSTI: code running as
    # tarubot in a root terminal (a `su` or `runuser` from a root shell) can't queue keystrokes
    # that root's shell would run afterwards.
    - name: Refuse to hand over to tarubot's tasks while any process could trace them or inject terminal input
      ansible.builtin.assert:
        that:
          - tb_kernel_guards.results[0].content | b64decode | trim | int >= 1
          - tb_kernel_guards.results[1].content | b64decode | trim == '0'
        fail_msg: >-
          kernel.yama.ptrace_scope must be 1 or higher, and dev.tty.legacy_tiocsti 0, before tasks
          run as tarubot.
        quiet: true
      when: not ansible_check_mode

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    # journald can't reload its configuration; a restart keeps its sockets, so nothing is lost.
    - name: Restart journald
      ansible.builtin.systemd_service:
        name: systemd-journald.service
        state: restarted
      notify: Move the in-memory journal to disk

    - name: Move the in-memory journal to disk
      ansible.builtin.command:
        argv:
          - journalctl
          - --flush
      changed_when: true

    - name: Apply the sysctl settings
      ansible.builtin.command:
        argv:
          - /usr/sbin/sysctl
          - -q
          - -p
          - /etc/sysctl.d/90-tarubot.conf
      changed_when: true

    # sshd -t reads the whole configuration, drop-ins included; if it fails, the reload never runs
    # and the running sshd keeps its old settings.
    - name: Check the whole sshd configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false
      listen: Reload sshd

    - name: Reload sshd with the checked configuration
      ansible.builtin.systemd_service:
        name: sshd.service
        state: reloaded
      listen: Reload sshd

# ----------------------------------------------------------------------------------------------
# Everything under tarubot's home runs as tarubot, in this last play. Its results are never read
# by a root task, because none follows.
- name: Check and prepare tarubot's home, as tarubot
  hosts: all
  gather_facts: false
  become: true
  become_user: tarubot
  vars_files:
    - vars/layout.yml
  vars:
    # Modules that need a temporary directory (git does) use tarubot's private runtime directory
    # (tmpfs, mode 700) rather than creating ~/.ansible in the home.
    ansible_remote_tmp: /run/user/{{ tb_uid }}
  environment:
    # Python ignores tarubot's user site-packages, so tarubot can't plant code in Ansible's modules.
    PYTHONNOUSERSITE: "1"
    # Rootless Podman and systemctl --user find tarubot's runtime directory and user manager.
    XDG_RUNTIME_DIR: /run/user/{{ tb_uid }}
    DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/{{ tb_uid }}/bus

  tasks:
    - name: Say why tarubot's checks are skipped
      ansible.builtin.debug:
        msg: >-
          tarubot's account or user manager doesn't exist yet (a check run before the first real
          one), so the checks of its home are skipped.
      when: not tb_user_ready | bool

    - name: Skip them
      ansible.builtin.meta: end_host
      when: not tb_user_ready | bool

    # ------------------------------------------------------------------------------------------
    # The clone. deploy.sh moves it to each release; the playbook only creates it, once, so the
    # owner has a place to restore ~/tarubot/.env before the first start.
    - name: Clone the repository into ~/tarubot if it isn't there
      ansible.builtin.git:
        repo: "{{ tb_repository }}"
        dest: "{{ tb_clone }}"
        version: main
        update: false
        umask: "0077"

    # ------------------------------------------------------------------------------------------
    # Quadlet's search path holds only the release's unit, through two links. 2.33.0's start tag
    # makes them; in 2.32.0 no host has them, and nothing here creates them.
    - name: Look for Podman settings and runtime files that would change or bypass the unit
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
      loop:
        - "{{ tb_home }}/.config/containers/containers.conf"
        - "{{ tb_home }}/.config/containers/containers.conf.d"
        - /run/user/{{ tb_uid }}/containers/systemd
        - /run/user/{{ tb_uid }}/podman/podman.sock
      register: tb_user_overrides

    - name: Refuse a user containers.conf, runtime Quadlet units or a Podman API socket
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: >-
          {{ item.item }} must not exist: a user containers.conf would change what the unit
          runs, a runtime unit directory would add units, and the Podman API socket stays off.
        quiet: true
      loop: "{{ tb_user_overrides.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Look for ~/.config/containers/systemd
      ansible.builtin.stat:
        path: "{{ tb_links_dir }}"
        follow: false
        get_checksum: false
      register: tb_links_dir_stat

    - name: List ~/.config/containers/systemd
      ansible.builtin.find:
        paths: "{{ tb_links_dir }}"
        file_type: any
        hidden: true
        recurse: false
      register: tb_links_found
      when: tb_links_dir_stat.stat.isdir | default(false)

    - name: Read the release's two links
      ansible.builtin.stat:
        path: "{{ tb_links_dir }}/{{ item }}"
        follow: false
        get_checksum: false
      loop: "{{ tb_links.keys() | list }}"
      register: tb_links_stat

    - name: Record whether the release's unit is linked
      ansible.builtin.set_fact:
        tb_linked: "{{ tb_links_stat.results | selectattr('stat.exists') | list | length > 0 }}"

    - name: Refuse anything in ~/.config/containers/systemd but the two links, pointing at this host's target
      ansible.builtin.assert:
        that:
          - tb_links_found.files | default([]) | map(attribute='path') | map('basename') | difference(tb_links.keys() | list) == []
          # Both links or neither: a lone units link would run the bot with no target settings.
          - tb_links_stat.results | selectattr('stat.exists') | list | length in [0, 2]
          - >-
            tb_links_stat.results | selectattr('stat.exists')
            | rejectattr('stat.islnk') | list == []
          - >-
            tb_links_stat.results | selectattr('stat.exists')
            | rejectattr('stat.lnk_target', 'in', tb_links.values() | list) | list == []
        fail_msg: >-
          {{ tb_links_dir }} may hold only the links tarubot -> {{ tb_links.tarubot }} and
          tarubot-target -> {{ tb_links['tarubot-target'] }}, both or neither.
        quiet: true

    - name: Read Podman's event logger
      ansible.builtin.command:
        argv:
          - podman
          - info
          - --format
          - !unsafe "{{.Host.EventLogger}}"
      register: tb_event_logger
      changed_when: false
      check_mode: false
      when: tb_podman_installed | bool

    - name: Refuse any event logger but journald (deploys read start and died events from it)
      ansible.builtin.assert:
        that:
          - tb_event_logger.stdout | trim == 'journald'
        fail_msg: Podman's event logger must be journald for tarubot.
        quiet: true
      when: tb_podman_installed | bool

    - name: Reload tarubot's user manager, which reads the global user masks at a reload
      ansible.builtin.systemd_service:
        daemon_reload: true
        scope: user
      when: tb_global_user_masks is changed and not ansible_check_mode

    # The global masks are only a default for tarubot (its ~/.config/systemd/user comes first), so
    # check what its user manager actually loads. In a check run before the first real one the
    # masks aren't there yet.
    - name: Read how tarubot's user manager loads Podman's API and auto-update units
      ansible.builtin.command:
        argv: "{{ ['systemctl', '--user', 'show', '--property=LoadState', '--value'] + tb_podman_masks }}"
      register: tb_user_masks
      changed_when: false
      check_mode: false
      when: not (ansible_check_mode and tb_global_user_masks is changed)

    - name: Refuse Podman's API socket, API service or auto-update loadable by tarubot's user manager
      ansible.builtin.assert:
        that:
          # systemctl prints one value per unit, with a blank line between units.
          - tb_user_masks.stdout_lines | reject('equalto', '') | list == ['masked'] * (tb_podman_masks | length)
        fail_msg: >-
          tarubot's user manager must load {{ tb_podman_masks | join(', ') }} as masked; remove
          whatever in ~/.config/systemd/user overrides the masks in /etc/systemd/user.
        quiet: true
      when: not (ansible_check_mode and tb_global_user_masks is changed)

    # The generator's dry run writes nothing. It prints each unit it would generate under a
    # ---name--- header, and exits 0 even when it finds none, so the headers are what count.
    - name: Run Quadlet's generator over tarubot's real search path
      ansible.builtin.command:
        argv:
          - timeout
          - "60"
          - "{{ tb_generator }}"
          - --user
          - --dryrun
      register: tb_generator_live
      changed_when: false
      check_mode: false
      when: tb_podman_installed | bool

    - name: Refuse a stray unit, or a missing one once the release's unit is linked
      ansible.builtin.assert:
        that:
          - tb_generator_live.rc == 0
          - >-
            tb_generator_live.stdout_lines | select('match', '^---.*---$')
            | map('regex_replace', '^---|---$', '') | map('basename') | list
            == (['tarubot.service'] if tb_linked | bool else [])
        fail_msg: >-
          Quadlet's generator must {{ 'produce tarubot.service and nothing else' if tb_linked | bool
          else 'find no units before the release is linked' }} on tarubot's search path.
        quiet: true
      when: tb_podman_installed | bool

    - name: Look for the release's Quadlet files in the clone
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      loop:
        - "{{ tb_quadlet }}/units/tarubot.container"
        - "{{ tb_quadlet }}/{{ tb_role }}/tarubot.container.d"
      register: tb_layout

    - name: Record whether the clone carries them (releases before 2.32.0 don't)
      ansible.builtin.set_fact:
        tb_layout_present: "{{ tb_layout.results | selectattr('stat.exists') | list | length == 2 }}"

    # The same generator, over the clone's files for this host's target and nothing else, whether
    # or not they are linked yet: the unit the next start would run must convert.
    - name: Run Quadlet's generator over the clone's unit and this host's target
      ansible.builtin.command:
        argv:
          - timeout
          - "60"
          - "{{ tb_generator }}"
          - --user
          - --dryrun
      environment:
        QUADLET_UNIT_DIRS: "{{ tb_links.tarubot }}:{{ tb_links['tarubot-target'] }}"
      register: tb_generator_clone
      changed_when: false
      check_mode: false
      when: tb_podman_installed | bool and tb_layout_present | bool

    - name: Refuse a unit the generator rejects, or anything but tarubot.service
      ansible.builtin.assert:
        that:
          - tb_generator_clone.rc == 0
          - >-
            tb_generator_clone.stdout_lines | select('match', '^---.*---$')
            | map('regex_replace', '^---|---$', '') | map('basename') | list
            == ['tarubot.service']
        fail_msg: >-
          Quadlet's generator must turn {{ tb_quadlet }}/units plus the {{ tb_role }} target into
          tarubot.service and nothing else.
        quiet: true
      when: tb_podman_installed | bool and tb_layout_present | bool

    # ------------------------------------------------------------------------------------------
    # ~/tarubot/.env, if the owner has restored it. Names and counts only, never values.
    - name: Look at ~/tarubot/.env
      ansible.builtin.stat:
        path: "{{ tb_clone }}/.env"
        follow: false
        get_checksum: false
      register: tb_env

    - name: Refuse a settings file that is a link, isn't tarubot's, or is readable by others
      ansible.builtin.assert:
        that:
          - tb_env.stat.isreg and not tb_env.stat.islnk
          - tb_env.stat.pw_name == tb_user
          - tb_env.stat.mode == '0600'
        fail_msg: "{{ tb_clone }}/.env must be a regular file owned by {{ tb_user }} with mode 600."
        quiet: true
      when: tb_env.stat.exists

    - name: Count the image pins and other settings the host rules restrict
      ansible.builtin.command:
        argv:
          - awk
          - >-
            /^TARUBOT_IMAGE_TAG=/ { tag++ }
            /^TARUBOT_IMAGE_DIGEST=/ { digest++ }
            /^TARUBOT_IMAGE=/ { image++ }
            /^GITHUB_APP_[A-Z_]*=./ { app++ }
            END { printf "%d %d %d %d\n", tag, digest, image, app }
          - "{{ tb_clone }}/.env"
      register: tb_env_counts
      changed_when: false
      check_mode: false
      when: tb_env.stat.exists

    - name: Refuse pins or settings this host can't have
      vars:
        tb_counts: "{{ tb_env_counts.stdout.split() | map('int') | list }}"
      ansible.builtin.assert:
        that:
          # Exactly one release pin of record, as deploy.sh requires.
          - tb_counts[0] == 1
          # No digest before the unit is linked; the first start writes it.
          - tb_linked | bool or tb_counts[1] == 0
          - tb_counts[1] <= 1
          # No image override: the unit fixes the repository.
          - tb_counts[2] == 0
          # Staging never holds production's GitHub App settings.
          - tb_role != 'staging' or tb_counts[3] == 0
        fail_msg: >-
          {{ tb_clone }}/.env needs exactly one TARUBOT_IMAGE_TAG line, no TARUBOT_IMAGE_DIGEST
          before the unit is linked, no TARUBOT_IMAGE, and on staging no GITHUB_APP_* value.
        quiet: true
      when: tb_env.stat.exists

    - name: Look for the release's settings check
      ansible.builtin.stat:
        path: "{{ tb_quadlet }}/check-env.sh"
        get_checksum: false
      register: tb_check_env

    # The release's own rules for lines that systemd and Compose would read differently. It prints
    # names and line numbers, never values.
    - name: Check ~/tarubot/.env's lines with the release's check-env.sh
      ansible.builtin.command:
        argv:
          - "{{ tb_quadlet }}/check-env.sh"
          - --syntax
          - "{{ tb_clone }}/.env"
      changed_when: false
      check_mode: false
      when: tb_env.stat.exists and tb_check_env.stat.executable | default(false)

    - name: Say that no settings file is there yet
      ansible.builtin.debug:
        msg: "{{ tb_clone }}/.env isn't there yet; the owner restores it before the first start."
      when: not tb_env.stat.exists
