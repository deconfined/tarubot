# The host job (2.36.0, issue #62): Configure, then the bot, on one target, over SSH as root from
# a GitHub-hosted runner. deploy.yml's staging job calls it after every publish of main and on
# dispatch; production joins in 2.37.0. The owner's decisions are REQUIREMENTS.md "Approved
# pipeline amendments (2026-09-29)", and docs/HOSTING.md "The simple pipeline" has the flow.
#
#   Configure  ops/ansible/site.yml at main's head (config_commit), as root: plain host
#              configuration. No secret reaches it. Actions deploy, configure and preflight.
#   Bot        The release's own ops/ansible/bot.yml, at the commit its image was built from, with
#              main's ansible.cfg and the environment's bot settings in its environment: it writes
#              them into Podman secrets on the host, renders the unit and restarts the bot, and
#              writes a result file for the summary (not when the host became unreachable, which
#              ends Ansible first). Actions deploy, bot and preflight.
#
# The job names the target's environment, so that environment's secrets load there and nowhere
# else; the caller passes `secrets: inherit`. One concurrency group per target keeps two runs off a
# host at once: a newer run waits in the queue (`queue: max`), and nothing is cancelled or
# replaced. Re-runs are refused, as in deploy.yml: start a new dispatch. The repository and its logs
# are public, so the host's name and key are secrets (Actions masks them), every address the name
# resolves to is masked before anything else prints, ssh runs with LogLevel=FATAL (a key other
# than the pinned one ends in "Host key verification failed." without ssh printing that key's
# fingerprint), no script traces, and ansible-playbook never runs with -v, --diff or --check.
name: Host

on:
  workflow_call:
    inputs:
      target:
        description: "The environment and host: staging (production joins in 2.37.0)"
        type: string
        required: true
      action:
        description: "deploy (Configure, then the bot), bot, configure or preflight"
        type: string
        required: true
      version:
        description: "The release X.Y.Z (empty for configure)"
        type: string
        default: ""
      commit:
        description: "The release's commit, 40 hex (empty for configure)"
        type: string
        default: ""
      digest:
        description: "The release's image index digest, sha256:<64 hex> (empty for configure)"
        type: string
        default: ""
      config_commit:
        description: "Main's head when the run was created: Configure applies site.yml from it"
        type: string
        required: true
      accept_release:
        description: "Require real acceptance for the replacement orchestrator (never configure-only)"
        type: boolean
        default: false
      schema_head:
        description: "Expected migration head for acceptance"
        type: string
        default: ""
      publication_run:
        description: "Publication run bound into acceptance"
        type: string
        default: ""
    outputs:
      accepted:
        description: "True only after exact-release target acceptance"
        value: ${{ jobs.host.outputs.accepted }}

permissions: {}

jobs:
  host:
    name: Host
    if: github.run_attempt == '1'
    runs-on: ubuntu-24.04
    # Configure's first run on a new host upgrades every package and reboots; bot.yml waits up to
    # 3 minutes for healthy and runs migrate.js before the start.
    timeout-minutes: 40
    environment: ${{ inputs.target }}
    concurrency:
      group: host-${{ inputs.target }}
      cancel-in-progress: false
      # GitHub's default keeps one waiting run per group and cancels it when a newer one arrives,
      # which could drop a dispatched rollback; max keeps every waiting run, in order.
      queue: max
    permissions:
      contents: read # the two checkouts of this public repository
    outputs:
      accepted: ${{ steps.accept.outputs.accepted }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the request
        env:
          TARGET: ${{ inputs.target }}
          ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          DIGEST: ${{ inputs.digest }}
          CONFIG_COMMIT: ${{ inputs.config_commit }}
        run: |
          # Every input is public data from deploy.yml's plan, and each must fit its pattern before
          # a later step builds a ref, a path or an ansible-playbook argument from it.
          set -Eeuo pipefail
          export LC_ALL=C
          bad() { echo "::error::$1"; exit 1; }
          [[ $TARGET == staging ]] || bad "The target must be staging; production joins host.yml in 2.37.0."
          [[ $ACTION =~ ^(deploy|bot|configure|preflight)$ ]] || bad "The action must be deploy, bot, configure or preflight."
          [[ $CONFIG_COMMIT =~ ^[0-9a-f]{40}$ ]] || bad "config_commit must be a commit: 40 lowercase hex digits."
          # configure touches no release, so it takes none.
          if [[ $ACTION != configure ]]; then
            [[ $VERSION =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$ ]] || bad "The version must be X.Y.Z."
            [[ $COMMIT =~ ^[0-9a-f]{40}$ ]] || bad "The commit must be 40 lowercase hex digits."
            [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || bad "The digest must be sha256: and 64 lowercase hex digits."
          fi

      - name: Recheck automatic release freshness
        if: inputs.accept_release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          CONFIG_COMMIT: ${{ inputs.config_commit }}
        run: |
          # This runs after waiting for the target group, before settings/keys or root Configure.
          set -Eeuo pipefail
          [[ $GITHUB_REF == refs/heads/main && $GITHUB_RUN_ATTEMPT == 1 ]]
          [[ $COMMIT == "$CONFIG_COMMIT" && $COMMIT == "$GITHUB_SHA" ]]
          current=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          [[ $current == "$COMMIT" ]]

      - name: Load the host settings
        id: host
        if: inputs.accept_release != true
        env:
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
          TARGET_HOST_KEY: ${{ secrets.TARGET_HOST_KEY }}
          ANSIBLE_SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          ACTION: ${{ inputs.action }}
        run: |
          # The host, its pinned host key and root's Configure key are secrets of the target's
          # environment, so Actions masks them in the log. The addresses the name resolves to
          # aren't, so they are masked here before anything else prints; nothing below prints the
          # name, an address, a key or the key's file. The files are private (umask 077) and the
          # last step removes them.
          set -Eeuo pipefail
          export LC_ALL=C
          umask 077
          dir=$RUNNER_TEMP/ssh
          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          bad() { echo "::error::$1"; exit 1; }

          # No host yet (before the owner builds it, or after it is retired): a merge stays green
          # with a notice, while a dispatch asked for this host and fails.
          if [[ -z $TARGET_HOST ]]; then
            [[ $EVENT != workflow_dispatch ]] || bad "no host in the $TARGET environment: set its TARGET_HOST secret."
            jq -n --arg action "$ACTION" '{outcome: "no-host", action: $action, version: "-", previous: "-",
              restore_point: "-", migrations: [], schema_head: "-", step: "-", reason: "-", warnings: []}' \
              > "$RUNNER_TEMP/result.json"
            out skip true
            echo "::notice::no host in the $TARGET environment"
            exit 0
          fi

          # A DNS name with A and AAAA records, or an address literal (the lab): nothing that ssh or
          # Ansible could read as an option.
          NAME='^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
          IPV6='^[0-9a-fA-F]{0,4}(:[0-9a-fA-F]{0,4}){2,7}$'
          [[ $TARGET_HOST =~ $NAME || $TARGET_HOST =~ $IPV6 ]] ||
            bad "TARGET_HOST must be a lowercase DNS name with at least two labels, or an IPv4 or IPv6 address."
          # Every address it resolves to (a literal resolves to itself), masked first.
          resolved=$(getent ahosts "$TARGET_HOST") || bad "TARGET_HOST doesn't resolve."
          mapfile -t addresses < <(awk '{ print $1 }' <<< "$resolved" | sort -u)
          (( ${#addresses[@]} )) || bad "TARGET_HOST resolves to no address."
          for address in "${addresses[@]}"; do echo "::add-mask::$address"; done

          # The host key the owner pinned from their own machine after the build (trust on first
          # use): the key alone, no name or comment. A trailing newline is tolerated.
          key=${TARGET_HOST_KEY%$'\n'}
          key=${key%$'\r'}
          # ssh-keygen must read an ed25519 key in it too, not only the shape.
          if ! [[ $key =~ ^ssh-ed25519\ [A-Za-z0-9+/]{68}$ ]] || ! ssh-keygen -E sha256 -lf - <<< "$key" > /dev/null 2>&1; then
            bad "TARGET_HOST_KEY must be one line: ssh-ed25519 and the host's key, with no name or comment."
          fi

          # Belt and braces: the pinned key's base64 and its fingerprint are masked too, although
          # nothing below prints either (ssh runs with LogLevel=FATAL).
          echo "::add-mask::${key#ssh-ed25519 }"
          fingerprint=$(ssh-keygen -E sha256 -lf - <<< "$key" | awk '{ print $2 }')
          echo "::add-mask::${fingerprint#SHA256:}"

          mkdir -p -- "$dir"
          chmod 700 -- "$dir"
          # Carriage returns from a key pasted on another system would break it for ssh.
          printf '%s\n' "${ANSIBLE_SSH_KEY//$'\r'/}" > "$dir/key"
          unset ANSIBLE_SSH_KEY
          grep -q 'PRIVATE KEY' "$dir/key" || bad "ANSIBLE_SSH_KEY isn't set in the $TARGET environment."
          # ssh runs with BatchMode, so a key with a passphrase could never be unlocked and every
          # connection would end in a bare "Permission denied (publickey)".
          ssh-keygen -y -P '' -f "$dir/key" > /dev/null 2>&1 ||
            bad "ANSIBLE_SSH_KEY must be an OpenSSH private key without a passphrase (docs/HOSTING.md, owner step 5)."
          # The pinned key under the alias `target`, the one host of the inventory, so neither file
          # holds the host's name.
          printf 'target %s\n' "$key" > "$dir/known_hosts"
          # AddressFamily=any follows the owner's IPv6-first rule: on a runner without IPv6 the IPv6
          # attempt fails at once and ssh tries IPv4. Only the pinned ed25519 key is accepted.
          # LogLevel=FATAL keeps ssh's error-level messages out of the log, above all the "REMOTE
          # HOST IDENTIFICATION HAS CHANGED" banner, which prints the offered key's fingerprint
          # (scanners index host keys by address). A key other than the pinned one then ends as
          # "Host key verification failed.", on every connection of the run; an authentication
          # failure still prints. A host that is down or has port 22 closed ends UNREACHABLE with
          # no reason given.
          jq -n --arg host "$TARGET_HOST" --arg dir "$dir" '{all: {hosts: {target: {
              ansible_host: $host,
              ansible_user: "root",
              ansible_ssh_private_key_file: ($dir + "/key"),
              ansible_ssh_common_args: ("-F /dev/null -o IdentitiesOnly=yes -o IdentityAgent=none -o BatchMode=yes"
                + " -o StrictHostKeyChecking=yes -o UserKnownHostsFile=" + $dir + "/known_hosts"
                + " -o GlobalKnownHostsFile=/dev/null -o HostKeyAlias=target -o HostKeyAlgorithms=ssh-ed25519"
                + " -o CheckHostIP=no -o UpdateHostKeys=no -o VerifyHostKeyDNS=no -o AddressFamily=any -o ConnectTimeout=20"
                + " -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o LogLevel=FATAL")}}}}' \
            > "$dir/inventory.json"
          out skip false

      - name: Find the release's commit in its image
        id: release
        if: steps.host.outputs.skip != 'true' && inputs.action != 'configure'
        env:
          DIGEST: ${{ inputs.digest }}
          COMMIT: ${{ inputs.commit }}
        run: |
          # The release checkout's ref comes from the image itself: the revision label of the digest
          # the plan verified, whose provenance binds it to main's publish.yml. It must equal the
          # plan's commit, so the checkout never takes a ref from event data, and this workflow
          # takes nothing from its caller on trust. The package is public: no login.
          set -Eeuo pipefail
          export LC_ALL=C
          rev=$(docker buildx imagetools inspect "ghcr.io/deconfined/tarubot@$DIGEST" --format '{{json .Image}}' |
            jq -er '."linux/amd64".config.Labels["org.opencontainers.image.revision"] | select(test("^[0-9a-f]{40}$"))') ||
            { echo "::error::The image carries no revision label, or the registry didn't answer."; exit 1; }
          [[ $rev == "$COMMIT" ]] || { echo "::error::The image's revision label names another commit than the plan's."; exit 1; }
          printf 'ref=%s\n' "$rev" >> "$GITHUB_OUTPUT"

      - name: Check out main's host configuration
        if: steps.host.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.config_commit }}
          path: config
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the release
        if: steps.host.outputs.skip != 'true' && inputs.action != 'configure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.ref }}
          path: release
          persist-credentials: false
          fetch-depth: 1

      - name: Install Bun for host trust and acceptance
        if: inputs.accept_release && steps.host.outputs.skip != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/package.json

      - name: Install the local DNSSEC resolver
        if: inputs.accept_release && steps.host.outputs.skip != 'true'
        run: |
          # Ubuntu's maintained resolver, DNSSEC root anchor and OpenSSH tools; no custom build.
          set -Eeuo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq unbound dnsutils dns-root-data openssh-client >/dev/null

      - name: Load enrolled host trust
        if: inputs.accept_release && steps.host.outputs.skip != 'true'
        env:
          TARGET: ${{ inputs.target }}
          STATE_BUCKET: ${{ secrets.TOFU_STATE_BUCKET }}
          STATE_ENDPOINT: ${{ secrets.TOFU_STATE_ENDPOINT }}
          STATE_REGION: ${{ secrets.TOFU_STATE_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_READ_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_READ_SECRET_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
          ANSIBLE_SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
        run: |
          # Read complete durable enrollment once, validate DNS locally, and write a literal
          # destination plus the stored host key. No provider credentials or fresh key scan.
          set -Eeuo pipefail
          bun config/scripts/host-trust.ts

      - name: Install Ansible
        if: steps.host.outputs.skip != 'true'
        run: |
          # Main's pinned ansible-core (config/ops/ansible/requirements.txt), every package by hash;
          # --no-deps keeps pip from fetching anything the file doesn't list. It runs here, on the
          # runner: the hosts carry no ansible-core.
          set -Eeuo pipefail
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --quiet --disable-pip-version-check \
            --no-deps --require-hashes -r config/ops/ansible/requirements.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"

      - name: Configure the host
        if: steps.host.outputs.skip != 'true' && inputs.action != 'bot'
        working-directory: config/ops/ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/config/ops/ansible/ansible.cfg
          # ansible-core refuses to start under a non-UTF-8 locale.
          LC_ALL: C.UTF-8
          TARGET: ${{ inputs.target }}
          ACTION: ${{ inputs.action }}
        run: |
          # site.yml at main's head, as root: packages, updates, sshd, su and polkit, the tarubot
          # account. It reads no secret, and none is in this step's environment.
          set -Eeuo pipefail
          ansible-playbook -i "$RUNNER_TEMP/ssh/inventory.json" site.yml -e "tarubot_role=$TARGET"
          # A configure dispatch ends here; bot.yml writes the result for every other action.
          if [[ $ACTION == configure ]]; then
            jq -n '{outcome: "configured", action: "configure", version: "-", previous: "-",
              restore_point: "-", migrations: [], schema_head: "-", step: "-", reason: "-", warnings: []}' \
              > "$RUNNER_TEMP/result.json"
          fi

      - name: Deploy the bot
        if: steps.host.outputs.skip != 'true' && inputs.action != 'configure'
        working-directory: release/ops/ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/config/ops/ansible/ansible.cfg
          LC_ALL: C.UTF-8
          TARGET: ${{ inputs.target }}
          ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          DIGEST: ${{ inputs.digest }}
          # The release's bot.yml reads exactly these (its vars/bot.yml tb_secret_env), only in
          # no_log tasks, and feeds each to the host on stdin. An unset one is empty here; bot.yml
          # decides which the action needs. GitHub refuses a secret name that starts with
          # GITHUB_ (an env: name here may keep it), so the two GITHUB_ ones come from secrets of
          # other names, vars/bot.yml tb_secret_source. GITHUB_APP_PRIVATE_KEY is production's.
          BACKUP_STORAGE_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_ACCESS_KEY }}
          BACKUP_STORAGE_ENDPOINT: ${{ secrets.BACKUP_STORAGE_ENDPOINT }}
          BACKUP_STORAGE_REGION: ${{ secrets.BACKUP_STORAGE_REGION }}
          BACKUP_STORAGE_SECRET_KEY: ${{ secrets.BACKUP_STORAGE_SECRET_KEY }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.SUGGEST_APP_PRIVATE_KEY }}
          GITHUB_REPORTS_TOKEN: ${{ secrets.REPORTS_GITHUB_TOKEN }}
          HEALTHCHECKS_BACKUP_URL: ${{ secrets.HEALTHCHECKS_BACKUP_URL }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          # The release's own bot.yml: every check before any write, then the secrets, the unit,
          # the restart, the health wait and the commands. Its arguments are public; its last play
          # writes the result file (unless the host became unreachable, which ends Ansible first)
          # and fails the step unless the outcome is deployed, superseded, configured or
          # preflight-ok. It always runs: bot.yml, not this step, decides what a missing
          # DISCORD_TOKEN means.
          set -Eeuo pipefail
          ansible-playbook -i "$RUNNER_TEMP/ssh/inventory.json" bot.yml \
            -e "tarubot_target=$TARGET" -e "tarubot_action=$ACTION" -e "tarubot_version=$VERSION" \
            -e "tarubot_commit=$COMMIT" -e "tarubot_digest=$DIGEST" \
            -e "tarubot_result=$RUNNER_TEMP/result.json"

      - name: Require exact-release staging acceptance
        id: accept
        if: inputs.accept_release && steps.host.outputs.skip != 'true'
        working-directory: config/ops/ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/config/ops/ansible/ansible.cfg
          LC_ALL: C.UTF-8
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          DIGEST: ${{ inputs.digest }}
          PUBLICATION_RUN: ${{ inputs.publication_run }}
          SCHEMA_HEAD: ${{ inputs.schema_head }}
        run: |
          # Missing/failed/configured/superseded results are not a healthy deployment.
          set -Eeuo pipefail
          jq -e --arg version "$VERSION" --arg schema "$SCHEMA_HEAD" \
            '.outcome == "deployed" and .action == "deploy" and .version == $version and .schema_head == $schema' \
            "$RUNNER_TEMP/result.json" >/dev/null 2>&1
          ansible-playbook -i "$RUNNER_TEMP/ssh/inventory.json" accept.yml \
            -e tarubot_target=staging -e "tarubot_version=$VERSION" -e "tarubot_commit=$COMMIT" \
            -e "tarubot_digest=$DIGEST" -e "tarubot_schema_head=$SCHEMA_HEAD" \
            -e "tarubot_publication_run=$PUBLICATION_RUN" -e "tarubot_acceptance=$RUNNER_TEMP/acceptance.json"
          bun ../../scripts/release-acceptance.ts

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TARGET: ${{ inputs.target }}
        run: |
          # The result file, to the log and the run's summary. It decides nothing: the job's colour
          # comes from the steps above. bot.yml's last play wrote it here on the runner, from public
          # fields only (or this job did, for no-host and configure); each value still prints only
          # as plain characters. No file means the run stopped before bot.yml's last play: a step
          # above failed, or the host became unreachable while bot.yml ran, which ends Ansible
          # before that play.
          set -Eeuo pipefail
          export LC_ALL=C
          file=$RUNNER_TEMP/result.json
          [[ $TARGET =~ ^(staging|production)$ ]] || TARGET='?'
          if ! jq -e 'type == "object"' "$file" > /dev/null 2>&1; then
            outcome=failed
            if [[ $JOB_STATUS == success ]]; then outcome='?'; fi
            line="no result file: the run stopped before bot.yml's last play. A step above failed, or the host became unreachable while bot.yml ran."
            echo "Result on $TARGET: outcome=$outcome, $line"
            printf '## %s: %s\n\n%s\n' "$TARGET" "$outcome" "$line" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # One `name value` line per field: a string, or a list of strings joined by spaces (none
          # when empty), with every character but these as ?; ? for anything else.
          declare -A value=()
          while read -r k v; do value[$k]=$v; done < <(jq -r '
            def plain: gsub("[^A-Za-z0-9._:+-]"; "?") | if . == "" then "?" else . end;
            ("outcome action version previous restore_point migrations schema_head step reason warnings" | split(" "))[] as $k
            | (.[$k] | if type == "string" then plain
                elif type == "array" and all(.[]; type == "string") then (if length == 0 then "none" else map(plain) | join(" ") end)
                else "?" end) as $v
            | "\($k) \($v)"' "$file")
          echo "Result on $TARGET: outcome=${value[outcome]} action=${value[action]} version=${value[version]} previous=${value[previous]} restore_point=${value[restore_point]} migrations=${value[migrations]} schema_head=${value[schema_head]} step=${value[step]} reason=${value[reason]} warnings=${value[warnings]}"
          {
            printf '## %s: %s\n\n| | |\n| --- | --- |\n' "$TARGET" "${value[outcome]}"
            for k in action version previous restore_point migrations schema_head step reason warnings; do
              printf '| %s | %s |\n' "$k" "\`${value[$k]}\`"
            done
            printf '\n'
          } >> "$GITHUB_STEP_SUMMARY"
          # Missing schema evidence is not unchanged-schema evidence; never recommend blind rollback.
          if [[ ${value[outcome]} == unhealthy && ${value[previous]} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            hint="Inspect and fence the live writer and verify the database schema first. Fix forward or use owner-controlled recovery; image rollback needs explicit unchanged-schema evidence."
            echo "::error::${value[version]} isn't healthy on $TARGET. $hint"
            printf '%s\n' "$hint" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove the key
        if: always()
        run: rm -rf -- "${RUNNER_TEMP:?}/ssh"
