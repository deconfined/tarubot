# Replacement automatic infrastructure component; the manual reviewed entry point stays separate.
name: Release infrastructure
on:
  workflow_call:
    inputs:
      version: {type: string, required: true}
      commit: {type: string, required: true}
      digest: {type: string, required: true}
      publication_run: {type: string, required: true}
      schema_head: {type: string, required: true}
    outputs:
      verified:
        value: ${{ jobs.complete.outputs.verified }}
permissions: {}
# Same writer group as reviewed dispatch, held over Plan, Apply and baseline completion.
concurrency:
  group: infra
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    # Stable names keep the ordinary Plan/Apply outcomes clear in Actions.
    name: Plan infrastructure
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: infra-plan
    permissions: {contents: read}
    outputs:
      decision: ${{ steps.plan.outputs.decision }}
      digest: ${{ steps.plan.outputs.digest }}
      binding: ${{ steps.plan.outputs.binding }}
      verified: ${{ steps.plan.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: {bun-version-file: package.json}
      - name: Install pinned OpenTofu
        run: bash ops/tofu/ci/tofu-ci.sh install
      - name: Plan and require automatic policy
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          RELEASE_DIGEST: ${{ inputs.digest }}
          PUBLICATION_RUN: ${{ inputs.publication_run }}
          SCHEMA_HEAD: ${{ inputs.schema_head }}
          CONTROL_RECORDS_ENABLED: ${{ vars.TOFU_CONTROL_RECORDS_ENABLED }}
          TOFU_VARS: ${{ secrets.TOFU_VARS }}
          STATE_BUCKET: ${{ secrets.TOFU_STATE_BUCKET }}
          STATE_ENDPOINT: ${{ secrets.TOFU_STATE_ENDPOINT }}
          STATE_REGION: ${{ secrets.TOFU_STATE_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_READ_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_READ_SECRET_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
          OVH_APPLICATION_KEY: ${{ secrets.OVH_READ_APPLICATION_KEY }}
          OVH_APPLICATION_SECRET: ${{ secrets.OVH_READ_APPLICATION_SECRET }}
          OVH_CONSUMER_KEY: ${{ secrets.OVH_READ_CONSUMER_KEY }}
          OS_USERNAME: ${{ secrets.OPENSTACK_READ_USERNAME }}
          OS_PASSWORD: ${{ secrets.OPENSTACK_READ_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
        run: |
          umask 077
          # Child prepare writes GITHUB_ENV, so set its private data directory in this same step.
          export TF_DATA_DIR="$RUNNER_TEMP/tofu/data"
          bun scripts/release-infra.ts plan
      - name: Keep exact encrypted safe plan
        if: steps.plan.outputs.decision == 'safe'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-safe-plan
          path: ${{ runner.temp }}/tofu/plan.bin
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Clean up private evidence
        if: always()
        run: rm -rf -- "${RUNNER_TEMP:?}/tofu"
  apply:
    name: Apply infrastructure
    needs: plan
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1' && needs.plan.outputs.decision == 'safe'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: infra-auto
    permissions: {contents: read}
    outputs:
      verified: ${{ steps.apply.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: {bun-version-file: package.json}
      - name: Install pinned OpenTofu
        run: bash ops/tofu/ci/tofu-ci.sh install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-safe-plan
          path: ${{ runner.temp }}/tofu
      - name: Recheck policy and apply exact saved plan
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          RELEASE_DIGEST: ${{ inputs.digest }}
          PUBLICATION_RUN: ${{ inputs.publication_run }}
          SCHEMA_HEAD: ${{ inputs.schema_head }}
          DIGEST: ${{ needs.plan.outputs.digest }}
          BINDING: ${{ needs.plan.outputs.binding }}
          CONTROL_RECORDS_ENABLED: ${{ vars.TOFU_CONTROL_RECORDS_ENABLED }}
          TOFU_VARS: ${{ secrets.TOFU_VARS }}
          STATE_BUCKET: ${{ secrets.TOFU_STATE_BUCKET }}
          STATE_ENDPOINT: ${{ secrets.TOFU_STATE_ENDPOINT }}
          STATE_REGION: ${{ secrets.TOFU_STATE_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_WRITE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_WRITE_SECRET_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
          OVH_APPLICATION_KEY: ${{ secrets.OVH_WRITE_APPLICATION_KEY }}
          OVH_APPLICATION_SECRET: ${{ secrets.OVH_WRITE_APPLICATION_SECRET }}
          OVH_CONSUMER_KEY: ${{ secrets.OVH_WRITE_CONSUMER_KEY }}
          OS_USERNAME: ${{ secrets.OPENSTACK_WRITE_USERNAME }}
          OS_PASSWORD: ${{ secrets.OPENSTACK_WRITE_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WRITE_TOKEN }}
        run: |
          umask 077
          export TF_DATA_DIR="$RUNNER_TEMP/tofu/data"
          bun scripts/release-infra.ts apply
      - name: Clean up private evidence
        if: always()
        run: rm -rf -- "${RUNNER_TEMP:?}/tofu"
  complete:
    needs: [plan, apply]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      verified: ${{ steps.complete.outputs.verified }}
    steps:
      - id: complete
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          APPLY_RESULT: ${{ needs.apply.result }}
          DECISION: ${{ needs.plan.outputs.decision }}
          PLAN_VERIFIED: ${{ needs.plan.outputs.verified }}
          APPLY_VERIFIED: ${{ needs.apply.outputs.verified }}
        run: |
          set -Eeuo pipefail
          [[ $PLAN_RESULT == success ]]
          if [[ $DECISION == no-changes ]]; then
            [[ $PLAN_VERIFIED == true && $APPLY_RESULT == skipped ]]
          elif [[ $DECISION == safe ]]; then
            [[ $APPLY_RESULT == success && $APPLY_VERIFIED == true ]]
          else
            echo '::error::Infrastructure has no verified automatic outcome.'
            exit 1
          fi
          echo 'verified=true' >> "$GITHUB_OUTPUT"
