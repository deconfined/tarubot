# Pull requests validate source, persistence, and the bot image before they are merged.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      platform-tests:
        description: "Also run the in-image suite on native AMD64 and ARM64 (publication's fallback)"
        type: boolean
        default: false
    outputs:
      version:
        description: Validated application SemVer
        value: ${{ jobs.checks.outputs.version }}
      release:
        description: Version strictly increased from the known PR or push base
        value: ${{ jobs.checks.outputs.release }}

permissions:
  contents: read

concurrency:
  # Supersede stale PR checks, but never cancel another release's reusable verification job.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: tarubot_test
          POSTGRES_USER: tarubot
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarubot -d tarubot_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # These database fixtures contain synthetic test data only.
      TEST_DATABASE_URL: postgresql://tarubot:ci-only-password@localhost:5432/tarubot_test
      LEGACY_FIXTURE_PATH: .cache/ci/legacy.sql
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse edits to applied migrations
        # A called workflow sees its caller's push, so publication's fallback checks the push base.
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          # Applied migrations are immutable; a change may only add new migration files.
          set -Eeuo pipefail
          [[ $BASE_SHA =~ ^[0-9a-f]{40}$ && $BASE_SHA != 0000000000000000000000000000000000000000 ]] ||
            { echo '::error::No base commit to compare applied migrations against.'; exit 1; }
          changed=$(git diff --name-only --diff-filter=a "$BASE_SHA...HEAD" -- migrations/)
          if [[ -n $changed ]]; then
            echo "::error::This change edits, renames or removes an applied migration; add a new one instead."
            printf '%s\n' "$changed"
            exit 1
          fi
      - name: Install the project Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Validate GitHub workflows
        run: |
          set -Eeuo pipefail
          # actionlint checks every run: block with ShellCheck, but only when ShellCheck is on PATH.
          command -v shellcheck > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          tool_dir=$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")
          trap 'rm -rf -- "$tool_dir"' EXIT
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tool_dir/archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$tool_dir/archive" \
            | sha256sum --check --status
          tar -xzf "$tool_dir/archive" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -color
      - name: Compile the application
        run: bun run build
      # docker-compose.web.yml runs the release's web image. CI builds this tree's own, so the
      # Caddy tests and the Caddyfile check below never pull a published tag (which may not exist
      # yet, and would carry another tree's Caddyfile and offline page).
      - name: Build this tree's web image for the Caddy fixture
        run: |
          set -Eeuo pipefail
          docker build --target web -t ghcr.io/deconfined/tarubot:web-ci .
          echo 'CADDY_FIXTURE_IMAGE=ghcr.io/deconfined/tarubot:web-ci' >> "$GITHUB_ENV"
      - name: Generate synthetic integration input
        run: bun run test:fixture
      # pg_dump refuses a server newer than itself and Ubuntu 24.04's client is 16, so without
      # PostgreSQL 18's own client tests/integration/backups.test.ts would skip its real backup
      # and restore here. PGDG's client, the service's major (compose-manifests.test.ts keeps them
      # equal), first on PATH: /usr/bin's wrapper would pick the runner's own PostgreSQL 16.
      - name: Install the PostgreSQL 18 client
        run: |
          set -Eeuo pipefail
          # A mirror hiccup would fail the checks: every apt call retries, the PGDG script's included.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q --no-install-recommends postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Run unit, contract, and PostgreSQL integration tests
        run: bun run test
      - name: Validate deployment and source-build Compose models
        run: |
          set -Eeuo pipefail
          # Invented settings only, the backup settings included.
          managed=(
            TARUBOT_IMAGE_REPOSITORY=ghcr.io/deconfined/tarubot-release
            DISCORD_APPLICATION_ID=123456789012345678 DATABASE_CA_CERT=x DISCORD_TOKEN=x
            BACKUP_STORAGE_ENDPOINT=backups.example.org/tarubot BACKUP_STORAGE_REGION=example-1
            BACKUP_STORAGE_ACCESS_KEY=fixture-only BACKUP_STORAGE_SECRET_KEY=fixture-only
            BACKUP_AGE_RECIPIENTS=age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq
            BACKUP_TIME_UTC=03:00 HEALTHCHECKS_BACKUP_URL=https://hc-ping.example.org/fixture-only
          )
          # Check both bot-only and optional-web models.
          for profiles in '' web; do
            export COMPOSE_PROFILES="$profiles"
            export WEB_PUBLIC_ORIGIN='' DISCORD_CLIENT_SECRET=''
            if [[ $profiles == web ]]; then
              export WEB_PUBLIC_ORIGIN=https://tarubot.example.org DISCORD_CLIENT_SECRET=fixture-only
            fi
            docker compose --env-file .env.example config --quiet
            docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.build.yml config --quiet
            env "${managed[@]}" TARUBOT_IMAGE_TAG=production \
              DATABASE_URL=postgresql://tarubot:x@db.example.org:27520/tarubot \
              docker compose --env-file /dev/null -f docker-compose.production.yml config --quiet
            env "${managed[@]}" TARUBOT_IMAGE_TAG=staging TEST_GUILD_ID=123456789012345679 \
              DATABASE_URL=postgresql://tarubot_staging:x@db.example.org:27520/tarubot_staging \
              docker compose --env-file /dev/null -f docker-compose.staging.yml config --quiet
          done
          # A self-hoster's opt-in updater beside the bundled proxy.
          docker compose --env-file .env.example --profile updates --profile web config --quiet
          # This tree's web image (built above) validates its own Caddyfile under the service's
          # hardening; --pull never keeps a published tag out of it.
          TARUBOT_IMAGE_TAG=ci docker compose --env-file .env.example run --rm --no-deps --pull never caddy \
            caddy validate --config /etc/caddy/Caddyfile
      # Maintenance passes all checks without a release bump. Only a known version increase
      # declares a release; manual verification has no predecessor and never infers one.
      - name: Validate version and release metadata
        id: version
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: bun run ci:version

  images:
    name: Container build (${{ matrix.arch }})
    # Pull-request CI runs this suite before merge; publication runs it again only in its full-CI
    # fallback (publish.yml's verify), when its gate can't prove the merged tree is a tested head.
    # A called workflow sees its caller's event (a push), so publication's fallback asks for these
    # explicitly: it must test the same platforms the gate's proof requires.
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      inputs.platform-tests == true
    needs: checks
    # Nested Git/Bun fixtures need native CPUs, not QEMU startup overhead.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The in-image suite runs here on this native platform: in pull-request CI before merge, or in
      # publication's verify fallback when its gate can't prove the tree is one already tested.
      - name: Test on the image's platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          platforms: linux/${{ matrix.arch }}
          push: false
          # Refresh Alpine packages on each build even when the upstream Bun tag is unchanged.
          no-cache-filters: base
          cache-from: type=gha,scope=tarubot-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tarubot-${{ matrix.arch }}
      - name: Build the runtime image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: tarubot
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=tarubot-${{ matrix.arch }}

  result:
    name: CI result
    if: always()
    needs: [checks, images]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all applicable validation jobs
        env:
          IMAGES_REQUIRED: >-
            ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
            inputs.platform-tests == true }}
          CHECKS: ${{ needs.checks.result }}
          IMAGES: ${{ needs.images.result }}
        run: |
          test "$CHECKS" = success
          if [[ $IMAGES_REQUIRED == true ]]; then
            test "$IMAGES" = success
          else
            test "$IMAGES" = skipped
          fi
