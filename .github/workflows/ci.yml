# Pull requests validate source, persistence, and the bot image before they are merged.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Validated application SemVer
        value: ${{ jobs.checks.outputs.version }}

permissions:
  contents: read

concurrency:
  # Supersede stale PR checks, but never cancel another release's reusable verification job.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: tarubot_test
          POSTGRES_USER: tarubot
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarubot -d tarubot_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # This database and fixture contain synthetic test data only.
      TEST_DATABASE_URL: postgresql://tarubot:ci-only-password@localhost:5432/tarubot_test
      LEGACY_FIXTURE_PATH: .cache/ci/legacy.sql
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse edits to applied migrations
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # An applied migration never changes (AGENTS.md): a pull request may only add files under
          # migrations/. The lowercase filter `a` lists every change except an addition, so an
          # edit, a rename, a removal or a type change shows here. The full-depth checkout above
          # holds the base commit.
          set -Eeuo pipefail
          changed=$(git diff --name-only --diff-filter=a "$BASE_SHA...HEAD" -- migrations/)
          if [[ -n $changed ]]; then
            echo "::error::This pull request edits, renames or removes an applied migration; add a new one instead."
            printf '%s\n' "$changed"
            exit 1
          fi
      - name: Install the project Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Check the host scripts with ShellCheck
        run: |
          # ops/*.sh runs on the production host (backup.sh, and deploy.sh as the deploy key's
          # forced command). The playbook's scripts (ops/ansible/files/) are checked in the Host
          # playbook job; tests/unit/playbook.test.ts checks that every script under ops/ is
          # covered by one of the ShellCheck lines.
          # The ubuntu-24.04 image ships ShellCheck; install it if an image ever drops it.
          command -v shellcheck > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version | sed -n 2p
          shellcheck -S warning ops/*.sh
          # infra.yml's steps (ops/tofu/ci/), which run with the infra environment's secrets.
          shellcheck -S warning ops/tofu/ci/tofu-ci.sh
      - name: Compile the application
        run: bun run build
      - name: Generate synthetic integration input
        run: bun run test:fixture
      - name: Render the staging unit and run Podman's Quadlet generator over it
        env:
          # Podman 5.8, pinned by digest.
          PODMAN_IMAGE: quay.io/podman/stable:v5.8.2@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
        run: |
          # tests/fixtures/bot-render.ts renders ops/ansible/templates/bot/ with staging's values,
          # as bot.yml does (the Host playbook job diffs it against Ansible's own template module).
          # The generator's dry run of that unit, placed where a host's tarubot user keeps it, goes
          # to .cache/quadlet/staging.txt: quadlet.test.ts compares it with the unit and Compose,
          # and fails unless it holds exactly tarubot.service.
          set -Eeuo pipefail
          bun tests/fixtures/bot-render.ts .cache/bot
          mkdir -p .cache/quadlet
          docker run --rm --network none -v "$PWD/.cache/bot/staging:/src:ro" "$PODMAN_IMAGE" sh -c '
            set -e; export HOME=/home/t; d=$HOME/.config/containers/systemd
            mkdir -p $d; cp /src/tarubot.container $d/tarubot.container
            /usr/lib/systemd/system-generators/podman-system-generator --user --dryrun' \
            > .cache/quadlet/staging.txt
          grep '^---' .cache/quadlet/staging.txt
      - name: Run unit, contract, and PostgreSQL integration tests
        env:
          # quadlet.test.ts's comparison with the generator runs only when this names its output.
          QUADLET_DRYRUN: .cache/quadlet
        run: bun run test
      - name: Validate deployment and source-build Compose models
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.build.yml config --quiet
          # The production host's self-contained file, with placeholder values for its required settings.
          TARUBOT_IMAGE_TAG=0.0.0 DATABASE_URL=postgresql://tarubot:x@db.example:27520/tarubot \
            DATABASE_CA_CERT=x DISCORD_TOKEN=x \
            docker compose --env-file /dev/null -f docker-compose.production.yml config --quiet
      # Last, so dependency-update pull requests report every other step of this job before a
      # maintainer adds the required version increment; the job, the container builds that depend
      # on it, and CI result still fail without it.
      - name: Validate version and changelog
        id: version
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: bun run ci:version

  images:
    name: Container build (${{ matrix.target }})
    # Main publication builds its own multi-platform images after the reusable checks pass.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [tarubot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  playbook:
    name: Host playbook
    # ops/ansible/ configures the staging host as root (site.yml) and deploys the bot there as the
    # tarubot user (bot.yml), run from host.yml on a GitHub runner (#62). It runs here without a
    # host: syntax checks and ansible-lint, with ansible.builtin only and nothing from Galaxy, the
    # test renderer against Ansible's own template module, and ShellCheck.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned ansible-core and ansible-lint
        run: |
          # The runner's ansible-core and ansible-lint, from requirements-lint.txt: the same
          # ansible-core as requirements.txt, which host.yml installs for Configure and the bot.
          # The hosts carry none. Every package is pinned by hash, and --no-deps keeps pip from
          # fetching anything the file doesn't list.
          python3 --version
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --quiet --disable-pip-version-check \
            --no-deps --require-hashes -r ops/ansible/requirements-lint.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
      - name: Check the playbooks
        working-directory: ops/ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ops/ansible/ansible.cfg
          # ansible-core refuses to start under a non-UTF-8 locale.
          LC_ALL: C.UTF-8
        run: |
          ansible-playbook --version | head -n 1
          # With the example inventory and host settings, so both examples parse too.
          ansible-playbook --syntax-check -i inventory.example.yml -e @host.example.yml site.yml
          ansible-playbook --syntax-check -i inventory.example.yml bot.yml
          # ansible-lint runs its own syntax check without an inventory, which ansible.cfg's
          # unparsed_is_failed would refuse; the setting stays on for real runs.
          ANSIBLE_INVENTORY_UNPARSED_FAILED=False ansible-lint --offline --project-dir .
      - name: Install the project Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Render the bot's templates with the test renderer
        run: |
          # bot-render.ts needs no dependencies (it imports only from bun and node:), so this job
          # skips bun install. It writes the unit, the settings file and the vars.json of the
          # values both templates receive.
          bun tests/fixtures/bot-render.ts .cache/bot
      - name: Check the test renderer against Ansible's template module
        working-directory: ops/ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ops/ansible/ansible.cfg
          LC_ALL: C.UTF-8
        run: |
          # The unit tests read the renderer's output, so it must be what Ansible writes on a host:
          # the same templates and values through ansible.builtin.template, byte for byte.
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/render"
          for t in tarubot.container tarubot.env; do
            ansible localhost -i localhost, -c local -m ansible.builtin.template \
              -a "src=templates/bot/$t.j2 dest=$RUNNER_TEMP/render/$t" \
              -e "@$GITHUB_WORKSPACE/.cache/bot/staging/vars.json"
            diff -u "$GITHUB_WORKSPACE/.cache/bot/staging/$t" "$RUNNER_TEMP/render/$t"
          done
      - name: Check the playbooks' scripts with ShellCheck
        run: |
          # The IPv6 wait script runs as root at every boot; tarubot-tool and tarubot-backup run as
          # tarubot on the host (the one-off tools, ExecStartPre's migrate.js, the daily backup).
          command -v shellcheck > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck -S warning ops/ansible/files/tarubot-ipv6-online ops/ansible/files/bot/tarubot-tool ops/ansible/files/bot/tarubot-backup

  infrastructure:
    name: Infrastructure checks
    # ops/tofu without a provider token or a state backend: formatting, validation, the module's
    # tests against mocked providers, and cloud-init's schema over the rendered user-data examples.
    # Pull requests and dispatches only: these reach registry.opentofu.org and AlmaLinux's mirrors,
    # and publish.yml's verify calls this workflow, so an outage there must never block an image.
    # main moves only through pull requests, which ran them. No secret and no environment.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The module's state encryption needs a passphrase to validate and test; this one guards
      # nothing, since no state is ever written here.
      TF_VAR_state_passphrase: ci-only-throwaway-passphrase
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned OpenTofu
        # The release in ops/tofu/.opentofu-version, checked against ops/tofu/opentofu.sha256, by
        # the same script infra.yml runs.
        run: bash ops/tofu/ci/tofu-ci.sh install
      - name: Check the OpenTofu module
        run: |
          # The lock file must already pin both providers (-lockfile=readonly), and no backend is
          # initialized, so nothing reaches the state bucket.
          set -Eeuo pipefail
          tofu version
          tofu -chdir=ops/tofu fmt -check -recursive
          tofu -chdir=ops/tofu init -backend=false -input=false -lockfile=readonly
          tofu -chdir=ops/tofu validate
          tofu -chdir=ops/tofu test -var-file=examples/example.tfvars.json
      - name: Check the user-data examples against cloud-init's schema
        env:
          # AlmaLinux 10, as on the hosts, pinned by its index digest.
          ALMALINUX_IMAGE: almalinux:10@sha256:957738702313e6ee452cdb17bc1431542c467be9a4e2f4da3b8e551b0ebb9677
        run: |
          # The examples are the module's exact renderings (its tests compare them), checked by
          # the cloud-init the hosts run. Only the package install needs the network. Without
          # python3-jsonschema, cloud-init skips the check and still exits 0, so each file must
          # also be reported valid.
          docker run --rm --network=bridge -v "$PWD/ops/tofu/examples:/examples:ro" "$ALMALINUX_IMAGE" sh -c '
            set -e
            dnf -qy install cloud-init python3-jsonschema > /dev/null
            for f in /examples/user-data-*.yaml; do
              out=$(cloud-init schema --config-file "$f")
              echo "$out"
              case $out in "Valid schema $f") ;; *) exit 1 ;; esac
            done'

  result:
    name: CI result
    if: always()
    needs: [checks, images, playbook, infrastructure]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all applicable validation jobs
        env:
          EVENT: ${{ github.event_name }}
          CHECKS: ${{ needs.checks.result }}
          IMAGES: ${{ needs.images.result }}
          PLAYBOOK: ${{ needs.playbook.result }}
          INFRA: ${{ needs.infrastructure.result }}
        run: |
          test "$CHECKS" = success
          test "$IMAGES" = success || test "$IMAGES" = skipped
          test "$PLAYBOOK" = success
          # The infrastructure checks run on pull requests (required there) and dispatches; they
          # skip when publish.yml calls this workflow.
          if [ "$EVENT" = pull_request ]; then
            test "$INFRA" = success
          else
            test "$INFRA" = success || test "$INFRA" = skipped
          fi
