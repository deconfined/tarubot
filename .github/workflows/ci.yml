# Pull requests validate source, persistence, and the bot image before they are merged.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Validated application SemVer
        value: ${{ jobs.checks.outputs.version }}

permissions:
  contents: read

concurrency:
  # Supersede stale PR checks, but never cancel another release's reusable verification job.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: tarubot_test
          POSTGRES_USER: tarubot
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarubot -d tarubot_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # This database and fixture contain synthetic test data only.
      TEST_DATABASE_URL: postgresql://tarubot:ci-only-password@localhost:5432/tarubot_test
      LEGACY_FIXTURE_PATH: .cache/ci/legacy.sql
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the project Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Check the host scripts with ShellCheck
        run: |
          # ops/ runs on the production host (backup.sh, and deploy.sh as the deploy key's forced
          # command), and ops/quadlet/check-env.sh before every Quadlet start. Two explicit levels,
          # not **, which GitHub's bash doesn't expand without globstar; tests/unit/playbook.test.ts
          # checks that every script under ops/ is covered here or in the Host playbook job.
          # The ubuntu-24.04 image ships ShellCheck; install it if an image ever drops it.
          command -v shellcheck > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version | sed -n 2p
          shellcheck -S warning ops/*.sh ops/*/*.sh
      - name: Compile the application
        run: bun run build
      - name: Generate synthetic integration input
        run: bun run test:fixture
      - name: Run Podman's Quadlet generator over the unit
        env:
          # The Podman the hosts run (vars/layout.yml's tb_podman_minimum; playbook.test.ts keeps
          # the two equal), pinned by digest.
          PODMAN_IMAGE: quay.io/podman/stable:v5.8.2@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
        run: |
          # ops/quadlet/README.md "What Podman generates": link each target the way a host does,
          # then dry-run the generator. quadlet.test.ts compares the output with the unit and
          # Compose, and fails unless it holds exactly tarubot.service.
          mkdir -p .cache/quadlet
          for target in production staging; do
            docker run --rm --network none -v "$PWD/ops:/src/ops:ro" "$PODMAN_IMAGE" sh -c '
              set -e; export HOME=/home/t; d=$HOME/.config/containers/systemd
              mkdir -p $HOME/tarubot $d; cp -r /src/ops $HOME/tarubot/
              ln -s $HOME/tarubot/ops/quadlet/units $d/tarubot
              ln -s $HOME/tarubot/ops/quadlet/'"$target"' $d/tarubot-target
              /usr/lib/systemd/system-generators/podman-system-generator --user --dryrun' \
              > ".cache/quadlet/$target.txt"
            grep '^---' ".cache/quadlet/$target.txt"
          done
      - name: Run unit, contract, and PostgreSQL integration tests
        env:
          # quadlet.test.ts's comparison with the generator runs only when this names its output.
          QUADLET_DRYRUN: .cache/quadlet
        run: bun run test
      - name: Validate deployment and source-build Compose models
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.build.yml config --quiet
          # The production host's self-contained file, with placeholder values for its required settings.
          TARUBOT_IMAGE_TAG=0.0.0 DATABASE_URL=postgresql://tarubot:x@db.example:27520/tarubot \
            DATABASE_CA_CERT=x DISCORD_TOKEN=x \
            docker compose --env-file /dev/null -f docker-compose.production.yml config --quiet
      # Last, so dependency-update pull requests report every other step of this job before a
      # maintainer adds the required version increment; the job, the container builds that depend
      # on it, and CI result still fail without it.
      - name: Validate version and changelog
        id: version
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: bun run ci:version

  images:
    name: Container build (${{ matrix.target }})
    # Main publication builds its own multi-platform images after the reusable checks pass.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [tarubot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  playbook:
    name: Host playbook
    # ops/ansible/ configures the staging and production hosts as root (#50). It runs here without
    # a host: a syntax check and ansible-lint, with ansible.builtin only and nothing from Galaxy.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned ansible-core and ansible-lint
        run: |
          # ansible-core 2.16.19 is the 2.16 series AlmaLinux 10.2's AppStream ships to the hosts,
          # with its security fixes; the image's Python 3.12 matches theirs. Every package is pinned by hash, and
          # --no-deps keeps pip from fetching anything the file doesn't list.
          python3 --version
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --quiet --disable-pip-version-check \
            --no-deps --require-hashes -r ops/ansible/requirements-lint.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
      - name: Check the playbook
        working-directory: ops/ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ops/ansible/ansible.cfg
          # ansible-core 2.16 refuses to start under a non-UTF-8 locale.
          LC_ALL: C.UTF-8
        run: |
          ansible-playbook --version | head -n 1
          # With the example inventory and host settings, so both examples parse too.
          ansible-playbook --syntax-check -i inventory.example.yml -e @host.example.yml site.yml
          # ansible-lint runs its own syntax check without an inventory, which ansible.cfg's
          # unparsed_is_failed would refuse; the setting stays on for real runs.
          ANSIBLE_INVENTORY_UNPARSED_FAILED=False ansible-lint --offline --project-dir .
      - name: Check the playbook's scripts with ShellCheck
        run: |
          # The IPv6 wait script runs as root at every boot; the skeleton files are tarubot's shell
          # start-up files.
          command -v shellcheck > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck -S warning ops/ansible/files/tarubot-ipv6-online
          shellcheck -S warning --shell=bash ops/ansible/files/skel/.bashrc ops/ansible/files/skel/.bash_profile

  result:
    name: CI result
    if: always()
    needs: [checks, images, playbook]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all applicable validation jobs
        env:
          CHECKS: ${{ needs.checks.result }}
          IMAGES: ${{ needs.images.result }}
          PLAYBOOK: ${{ needs.playbook.result }}
        run: |
          test "$CHECKS" = success
          test "$IMAGES" = success || test "$IMAGES" = skipped
          test "$PLAYBOOK" = success
