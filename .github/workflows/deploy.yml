name: Deploy
run-name: Deploy ${{ inputs.target }} ${{ inputs.version }}

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      version:
        type: string
        required: true
      commit:
        type: string
        required: true
      digest:
        type: string
        required: true
    secrets:
      DEPLOY_SSH_KEY:
        description: "Optional caller binding; the selected environment supplies the delivery key."
        required: false
  workflow_dispatch:
    inputs:
      target:
        description: "Owner-approved delivery target"
        type: choice
        options: [staging, production]
        default: staging
        required: true
      version:
        description: "Reviewed release X.Y.Z (never a downgrade)"
        type: string
        required: true
      commit:
        description: "Exact 40-character source commit on main"
        type: string
        required: true
      digest:
        description: "Exact signed image index sha256:digest; never a tag"
        type: string
        required: true

permissions:
  contents: read
  actions: read
  attestations: read

defaults:
  run:
    shell: bash

env:
  TARGET: ${{ inputs.target }}
  # Bind repository activation before a selected environment can supply runner variables.
  REPO_PRODUCTION_DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
  REPO_STAGING_DEPLOY_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
  VERSION: ${{ inputs.version }}
  COMMIT: ${{ inputs.commit }}
  DIGEST: ${{ inputs.digest }}

jobs:
  validate:
    name: Validate signed release
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target: ${{ steps.admission.outputs.target }}
    steps:
      - name: Validate request, main ancestry, approval policy and provenance
        id: admission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077
          private=$(mktemp -d "$RUNNER_TEMP/release-validation.XXXXXX")
          trap 'rm -rf -- "$private"' EXIT
          trap 'echo "::error::Release validation failed; no host connection was made."' ERR
          exec 2> "$private/errors"
          case "$TARGET" in
            production) [[ $REPO_PRODUCTION_DEPLOY_ENABLED == true ]] ;;
            staging) [[ $REPO_STAGING_DEPLOY_ENABLED == true ]] ;;
            *) exit 1 ;;
          esac
          [[ $VERSION =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$ ]]
          [[ $COMMIT =~ ^[0-9a-f]{40}$ && $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ $GITHUB_REPOSITORY == deconfined/tarubot ]]
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT...main" --jq .status)
          [[ $status == identical || $status == ahead ]]
          version=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$COMMIT" | jq -er .version)
          [[ $version == "$VERSION" ]]
          gh api "repos/$GITHUB_REPOSITORY/environments/$TARGET" > "$private/environment"
          jq -e '.deployment_branch_policy == {protected_branches: false, custom_branch_policies: true}
            and .can_admins_bypass == false
            and ([.protection_rules[] | select(.type == "required_reviewers")]
              | length == 1 and .[0].prevent_self_review == false
                and ([.[0].reviewers[] | {type, login: .reviewer.login}]
                  == [{type: "User", login: "deconfined"}]))' "$private/environment" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/environments/$TARGET/deployment-branch-policies" \
            | jq -e '[.branch_policies[] | {name, type}] == [{name: "main", type: "branch"}]' > /dev/null
          gh attestation verify "oci://ghcr.io/deconfined/tarubot@$DIGEST" \
            --repo deconfined/tarubot \
            --cert-identity https://github.com/deconfined/tarubot/.github/workflows/publish.yml@refs/heads/main \
            --source-ref refs/heads/main --source-digest "$COMMIT" \
            --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners \
            --format json > "$private/attestation"
          jq -e 'type == "array" and length >= 1' "$private/attestation" > /dev/null
          printf 'target=%s\n' "$TARGET" >> "$GITHUB_OUTPUT"
          echo 'Signed release validated; selected environment approval is required.'

  deliver:
    name: Deploy ${{ needs.validate.outputs.target }}
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
      ((needs.validate.outputs.target == 'production' && vars.DEPLOY_ENABLED == 'true') ||
       (needs.validate.outputs.target == 'staging' && vars.STAGING_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET: ${{ needs.validate.outputs.target }}
    concurrency:
      group: ${{ needs.validate.outputs.target }}-deploy
      cancel-in-progress: false
    # Exactly one selected environment job, including the routine production approval.
    environment: ${{ needs.validate.outputs.target }}
    steps:
      - name: Recheck release and owner policy after approval and queue waits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077
          private=$(mktemp -d "$RUNNER_TEMP/release-validation.XXXXXX")
          trap 'rm -rf -- "$private"' EXIT
          trap 'echo "::error::Release revalidation failed; no host connection was made."' ERR
          exec 2> "$private/errors"
          case "$TARGET" in
            production) [[ $REPO_PRODUCTION_DEPLOY_ENABLED == true ]] ;;
            staging) [[ $REPO_STAGING_DEPLOY_ENABLED == true ]] ;;
            *) exit 1 ;;
          esac
          [[ $VERSION =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$ ]]
          [[ $COMMIT =~ ^[0-9a-f]{40}$ && $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ $GITHUB_REPOSITORY == deconfined/tarubot ]]
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT...main" --jq .status)
          [[ $status == identical || $status == ahead ]]
          version=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$COMMIT" | jq -er .version)
          [[ $version == "$VERSION" ]]
          gh api "repos/$GITHUB_REPOSITORY/environments/$TARGET" > "$private/environment"
          jq -e '.deployment_branch_policy == {protected_branches: false, custom_branch_policies: true}
            and .can_admins_bypass == false
            and ([.protection_rules[] | select(.type == "required_reviewers")]
              | length == 1 and .[0].prevent_self_review == false
                and ([.[0].reviewers[] | {type, login: .reviewer.login}]
                  == [{type: "User", login: "deconfined"}]))' "$private/environment" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/environments/$TARGET/deployment-branch-policies" \
            | jq -e '[.branch_policies[] | {name, type}] == [{name: "main", type: "branch"}]' > /dev/null
          gh attestation verify "oci://ghcr.io/deconfined/tarubot@$DIGEST" \
            --repo deconfined/tarubot \
            --cert-identity https://github.com/deconfined/tarubot/.github/workflows/publish.yml@refs/heads/main \
            --source-ref refs/heads/main --source-digest "$COMMIT" \
            --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners \
            --format json > "$private/attestation"
          jq -e 'type == "array" and length >= 1' "$private/attestation" > /dev/null
          echo 'Signed release and selected environment policy revalidated.'
      - name: Check out the reviewed workflow transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the DNSSEC SSH transport
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends openssh-client unbound dns-root-data
          # The transport starts and cleans up its own validating resolver.
          sudo systemctl stop unbound
      - name: Send the exact release to the DNSSEC-authenticated host entry
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: exec bash ops/deploy-ssh.sh
