name: Deploy
run-name: Deploy ${{ inputs.target }} ${{ inputs.version }}

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      version:
        type: string
        required: true
      commit:
        type: string
        required: true
      digest:
        type: string
        required: true
    secrets:
      DEPLOY_SSH_KEY:
        description: "Optional caller binding; the selected environment supplies the delivery key."
        required: false
  workflow_dispatch:
    inputs:
      target:
        description: "Owner-approved delivery target"
        type: choice
        options: [staging, production]
        default: staging
        required: true
      version:
        description: "Reviewed release X.Y.Z (never a downgrade)"
        type: string
        required: true
      commit:
        description: "Exact 40-character source commit on main"
        type: string
        required: true
      digest:
        description: "Exact signed image index sha256:digest; never a tag"
        type: string
        required: true

permissions:
  contents: read
  actions: read
  attestations: read
  deployments: read

defaults:
  run:
    shell: bash

env:
  TARGET: ${{ inputs.target }}
  # Bind repository activation before a selected environment can supply runner variables.
  REPO_PRODUCTION_DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
  REPO_STAGING_DEPLOY_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
  VERSION: ${{ inputs.version }}
  COMMIT: ${{ inputs.commit }}
  DIGEST: ${{ inputs.digest }}

jobs:
  validate:
    name: Validate signed release
    # A re-run validates again, and delivery proceeds only on an approval given in its own attempt;
    # the host entry then decides (already-live, refused while another delivery or a pending marker
    # holds the host, or a deployment). Each attempt sends its own request ID (ops/deploy-ssh.sh).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target: ${{ steps.admission.outputs.target }}
    steps:
      - name: Validate request, main ancestry, approval policy and provenance
        id: admission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077
          private=$(mktemp -d "$RUNNER_TEMP/release-validation.XXXXXX")
          trap 'rm -rf -- "$private"' EXIT
          trap 'echo "::error::Release validation failed; no host connection was made."' ERR
          exec 2> "$private/errors"
          case "$TARGET" in
            production) [[ $REPO_PRODUCTION_DEPLOY_ENABLED == true ]] ;;
            staging) [[ $REPO_STAGING_DEPLOY_ENABLED == true ]] ;;
            *) exit 1 ;;
          esac
          [[ $VERSION =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$ ]]
          [[ $COMMIT =~ ^[0-9a-f]{40}$ && $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ $GITHUB_REPOSITORY == deconfined/tarubot ]]
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT...main" --jq .status)
          [[ $status == identical || $status == ahead ]]
          version=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$COMMIT" | jq -er .version)
          [[ $version == "$VERSION" ]]
          gh api "repos/$GITHUB_REPOSITORY/environments/$TARGET" > "$private/environment"
          jq -e '.deployment_branch_policy == {protected_branches: false, custom_branch_policies: true}
            and .can_admins_bypass == false
            and ([.protection_rules[] | select(.type == "required_reviewers")]
              | length == 1 and .[0].prevent_self_review == false
                and ([.[0].reviewers[] | {type, login: .reviewer.login}]
                  == [{type: "User", login: "deconfined"}]))' "$private/environment" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/environments/$TARGET/deployment-branch-policies" \
            | jq -e '[.branch_policies[] | {name, type}] == [{name: "main", type: "branch"}]' > /dev/null
          gh attestation verify "oci://ghcr.io/deconfined/tarubot@$DIGEST" \
            --repo deconfined/tarubot \
            --cert-identity https://github.com/deconfined/tarubot/.github/workflows/publish.yml@refs/heads/main \
            --source-ref refs/heads/main --source-digest "$COMMIT" \
            --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners \
            --format json > "$private/attestation"
          jq -e 'type == "array" and length >= 1' "$private/attestation" > /dev/null
          printf 'target=%s\n' "$TARGET" >> "$GITHUB_OUTPUT"
          echo 'Signed release validated; selected environment approval is required.'

  deliver:
    name: Deploy ${{ needs.validate.outputs.target }}
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      ((needs.validate.outputs.target == 'production' && vars.DEPLOY_ENABLED == 'true') ||
       (needs.validate.outputs.target == 'staging' && vars.STAGING_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET: ${{ needs.validate.outputs.target }}
    concurrency:
      group: ${{ needs.validate.outputs.target }}-deploy
      cancel-in-progress: false
    # Exactly one selected environment job, including the routine production approval.
    environment: ${{ needs.validate.outputs.target }}
    steps:
      - name: Recheck release and owner policy after approval and queue waits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077
          private=$(mktemp -d "$RUNNER_TEMP/release-validation.XXXXXX")
          trap 'rm -rf -- "$private"' EXIT
          trap 'echo "::error::Release revalidation failed; no host connection was made."' ERR
          exec 2> "$private/errors"
          case "$TARGET" in
            production) [[ $REPO_PRODUCTION_DEPLOY_ENABLED == true ]] ;;
            staging) [[ $REPO_STAGING_DEPLOY_ENABLED == true ]] ;;
            *) exit 1 ;;
          esac
          [[ $VERSION =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$ ]]
          [[ $COMMIT =~ ^[0-9a-f]{40}$ && $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ $GITHUB_REPOSITORY == deconfined/tarubot ]]
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT...main" --jq .status)
          [[ $status == identical || $status == ahead ]]
          version=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$COMMIT" | jq -er .version)
          [[ $version == "$VERSION" ]]
          gh api "repos/$GITHUB_REPOSITORY/environments/$TARGET" > "$private/environment"
          jq -e '.deployment_branch_policy == {protected_branches: false, custom_branch_policies: true}
            and .can_admins_bypass == false
            and ([.protection_rules[] | select(.type == "required_reviewers")]
              | length == 1 and .[0].prevent_self_review == false
                and ([.[0].reviewers[] | {type, login: .reviewer.login}]
                  == [{type: "User", login: "deconfined"}]))' "$private/environment" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/environments/$TARGET/deployment-branch-policies" \
            | jq -e '[.branch_policies[] | {name, type}] == [{name: "main", type: "branch"}]' > /dev/null
          gh attestation verify "oci://ghcr.io/deconfined/tarubot@$DIGEST" \
            --repo deconfined/tarubot \
            --cert-identity https://github.com/deconfined/tarubot/.github/workflows/publish.yml@refs/heads/main \
            --source-ref refs/heads/main --source-digest "$COMMIT" \
            --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners \
            --format json > "$private/attestation"
          jq -e 'type == "array" and length >= 1' "$private/attestation" > /dev/null
          # The owner's approval must belong to this attempt (@deconfined, 2026-10-08). GitHub gives
          # each environment job its own deployment, whose first status is "waiting" only while the
          # job is held for the required reviewer; every status links to the run and the job ID,
          # and a re-run gets a new job ID. So this job finds its own deployment and requires that
          # it began "waiting": a re-run let through on an earlier approval is refused here, before
          # any host contact. Re-run all jobs and a fresh dispatch both ask for approval again.
          trap 'echo "::error::Could not read this attempt'"'"'s approval record from GitHub; re-run once its API answers. No host connection was made."' ERR
          [[ ${GITHUB_RUN_ID:-} =~ ^[1-9][0-9]{0,19}$ && ${GITHUB_RUN_ATTEMPT:-} =~ ^[1-9][0-9]{0,2}$ ]]
          [[ ${GITHUB_SHA:-} =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$private/jobs"
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$TARGET&sha=$GITHUB_SHA&per_page=30" > "$private/deployments"
          not_held="This delivery was not held for the $TARGET approval in this attempt, so it will not use an earlier approval. Re-run all jobs or dispatch Deploy again to be asked; no host connection was made."
          trap 'echo "::error::$not_held"' ERR
          job=$(jq -er --arg name "Deploy $TARGET" '
            [.jobs[] | select(.status == "in_progress" and (.name == $name or (.name | endswith(" / " + $name)))) | .id]
            | if length == 1 then .[0] else empty end' "$private/jobs")
          [[ $job =~ ^[1-9][0-9]{0,19}$ ]]
          held=false
          for deployment in $(jq -r '.[] | .id | select(type == "number")' "$private/deployments"); do
            if ! gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses?per_page=100" > "$private/statuses"; then
              echo "::error::Could not read this attempt's approval record from GitHub; re-run once its API answers. No host connection was made."
              exit 1
            fi
            # Statuses arrive newest first, so the last of this job's statuses is its first.
            if jq -e --arg job "/actions/runs/$GITHUB_RUN_ID/job/$job" '
                [.[] | select((.target_url // "") | endswith($job))] as $mine
                | ($mine | length) > 0 and ($mine | last | .state) == "waiting"' "$private/statuses" > /dev/null; then
              held=true
              break
            fi
          done
          [[ $held == true ]]
          echo 'Signed release, selected environment policy and this attempt'"'"'s approval revalidated.'
      - name: Check out the reviewed workflow transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the DNSSEC SSH transport
        run: |
          # A mirror hiccup here would fail delivery before any host contact; retry it.
          sudo apt-get -o Acquire::Retries=5 update -q
          sudo apt-get -o Acquire::Retries=5 install -y -q --no-install-recommends \
            openssh-client unbound dns-root-data
          # The transport starts and cleans up its own validating resolver.
          sudo systemctl stop unbound
      - name: Send the exact release to the DNSSEC-authenticated host entry
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: exec bash ops/deploy-ssh.sh
