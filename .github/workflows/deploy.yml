# Deploys over SSH to production, after the owner's approval (2.30.0, issue #41), and to staging,
# without one (2.33.0, issue #50). The owner's decisions are REQUIREMENTS.md "Approved SSH-deploy
# amendments (2026-09-26)" and "Approved staging amendments (2026-09-26)"; docs/HOSTING.md
# "Automated deploys" has the flow and the outcomes, and docs/CI_CD.md the settings.
#
#   plan            Public data only (no secret, no environment): the release, its image digest,
#                   the image's signed build provenance, the diff and whether anything that runs on
#                   the hosts changed. It writes the plan to the run summary and decides which
#                   targets this run deploys. Docs-, test- and CI-only merges end here, with a quiet
#                   Pushover message.
#   deploy          The `production` environment: it waits for @deconfined's approval, and only
#                   then do the deploy key and the host settings load. It opens one SSH connection,
#                   whose forced command is ops/deploy.sh on the host; the host checks the approval
#                   with GitHub itself.
#   deploy-staging  The `staging` environment, which has no reviewers: the same SSH step against
#                   the staging host, beside production's approval request. Production never waits
#                   for it, and its failure never holds production up.
#   notify          One Pushover message from the `notify` environment, about production only.
#
# An automatic run (after a publish of main) asks for both targets; a dispatch for the one its
# `target` input names. Each target has its own switch, a repository variable: DEPLOY_ENABLED for
# production and STAGING_DEPLOY_ENABLED for staging. A target whose switch is off is left out, and
# with both off nothing runs and no secret loads.
#
# No job checks out the repository or uses an action, and every ${{ }} reaches a script through
# env:. Re-runs are refused (every job requires the first attempt): start a new run instead. There
# is no concurrency group: several approval requests may wait, an older one approved later ends as
# superseded, and each host's lock serializes its runs. The repository names no host: DEPLOY_HOST
# and DEPLOY_KNOWN_HOSTS are variables of each deploy environment.
name: Deploy
# The title names the target; ops/deploy.sh requires the same title before it acts, and the
# production host refuses every title that ends in " to staging".
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Deploy {0}{1}{2}', inputs.version,
                inputs.rollback && format(' rollback from {0}', inputs.from) || '',
                inputs.target == 'staging' && ' to staging' || '')
      || format('Deploy {0}', github.event.workflow_run.head_sha) }}

on:
  workflow_run:
    # publish.yml's name (tests/unit/deploy-workflow.test.ts keeps them in step).
    workflows: ["Publish containers"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release X.Y.Z (the live one is re-verified and its commands registered again)"
        required: true
        type: string
      rollback:
        description: "Go back to an older release on the same schema"
        type: boolean
        default: false
      from:
        description: "Rollback only: the live version you are leaving"
        type: string
        default: ""
      target:
        description: "Where to deploy: production waits for your approval, staging needs none"
        type: choice
        options: [production, staging]
        default: production

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    # The switches are the rollout and pause controls: with both unset, nothing runs and no secret
    # loads. Each target's own switch is checked again in the plan and in its deploy job.
    if: >-
      github.run_attempt == '1' && (vars.DEPLOY_ENABLED == 'true' || vars.STAGING_DEPLOY_ENABLED == 'true') && (
        (github.event_name == 'workflow_run'
         && github.event.workflow_run.conclusion == 'success'
         && github.event.workflow_run.event == 'push'
         && github.event.workflow_run.head_branch == 'main'
         && github.event.workflow_run.path == '.github/workflows/publish.yml'
         && github.event.workflow_run.head_repository.full_name == github.repository)
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No packages permission and no registry login: the package is public, so the digests and
    # `gh attestation verify oci://…` resolve anonymously, and no job token is written to disk.
    permissions:
      contents: read # package.json, CHANGELOG.md, migrations/, ops/deploy.sh and the compare API
      actions: read # the environments' protection rules and branch policies, and this run's actors
      attestations: read # the image's build-provenance attestations, for gh attestation verify
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      action: ${{ steps.plan.outputs.action }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      digest: ${{ steps.plan.outputs.digest }}
      from: ${{ steps.plan.outputs.from }}
      reason: ${{ steps.plan.outputs.reason }}
      production: ${{ steps.plan.outputs.production }}
      staging: ${{ steps.plan.outputs.staging }}
      production_reason: ${{ steps.plan.outputs.production_reason }}
      notify: ${{ steps.plan.outputs.notify }}
    steps:
      - name: Plan the deploy
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ROLLBACK: ${{ inputs.rollback }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TARGET: ${{ inputs.target }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          STAGING_DEPLOY_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          R=$GITHUB_REPOSITORY
          IMAGE=ghcr.io/deconfined/tarubot
          VER='^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$'
          # The one account that approves production and may dispatch staging, by login and by its
          # numeric id (ops/deploy.sh's REVIEWER and REVIEWER_ID; the test keeps them equal).
          REVIEWER=deconfined
          REVIEWER_ID=71469756
          # The line on which a release's ops/deploy.sh declares the contracts it speaks. Staging
          # deploys need the words `quadlet` and `staging`; a comment naming them doesn't count.
          CAPABILITY_LINE='^readonly CAPABILITIES="([a-z0-9]+( [a-z0-9]+)*)"$'
          # Paths that never change what runs on a host; every other path is a runtime change.
          # ops/ansible's pip pins feed only CI and the operator's venv: hosts install AlmaLinux's
          # own ansible-core.
          NON_RUNTIME='^(docs/|site/|tests/|test-plans/|\.github/|[^/]+\.md$|docker-compose(\.devbot|\.tools|\.build)?\.yml$|\.env\.example$|production\.env\.example$|staging\.env\.example$|ops/ansible/requirements(-lint)?\.txt$|biome\.json$)'
          ALWAYS_RUNTIME='^\.github/workflows/publish\.yml$'
          # Files that run on a host, or shape its .env: on production's Docker host as a
          # docker-group user, which is root-equivalent there; on the staging host as the
          # unprivileged tarubot user under rootless Podman. ops/ansible/ runs as root when the
          # playbook is applied.
          HOST_SIDE='^(ops/|docker-compose\.production\.yml$|production\.env\.example$|staging\.env\.example$)'
          HOST_RUN="on production's Docker host they run as a docker-group user, which is root-equivalent there; on the staging host as the unprivileged \`tarubot\` user under rootless Podman; \`ops/ansible/\` runs as root when the playbook is applied"
          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          fail() { out reason "$1"; echo "::error::$2"; exit 1; }
          summary() { printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"; }
          # The image index digest behind a tag, and the commit its amd64 image was built from.
          digest_of() { docker buildx imagetools inspect "$IMAGE:$1" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'; }
          revision_of() { docker buildx imagetools inspect "$IMAGE:$1" --format '{{json .Image}}' | jq -er '."linux/amd64".config.Labels["org.opencontainers.image.revision"] | select(test("^[0-9a-f]{40}$"))'; }
          raw() { gh api -H 'Accept: application/vnd.github.raw+json' "repos/$R/contents/$1?ref=$2"; }
          older() { local -a a b; local i; IFS=. read -r -a a <<< "$1"; IFS=. read -r -a b <<< "$2"; for i in 0 1 2; do (( a[i] == b[i] )) && continue; (( a[i] < b[i] )); return; done; return 1; }
          is_runtime() { [[ $1 =~ $ALWAYS_RUNTIME ]] || ! [[ $1 =~ $NON_RUNTIME ]]; }
          # GitHub's compare API lists at most 300 files and can't page past them, so a list of
          # 300 may be cut short. The plan claims nothing from such a list: it refuses, since the
          # approver couldn't see the host-side changes (the host would still decide migrations).
          listed() {
            local n
            n=$(jq -e '.files | arrays | length' <<< "$1") || fail compare "The compare API's answer has no file list."
            (( n < 300 )) || fail compare-too-large "$2 changes 300 files or more, more than GitHub's compare API lists, so the plan can't show the host-side changes or check the migrations. Deploy by hand per docs/HOSTING.md."
          }

          # 1. The targets: an automatic run asks for both, a dispatch for the one it names. A
          #    target whose switch is off is left out; with nothing left the run is paused.
          #
          #    First, before anything can fail: whether notify reports this run. It does for every
          #    run that asks for production while DEPLOY_ENABLED reads as true to GitHub's
          #    expressions, which ignore case (this job's own condition reads it so). The decision
          #    is made here, when the run plans, because notify starts only after the Deploy job
          #    ends: switching deploys off meanwhile must not silence the outcome of a request
          #    already waiting or a deploy already running (a `paused` refusal, a NEEDS YOU). An
          #    output written before `fail` still reaches the job, as `reason` does.
          if [[ $EVENT == workflow_run || $INPUT_TARGET == production ]] && [[ ${DEPLOY_ENABLED,,} == true ]]; then
            out notify true
          else
            out notify false
          fi
          # Why production is off in a run that goes on for staging: paused (its switch isn't
          # exactly `true`) or gate; "-" when it deploys or wasn't asked for. Notify names it.
          PRODUCTION=false STAGING=false PRODUCTION_REASON=- target_notes=()
          if [[ $EVENT == workflow_run ]]; then
            requested=(production staging)
          else
            [[ $INPUT_TARGET == production || $INPUT_TARGET == staging ]] || fail target "The target must be production or staging."
            requested=("$INPUT_TARGET")
          fi
          for target in "${requested[@]}"; do
            if [[ $target == production && $DEPLOY_ENABLED == true ]]; then
              PRODUCTION=true
            elif [[ $target == production ]]; then
              PRODUCTION_REASON=paused
              target_notes+=("**Production is paused:** \`DEPLOY_ENABLED\` isn't true.")
            elif [[ $STAGING_DEPLOY_ENABLED == true ]]; then
              STAGING=true
            else
              target_notes+=("**Staging is paused:** \`STAGING_DEPLOY_ENABLED\` isn't true.")
            fi
          done
          if [[ $PRODUCTION == false && $STAGING == false ]]; then
            out deploy false
            out reason paused
            out production false
            out staging false
            out production_reason "$PRODUCTION_REASON"
            summary "## Deploy: paused" "" "The switch of the requested target is off (\`DEPLOY_ENABLED\` for production, \`STAGING_DEPLOY_ENABLED\` for staging), so nothing is planned or deployed."
            exit 0
          fi

          # 2. The gates are real. Production needs @deconfined alone and admins can't bypass it;
          #    staging needs no reviewer, since its host checks no approval, so a reviewer rule
          #    there would only look like a protection. Every environment accepts only main (one a
          #    typo auto-created has no policy). A failed gate turns off only its own target;
          #    notify's fails the plan.
          gate() {
            local json
            json=$(gh api "repos/$R/environments/$1") || return 1
            jq -e '.deployment_branch_policy == {protected_branches: false, custom_branch_policies: true}' <<< "$json" > /dev/null || return 1
            [[ $(gh api "repos/$R/environments/$1/deployment-branch-policies" | jq -c '[.branch_policies[] | {name, type}]') == '[{"name":"main","type":"branch"}]' ]] || return 1
            if [[ $1 == staging ]]; then
              jq -e '[.protection_rules[]? | select(.type == "required_reviewers")] | length == 0' <<< "$json" > /dev/null
              return
            fi
            [[ $1 == production ]] || return 0
            jq -e '.can_admins_bypass == false
              and ([.protection_rules[] | select(.type == "required_reviewers")]
                | length == 1
                  and .[0].prevent_self_review == false
                  and ([.[0].reviewers[] | {type, login: .reviewer.login}] == [{type: "User", login: "deconfined"}]))' <<< "$json" > /dev/null
          }
          gate notify || fail gate "The notify environment must accept only main."
          if [[ $PRODUCTION == true ]] && ! gate production; then
            PRODUCTION=false PRODUCTION_REASON=gate
            echo "::error::The production environment must require @deconfined alone (self-review allowed), refuse admin bypass and accept only main."
            target_notes+=("**Production is off in this run:** its environment must require @deconfined alone (self-review allowed), refuse admin bypass and accept only main.")
          fi
          if [[ $STAGING == true ]] && ! gate staging; then
            STAGING=false
            echo "::error::The staging environment must accept only main and require no reviewer."
            target_notes+=("**Staging is off in this run:** its environment must accept only main and require no reviewer.")
          fi
          [[ $PRODUCTION == true || $STAGING == true ]] || fail gate "No requested target passed its environment's gate."

          # 3. Staging has no approval, so only @deconfined may dispatch it, as both the run's actor
          #    and its triggering actor, by login and account id. A GitHub App or a workflow's
          #    GITHUB_TOKEN is refused on purpose: a pushed branch workflow could dispatch Deploy on
          #    main with its own token. The host checks the same again.
          if [[ $EVENT == workflow_dispatch && $STAGING == true ]]; then
            [[ $TRIGGERING_ACTOR == "$REVIEWER" ]] || fail dispatcher "Only @$REVIEWER may dispatch a staging deploy."
            run=$(gh api "repos/$R/actions/runs/$GITHUB_RUN_ID") || fail dispatcher "The runs API didn't answer, so this run's dispatcher can't be checked."
            jq -e --arg who "$REVIEWER" --argjson id "$REVIEWER_ID" '
                .actor.login == $who and .actor.id == $id
                and .triggering_actor.login == $who and .triggering_actor.id == $id' <<< "$run" > /dev/null ||
              fail dispatcher "Only @$REVIEWER may dispatch a staging deploy, as the run's actor and its triggering actor, by login and account id; a GitHub App or a workflow token can't."
          fi

          # 4. The target: version V, commit C and image digest D.
          ACTION=deploy FROM=- C_FROM=
          if [[ $EVENT == workflow_run ]]; then
            [[ $HEAD_SHA =~ ^[0-9a-f]{40}$ ]] || fail target "The publish run names no commit."
            C=$HEAD_SHA
            V=$(raw package.json "$C" | jq -er .version) || fail target "package.json can't be read at $C."
            [[ $V =~ $VER ]] || fail version "package.json at $C doesn't hold a plain X.Y.Z version."
            out version "$V"
            D=$(digest_of "$V") || fail image "$IMAGE:$V isn't published."
          else
            V=$INPUT_VERSION
            [[ $V =~ $VER ]] || fail version "The version must be X.Y.Z, with no pre-release."
            out version "$V"
            D=$(digest_of "$V") || fail image "$IMAGE:$V isn't published."
            C=$(revision_of "$V") || fail image "$IMAGE:$V carries no revision label."
            [[ $(raw package.json "$C" | jq -r .version || true) == "$V" ]] || fail version-mismatch "package.json at $C doesn't say $V."
            if [[ $INPUT_ROLLBACK == true ]]; then
              ACTION=rollback FROM=$INPUT_FROM
              [[ $FROM =~ $VER ]] || fail from "A rollback names the live version it leaves in 'from'."
              older "$V" "$FROM" || fail rollback-not-older "A rollback goes to an older release than $FROM."
              C_FROM=$(revision_of "$FROM") || fail image "$IMAGE:$FROM carries no revision label."
              back=$(gh api "repos/$R/compare/$C...$C_FROM") || fail compare "The compare API didn't answer."
              listed "$back" "The way back from $FROM to $V"
              across=$(jq '[.files[] | select((.filename | startswith("migrations/")) or ((.previous_filename // "") | startswith("migrations/")))] | length' <<< "$back")
              [[ $across == 0 ]] || fail rollback-across-migration "Migrations lie between $V and $FROM; the way back is a fix release or a restore."
            else
              [[ -z $INPUT_FROM ]] || fail from "'from' is only for a rollback."
            fi
          fi

          # 5. Binding: the version tag and the commit tag are the same image, and C is on main.
          [[ $(digest_of "sha-$C" || true) == "$D" ]] || fail digest-mismatch "The tags $V and sha-$C point at different images."
          status=$(gh api "repos/$R/compare/$C...main" --jq .status) || fail not-on-main "The compare API didn't answer."
          [[ $status == identical || $status == ahead ]] || fail not-on-main "$C isn't on main."

          # 6. Provenance, before any early exit and before either deploy job: main's publish.yml
          #    built D from C on a GitHub-hosted runner and signed it (2.32.0 and later). Tags can
          #    move, and any workflow in this repository could push one; only main's publish.yml can
          #    make this signature. The signer is the certificate's exact identity: gh turns
          #    --signer-workflow into a pattern anchored only at its start, which a workflow named
          #    publish.yml-anything would match too. gh also exits 1 on network or TUF errors, so a
          #    failure may be temporary: a new dispatch retries, since re-runs are refused.
          verified=$(gh attestation verify "oci://$IMAGE@$D" --repo deconfined/tarubot \
            --cert-identity https://github.com/deconfined/tarubot/.github/workflows/publish.yml@refs/heads/main \
            --source-ref refs/heads/main --source-digest "$C" \
            --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners \
            --format json) ||
            fail unattested "$IMAGE@$D isn't attested as built from $C by publish.yml on main, or the attestation couldn't be verified (gh fails on network and TUF errors too). Releases before 2.32.0 carry no attestation: deploy them by hand per docs/HOSTING.md. To retry, start a new dispatch; re-runs are refused."
          jq -e 'type == "array" and length >= 1' <<< "$verified" > /dev/null 2>&1 ||
            fail unattested "gh attestation verify returned no verified attestation for $IMAGE@$D. To retry, start a new dispatch; re-runs are refused."
          provenance="Provenance verified: publish.yml on refs/heads/main, commit $C"
          out action "$ACTION"
          out commit "$C"
          out digest "$D"
          out from "$FROM"

          # 7. Staging needs a release whose ops/deploy.sh declares Quadlet staging deploys: the
          #    words come from the target's own declaration, so no floor number is copied here.
          if [[ $STAGING == true ]]; then
            words=
            if deploy_sh=$(raw ops/deploy.sh "$C"); then
              declaration=$(grep -m 1 -E "$CAPABILITY_LINE" <<< "$deploy_sh" || true)
              if [[ $declaration =~ $CAPABILITY_LINE ]]; then words=" ${BASH_REMATCH[1]} "; fi
            fi
            if [[ $words != *" quadlet "* || $words != *" staging "* ]]; then
              STAGING=false
              [[ $PRODUCTION == true ]] || fail below-floor "$V's ops/deploy.sh doesn't declare Quadlet staging deploys (readonly CAPABILITIES with quadlet and staging), so staging can't take it."
              echo "::warning::$V's ops/deploy.sh doesn't declare Quadlet staging deploys; staging is off in this run."
              target_notes+=("**Staging is off in this run:** $V's \`ops/deploy.sh\` doesn't declare Quadlet staging deploys.")
            fi
          fi

          # 8. Automatic runs: did anything that runs on a host change in this merge?
          host_files=() added=() previous=
          if [[ $EVENT == workflow_run ]]; then
            P=$(gh api "repos/$R/commits/$C" --jq '.parents[0].sha') || fail compare "The commits API didn't answer."
            [[ $P =~ ^[0-9a-f]{40}$ ]] || fail compare "$C has no parent to compare with."
            previous=$(raw package.json "$P" | jq -r .version || true)
            cmp=$(gh api "repos/$R/compare/$P...$C") || fail compare "The compare API didn't answer."
            listed "$cmp" "This merge"
            runtime=false
            while IFS= read -r f; do
              [[ -n $f ]] || continue
              if [[ $f == package.json ]]; then
                # Only the version line may change for package.json to count as non-runtime. A
                # missing patch (too large to show) reads as "?", which counts as a runtime change.
                patch=$(jq -r '.files[] | select(.filename == "package.json") | .patch // "?"' <<< "$cmp")
                if grep -E '^[-+?]' <<< "$patch" | grep -vqE '^[-+][[:space:]]*"version":'; then runtime=true; fi
              elif is_runtime "$f"; then
                runtime=true
              fi
              if [[ $f =~ $HOST_SIDE ]]; then host_files+=("$f"); fi
            done < <(jq -r '.files[] | .filename, (.previous_filename // empty)' <<< "$cmp")
            # 9. An applied migration never changes; added files are listed.
            changed=$(jq -r '.files[] | select((.filename | startswith("migrations/")) or ((.previous_filename // "") | startswith("migrations/"))) | select(.status != "added") | .filename' <<< "$cmp")
            [[ -z $changed ]] || fail applied-migration-changed "This merge edits, renames or removes an applied migration: $(tr -c 'A-Za-z0-9._/-' ' ' <<< "$changed")"
            mapfile -t added < <(jq -r '.files[] | select(.status == "added" and (.filename | startswith("migrations/"))) | .filename' <<< "$cmp")
            if [[ $runtime == false ]]; then
              out deploy false
              out reason no-runtime-change
              out production false
              out staging false
              out production_reason "$PRODUCTION_REASON"
              summary "## Deploy $V: nothing to deploy" "" \
                "This merge ([$P...$C](https://github.com/$R/compare/$P...$C)) changes nothing that runs on the hosts (documentation, tests, CI or the version only), so nothing deploys and no approval is requested." \
                "If an earlier release wasn't deployed, run **Deploy** with the newest version." "" "$provenance"
              exit 0
            fi
          elif [[ $ACTION == rollback ]]; then
            mapfile -t host_files < <(jq -r '.files[] | .filename, (.previous_filename // empty)' <<< "$back" | grep -E "$HOST_SIDE" || true)
          fi
          newest=$(gh api "repos/$R/contents/migrations?ref=$C" --jq '[.[].name | select(test("^[0-9]{3}_[a-z0-9_]+\\.sql$"))] | sort | last // "none"') || newest=unknown

          # 10. The plan, public data only.
          if [[ $ACTION == rollback ]]; then
            summary "## Roll back from $FROM to $V" ""
          else
            summary "## Deploy $V" ""
          fi
          summary "| | |" "| --- | --- |" \
            "| Version | \`$V\` |" \
            "| Commit | [\`${C:0:12}\`](https://github.com/$R/commit/$C) |" \
            "| Image | \`$IMAGE@$D\` |"
          if [[ -n $previous ]]; then summary "| Previous release on main | \`$previous\` |"; fi
          summary "| Newest migration at this commit | \`$newest\` |" ""
          if [[ $PRODUCTION == true && $STAGING == true ]]; then
            summary "**Targets:** production, once @$REVIEWER approves it, and staging, which deploys at once beside the approval request, without one."
          elif [[ $PRODUCTION == true ]]; then
            summary "**Target:** production, once @$REVIEWER approves it."
          else
            summary "**Target:** staging, which deploys at once, without approval."
          fi
          summary "${target_notes[@]}" "" "$provenance" ""
          if [[ $EVENT == workflow_run ]]; then
            if (( ${#added[@]} )); then
              summary "**Migration files added in this merge:** ${added[*]}"
            else
              summary "**Migration files added in this merge:** none"
            fi
          fi
          summary "If a host is older than the previous release, earlier migrations are included too; each host decides from what is live there." ""
          # An automatic run can only list this merge's host-side changes, and a dispatch none: each
          # host deploys from whatever is live, so both point at the files' history up to C.
          history="[\`ops/\`](https://github.com/$R/commits/$C/ops), [\`docker-compose.production.yml\`](https://github.com/$R/commits/$C/docker-compose.production.yml), [\`production.env.example\`](https://github.com/$R/commits/$C/production.env.example) and [\`staging.env.example\`](https://github.com/$R/commits/$C/staging.env.example)"
          label=
          if [[ $ACTION == rollback ]]; then
            label="**Host-side differences between $V and $FROM**"
          elif [[ $EVENT == workflow_run ]]; then
            label="**Host-side changes in this merge**"
          fi
          if [[ -n $label ]] && (( ${#host_files[@]} )); then
            summary "$label ($HOST_RUN):"
            for f in "${host_files[@]}"; do summary "- \`$f\`"; done
            if printf '%s\n' "${host_files[@]}" | grep -qE '^(docker-compose\.production\.yml|production\.env\.example|staging\.env\.example)$'; then
              summary "" "The Compose file or a settings template changed: **check the host's .env first.**"
            fi
            summary ""
          elif [[ -n $label ]]; then
            summary "$label: no file under \`ops/\`, \`docker-compose.production.yml\`, \`production.env.example\` or \`staging.env.example\` changed." ""
          fi
          if [[ $PRODUCTION == true ]]; then check="Before approving, check"; else check="Check"; fi
          if [[ $EVENT == workflow_run ]]; then
            summary "If a host is older than the previous release, the host-side changes of the releases in between run too: check the history of $history up to this commit." ""
          elif [[ $ACTION == deploy ]]; then
            summary "**Host-side changes:** each host deploys from its live release to this commit. $check the history of $history up to this commit since the live release." ""
          fi
          day=$(date -u +%u) hm=$(date -u +%H%M)
          if [[ $day == 2 ]] && (( 10#$hm >= 1800 && 10#$hm < 2300 )); then
            echo "::warning::The database cluster's weekly maintenance runs Tuesdays 19:00-23:00 UTC; a migration deploy now may meet a restart."
            summary "> [!WARNING]" "> The database cluster's weekly maintenance runs Tuesdays 19:00-23:00 UTC. A migration deploy in that window may meet a cluster restart; the host warns again if it runs one then." ""
          fi
          if (( 10#$hm >= 415 && 10#$hm < 445 )); then
            echo "::warning::The daily backup runs around now; the host waits up to 5 minutes for it."
            summary "> [!WARNING]" "> The daily backup runs around now. The host waits up to 5 minutes for it, and a migration that meets it rolls back safely." ""
          fi
          if [[ $PRODUCTION == true && $STAGING == true ]]; then
            summary "**Tried on DevBot?** Check before approving. Staging deploys beside this request: its **Deploy staging** job shows how $V went there." ""
          elif [[ $PRODUCTION == true ]]; then
            summary "**Tried on DevBot?** Check before approving." ""
          fi
          # Production's host-side files run on its Docker host as a docker-group user, which is
          # root-equivalent there; staging's as the unprivileged tarubot user under rootless Podman.
          if [[ $PRODUCTION == true && $ACTION == rollback ]]; then
            summary "**Approving** rolls production back from $FROM to $V (\`${C:0:12}\`, \`$D\`), on the same schema: the host restarts onto $V, puts $FROM back automatically if $V never took the writer lease, then registers $V's commands globally and reads them back. Work only $FROM understands then fails as \`invalid_job\`: check \`/sync status\` and requeue it with \`retry.js\`." ""
          elif [[ $PRODUCTION == true ]]; then
            summary "**Approving** runs Deploy $V (\`${C:0:12}\`, \`$D\`) on production. The host restarts onto $V; or, if $V carries migration files the live release lacks, it stops the bot, takes an encrypted \`ops/backup.sh\` dump, runs \`migrate.js\` in $V's image and starts $V. It puts the previous release back automatically if $V never took the writer lease or the migration did not commit. It registers $V's commands globally and reads them back. It puts this commit's host-side files in place on production's Docker host, where they run as a docker-group user, which is root-equivalent there: the Compose file at once, \`ops/backup.sh\` for a migration's dump, and \`ops/deploy.sh\` from the next deploy on, including changes from releases production hasn't had yet. Approval comments are public." ""
          fi
          if [[ $PRODUCTION == true ]]; then when="at once, beside the approval request and without one"; else when="at once, without approval"; fi
          if [[ $STAGING == true && $ACTION == rollback ]]; then
            summary "**Staging** rolls back from $FROM to $V (\`${C:0:12}\`, \`$D\`) $when, on the same schema: the staging host restarts onto $V, puts $FROM back automatically if $V never took the writer lease, then registers $V's commands in the test guild and reads them back." ""
          elif [[ $STAGING == true ]]; then
            summary "**Staging** takes $V (\`${C:0:12}\`, \`$D\`) $when. The staging host restarts onto $V; or, if $V carries migration files staging lacks, it stops the bot, takes an encrypted \`ops/backup.sh\` dump, runs \`migrate.js\` in $V's image and starts $V. It registers $V's commands in the test guild and reads them back. There this commit's host-side files run as the unprivileged \`tarubot\` user under rootless Podman, and \`ops/ansible/\` as root when the playbook is applied. A failed staging deploy never holds production up." ""
          fi
          notes=$(raw CHANGELOG.md "$C" | awk -v v="$V" 'index($0, "## " v " ") == 1 { on = 1 } on && /^## / && index($0, "## " v " ") != 1 { exit } on { print }' || true)
          if [[ -n $notes ]]; then
            summary "<details><summary>Changelog</summary>" "" "$notes" "" "</details>"
          fi

          # 11. Outputs for the deploy jobs.
          out production "$PRODUCTION"
          out staging "$STAGING"
          out production_reason "$PRODUCTION_REASON"
          out deploy true
          out reason -

  # Two deploy jobs run beside each other, and production never needs staging's. A run can
  # therefore fail because of its staging job while production deployed: whether production
  # deployed a run is the Deploy job's conclusion together with the production approval, never the
  # run's conclusion. Notify reads it that way, and the host-configuration pull unit (2.34.0) must
  # too. The two SSH steps are the same script, written twice (tests/unit/deploy-workflow.test.ts
  # keeps them byte-identical); only DEPLOY_ENVIRONMENT and RECONNECT_SECONDS differ.
  deploy:
    name: Deploy
    needs: plan
    if: github.run_attempt == '1' && needs.plan.outputs.production == 'true' && (github.event_name == 'workflow_run' || inputs.target == 'production')
    runs-on: ubuntu-24.04
    # Longer than the reconnect deadline below, which covers the host's longest run (its waits and
    # timeouts add up to about 68 minutes).
    timeout-minutes: 90
    # @deconfined approves here; DEPLOY_SSH_KEY, DEPLOY_HOST and DEPLOY_KNOWN_HOSTS exist only then.
    environment: production
    permissions: {}
    outputs:
      started: ${{ steps.start.outputs.started }}
      outcome: ${{ steps.ssh.outputs.outcome || steps.start.outputs.outcome }}
      reason: ${{ steps.ssh.outputs.reason || steps.start.outputs.reason }}
      previous: ${{ steps.ssh.outputs.previous }}
      path: ${{ steps.ssh.outputs.path }}
      downtime: ${{ steps.ssh.outputs.downtime }}
      commands: ${{ steps.ssh.outputs.commands }}
      backup: ${{ steps.ssh.outputs.backup }}
      restore_point: ${{ steps.ssh.outputs.restore_point }}
      connected: ${{ steps.ssh.outputs.connected }}
      warnings: ${{ steps.ssh.outputs.warnings }}
    steps:
      - name: Check that deploys are still enabled
        id: start
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          echo started=true >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY_ENABLED" != true ]; then
            printf 'outcome=refused\nreason=paused\n' >> "$GITHUB_OUTPUT"
            echo "::error::Deploys were paused after this request; nothing changed."
            exit 1
          fi
      - name: Run the deploy on the host
        id: ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_ENVIRONMENT: production
          # ops/deploy.sh's waits and timeouts add up to about 68 minutes in the worst case.
          RECONNECT_SECONDS: "4800"
          ACTION: ${{ needs.plan.outputs.action }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          DIGEST: ${{ needs.plan.outputs.digest }}
          FROM: ${{ needs.plan.outputs.from }}
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          umask 077
          dir=$RUNNER_TEMP/ssh
          mkdir "$dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key"
          unset DEPLOY_SSH_KEY
          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          stop() { out reason "$1"; echo "::error::$2"; exit 1; }
          # The job's two settings; everything else in this script is the same for both targets.
          [[ $DEPLOY_ENVIRONMENT =~ ^(production|staging)$ && $RECONNECT_SECONDS =~ ^[1-9][0-9]{0,4}$ ]] ||
            stop bad-request "The job's DEPLOY_ENVIRONMENT or RECONNECT_SECONDS is malformed."
          grep -q 'PRIVATE KEY' "$dir/key" || stop no-key "DEPLOY_SSH_KEY isn't set in the $DEPLOY_ENVIRONMENT environment."

          # The host and its pinned key come from the deploy environment's variables.
          HOST_NAME='^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
          KNOWN_HOST='^([^ ]+) ssh-ed25519 [A-Za-z0-9+/]+={0,2}$'
          [[ $DEPLOY_HOST =~ $HOST_NAME ]] || stop known-hosts "DEPLOY_HOST must be the $DEPLOY_ENVIRONMENT host's DNS name."
          kh=${DEPLOY_KNOWN_HOSTS%$'\n'}
          kh=${kh%$'\r'}
          if [[ $kh == *$'\n'* ]] || ! [[ $kh =~ $KNOWN_HOST ]] || [[ ${BASH_REMATCH[1]} != "$DEPLOY_HOST" ]]; then
