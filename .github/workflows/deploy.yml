          fi
          printf '%s\n' "$kh" > "$dir/kh"

          # The v1 command contract, the same patterns as ops/deploy.sh.
          DEPLOY_FORM='^deploy ((0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})) ([0-9a-f]{40}) (sha256:[0-9a-f]{64}) ([1-9][0-9]{0,19})$'
          ROLLBACK_FORM='^rollback ((0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})) ([0-9a-f]{40}) (sha256:[0-9a-f]{64}) ([1-9][0-9]{0,19}) ((0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3}))$'
          RESULT_FORM='^result outcome=(deployed|already-live|superseded|refused|recovered|needs-you) version=(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3}) previous=((0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})|-) path=(plain|migration|rollback|none) downtime=([0-9]{1,5}|-) commands=(registered|failed|skipped) backup=(daily/tarubot-[0-9]{8}T[0-9]{6}Z\.dump\.age|-) restore_point=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}Z|-) reason=([a-z0-9-]{1,40}|-)$'
          STEP_LINE='^step [a-z-]{1,20}$'
          WARNING_LINE='^warning [a-z0-9-]{1,40}$'
          if [[ $ACTION == rollback ]]; then
            CMD="rollback $VERSION $COMMIT $DIGEST $GITHUB_RUN_ID $FROM"
          else
            CMD="deploy $VERSION $COMMIT $DIGEST $GITHUB_RUN_ID"
          fi
          [[ $CMD =~ $DEPLOY_FORM || $CMD =~ $ROLLBACK_FORM ]] || stop bad-request "The plan's fields don't fit the command contract."

          # One connection; only connection failures are retried, with the same command, which
          # attaches to the same run on the host, until RECONNECT_SECONDS have passed (80 minutes
          # for production, 5 for staging). ssh's own messages stay in a private file. `reached`
          # stays false only while every attempt failed before sshd answered, which is the only
          # case where nothing can have started on the host.
          NO_CONNECTION='connect to host .* port [0-9]+: |Could not resolve hostname|Connection timed out during banner exchange|kex_exchange_identification'
          : > "$dir/lines"
          reason='' rc=0 reached=false
          deadline=$((SECONDS + RECONNECT_SECONDS))
          while :; do
            set +e
            ssh -F /dev/null -T -4 -i "$dir/key" -o IdentitiesOnly=yes -o IdentityAgent=none \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/kh" \
              -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o CheckHostIP=no \
              -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=20 -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 -o LogLevel=ERROR \
              "tarubot@$DEPLOY_HOST" "$CMD" < /dev/null 2> "$dir/err" |
              while IFS= read -r line; do
                printf '%s\n' "$line" >> "$dir/lines"
                if [[ $line =~ $STEP_LINE || $line =~ $RESULT_FORM ]]; then
                  printf '%s\n' "$line"
                elif [[ $line =~ $WARNING_LINE ]]; then
                  echo "::warning::The host reports: ${line#warning }"
                fi
              done
            rc=${PIPESTATUS[0]}
            set -e
            if [[ -s $dir/lines ]] || ! grep -qE "$NO_CONNECTION" "$dir/err"; then reached=true; fi
            if grep -qE "$RESULT_FORM" "$dir/lines"; then break; fi
            if grep -qE 'Host key verification failed|REMOTE HOST IDENTIFICATION HAS CHANGED' "$dir/err"; then reason=host-key; break; fi
            if grep -qF 'Permission denied (publickey' "$dir/err"; then reason=key-rejected; break; fi
            if (( rc != 255 )) || (( SECONDS >= deadline )); then break; fi
            sleep 20
          done

          out connected "$reached"
          warnings=$(grep -E "$WARNING_LINE" "$dir/lines" | sed 's/^warning //' | sort -u | tr '\n' ' ' || true)
          out warnings "${warnings% }"
          result=$(grep -E "$RESULT_FORM" "$dir/lines" | tail -n 1 || true)
          if [[ -z $result ]]; then
            if [[ -z $reason ]]; then
              if (( rc == 64 )); then reason=bad-request
              elif [[ $reached == true ]]; then reason=outcome-unknown
              else reason=unreachable
              fi
            fi
            stop "$reason" "No result from the host ($reason)."
          fi
          read -r -a fields <<< "${result#result }"
          for field in "${fields[@]}"; do out "${field%%=*}" "${field#*=}"; done
          case $result in
            "result outcome=deployed "* | "result outcome=already-live "* | "result outcome=superseded "*) ;;
            *) echo "::error::The deploy did not complete: ${result#result }"; exit 1 ;;
          esac
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"

  # Staging deploys without approval: the `staging` environment has no reviewers ("If it breaks,
  # who cares?"), accepts only main, and holds staging's own DEPLOY_SSH_KEY, DEPLOY_HOST and
  # DEPLOY_KNOWN_HOSTS. The staging host's forced command is `ops/deploy.sh quadlet staging`, which
  # checks this run, its title, this job and, for a dispatch, that @deconfined started it.
  #
  # The accepted plan set 30 minutes and a 5-minute reconnect deadline, so a dead staging host
  # never holds a runner for 90 minutes. The trade-off: a staging run can outlive this job, through
  # a long migration trial or a connection lost for more than 5 minutes. The host run then goes on
  # by itself, the job ends cancelled or `outcome-unknown`, the host's run directory
  # (~/.local/state/tarubot-deploy/runs/<run>/result) keeps the result, and the next staging
  # dispatch waits up to 300 s for the host lock.
  deploy-staging:
    name: Deploy staging
    needs: plan
    if: github.run_attempt == '1' && needs.plan.outputs.staging == 'true' && (github.event_name == 'workflow_run' || inputs.target == 'staging')
