# Plans and applies ops/tofu/, the OpenTofu module that builds TaruBot's hosts, their Cloud
# Firewalls, their DNS records and the managed database's access lists (2.36.0, issue #62).
# ops/tofu/README.md has the runbook; the owner's decisions are REQUIREMENTS.md "Approved pipeline
# amendments (2026-09-29)", whose confirmed item 4 gives the two jobs their own environments.
#
#   plan   The `infra-plan` environment, with no reviewer: read-only provider tokens and a
#          read-only state key (the *_READ_* secrets). It plans without a state lock
#          (-lock=false), since its key can't write one, and prints only the change list: each
#          change's action and resource address, with added and removed counts on the access
#          lists. For operation=apply with changes it keeps the saved plan for Apply.
#   apply  Only for operation=apply with changes: it waits for @deconfined's approval in `infra`,
#          which holds the write tokens and the read/write state key (the *_WRITE_* secrets), then
#          applies exactly the Plan job's saved plan. It refuses a file whose SHA-256 or change
#          list differs from the Plan job's, or that was planned with values other than infra's
#          own TOFU_VARS, and OpenTofu refuses the plan if the state changed since (a stale plan).
#          It never plans.
#
# Each step runs one phase of ops/tofu/ci/tofu-ci.sh, which holds the scripts and, beside it, the
# jq programs, so Plan and Apply run the same code; each step's env: holds only the secrets its
# phase needs. The repository and its Actions logs are public. So nothing here prints OpenTofu's
# own output, a host name, an address, an ID or a key: the prepare phase masks every such value
# inside TOFU_VARS before anything else prints (GitHub masks a secret only where its whole value
# appears), plan and apply write to private files under $RUNNER_TEMP/tofu, and diagnostics print
# filtered. The runner prints each step's env: unmasked, so the replace input never goes there:
# prepare reads it from the event payload. Apply prints no host key either: after a build the
# owner pins it from their own machine (README.md, "Pinning a new host key").
#
# The saved plan is the one file that leaves a job: a one-day artifact, which anyone signed in to
# GitHub can download from this public repository. It is only ever OpenTofu's own encrypted file
# (ops/tofu/versions.tf enforces plan encryption with the state passphrase, which must be at least
# 32 characters), and it is kept only for an apply whose plan passed the guards.
#
# Dispatch only, from main only (both environments also accept only main), so no pull request's
# code ever runs with these secrets. infra-plan has no reviewer, so its branch rule is all that
# keeps another ref's code from its secrets. The environments' rules are the owner's own settings,
# read back once when they are made (docs/HOSTING.md, owner step 6); no run checks them again.
# Re-runs are refused: every job requires the first attempt. The one concurrency group serializes
# runs, and `queue: max` keeps every waiting run instead of replacing it with the newest; there is
# no state lock, so a hand run must never overlap one.
name: Infrastructure
run-name: Infrastructure ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "plan shows the changes; apply also makes them, after your approval"
        type: choice
        options: [plan, apply]
        default: plan
      replace:
        description: 'Rebuild one host: linode_instance.host["<key>"] (needs allow_destroy)'
        type: string
        default: ""
      allow_destroy:
        description: "Allow a plan that deletes or replaces anything"
        type: boolean
        default: false
      allow_access_removal:
        description: "Allow a plan that removes an entry from a database access list"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: infra
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  plan:
    name: Plan
    if: github.run_attempt == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: infra-plan
    permissions:
      contents: read
    outputs:
      changes: ${{ steps.summary.outputs.changes }}
      has_changes: ${{ steps.summary.outputs.has_changes }}
      digest: ${{ steps.summary.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned OpenTofu
        run: bash ops/tofu/ci/tofu-ci.sh install
      # The replace input reaches the script through the event payload, never env:, which the
      # runner prints unmasked before the step runs.
      - name: Prepare the values and the masks
        env:
          TOFU_VARS: ${{ secrets.TOFU_VARS }}
          STATE_BUCKET: ${{ secrets.TOFU_STATE_BUCKET }}
          STATE_ENDPOINT: ${{ secrets.TOFU_STATE_ENDPOINT }}
        run: bash ops/tofu/ci/tofu-ci.sh prepare
      - name: Initialize OpenTofu
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_READ_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_READ_SECRET_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
        run: bash ops/tofu/ci/tofu-ci.sh init
      - name: Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_READ_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_READ_SECRET_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
          LINODE_TOKEN: ${{ secrets.LINODE_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
        run: bash ops/tofu/ci/tofu-ci.sh plan
      - name: Summarize the plan
        id: summary
        env:
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
          ALLOW_ACCESS_REMOVAL: ${{ inputs.allow_access_removal }}
        run: bash ops/tofu/ci/tofu-ci.sh summarize
      # Only a plan that passed the guards, for an apply, leaves the job: the encrypted file alone.
      - name: Keep the saved plan for Apply
        if: inputs.operation == 'apply' && steps.summary.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saved-plan
          path: ${{ runner.temp }}/tofu/plan.bin
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Clean up
        if: always()
        run: rm -rf -- "${RUNNER_TEMP:?}/tofu"

  apply:
    name: Apply
    needs: plan
    if: >-
      github.run_attempt == '1' && github.ref == 'refs/heads/main'
      && inputs.operation == 'apply' && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: infra
    permissions:
      contents: read
    steps:
      # The Plan job's first steps again, then the saved plan in place of a new one.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned OpenTofu
        run: bash ops/tofu/ci/tofu-ci.sh install
      - name: Prepare the values and the masks
        env:
          TOFU_VARS: ${{ secrets.TOFU_VARS }}
          STATE_BUCKET: ${{ secrets.TOFU_STATE_BUCKET }}
          STATE_ENDPOINT: ${{ secrets.TOFU_STATE_ENDPOINT }}
        run: bash ops/tofu/ci/tofu-ci.sh prepare
      - name: Initialize OpenTofu
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_WRITE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_WRITE_SECRET_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
        run: bash ops/tofu/ci/tofu-ci.sh init
      - name: Fetch the saved plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: saved-plan
          path: ${{ runner.temp }}/tofu
      - name: Compare with the reviewed plan
        env:
          DIGEST: ${{ needs.plan.outputs.digest }}
          APPROVED: ${{ needs.plan.outputs.changes }}
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
        run: bash ops/tofu/ci/tofu-ci.sh compare
      - name: Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_WRITE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_WRITE_SECRET_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
          LINODE_TOKEN: ${{ secrets.LINODE_WRITE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WRITE_TOKEN }}
        run: bash ops/tofu/ci/tofu-ci.sh apply
      - name: Clean up
        if: always()
        run: rm -rf -- "${RUNNER_TEMP:?}/tofu"
