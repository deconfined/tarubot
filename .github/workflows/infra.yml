# Plans and applies ops/tofu/, the OpenTofu module that builds TaruBot's hosts, their Cloud
# Firewalls, their DNS records and the managed database's access lists (2.36.0, issue #62).
# ops/tofu/README.md has the runbook; the owner's decisions are REQUIREMENTS.md "Approved pipeline
# amendments (2026-09-29)".
#
#   plan   The `infra` environment: it waits for @deconfined's approval, then plans with the
#          environment's tokens and state, and prints only the change list: each change's action
#          and resource address, with added and removed counts on the access lists.
#   apply  Only for operation=apply with changes: it waits for a second approval in `infra`,
#          plans again, refuses unless its change list equals the approved one, and applies that
#          new saved plan.
#
# Each step runs one phase of ops/tofu/ci/tofu-ci.sh, which holds the scripts and, beside it, the
# jq programs, so both jobs run the same code; each step's env: holds only the secrets its phase
# needs. The repository and its Actions logs are public. So nothing here prints OpenTofu's own
# output, a host name, an address, an ID or a key: the prepare phase masks every such value inside
# TOFU_VARS before anything else prints (GitHub masks a secret only where its whole value
# appears), plan and apply write to private files under $RUNNER_TEMP/tofu, and diagnostics print
# filtered. Apply prints no host key either: after a build the owner pins it from their own
# machine (README.md, "Pinning a new host key").
#
# Dispatch only, from main only (the environment also accepts only main), so no pull request's
# code ever runs with these secrets. Re-runs are refused: every job requires the first attempt.
# The one concurrency group serializes runs, and `queue: max` keeps every waiting run instead of
# replacing it with the newest; there is no state lock, so a hand run must never overlap one.
name: Infrastructure
run-name: Infrastructure ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "plan shows the changes; apply also makes them, after a second approval"
        type: choice
        options: [plan, apply]
        default: plan
      replace:
        description: 'Rebuild one host: linode_instance.host["<key>"] (needs allow_destroy)'
        type: string
        default: ""
      allow_destroy:
        description: "Allow a plan that deletes or replaces anything"
        type: boolean
        default: false
      allow_access_removal:
        description: "Allow a plan that removes an entry from a database access list"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: infra
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  plan:
    name: Plan
    if: github.run_attempt == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: infra
    permissions:
      contents: read
    outputs:
      changes: ${{ steps.summary.outputs.changes }}
      has_changes: ${{ steps.summary.outputs.has_changes }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned OpenTofu
        run: bash ops/tofu/ci/tofu-ci.sh install
      - name: Prepare the values and the masks
        env:
          TOFU_VARS: ${{ secrets.TOFU_VARS }}
          STATE_BUCKET: ${{ secrets.TOFU_STATE_BUCKET }}
          STATE_ENDPOINT: ${{ secrets.TOFU_STATE_ENDPOINT }}
          REPLACE: ${{ inputs.replace }}
        run: bash ops/tofu/ci/tofu-ci.sh prepare
      - name: Initialize OpenTofu
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
        run: bash ops/tofu/ci/tofu-ci.sh init
      - name: Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash ops/tofu/ci/tofu-ci.sh plan
      - name: Summarize the plan
        id: summary
        env:
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
          ALLOW_ACCESS_REMOVAL: ${{ inputs.allow_access_removal }}
        run: bash ops/tofu/ci/tofu-ci.sh summarize
      - name: Clean up
        if: always()
        run: rm -rf -- "${RUNNER_TEMP:?}/tofu"

  apply:
    name: Apply
    needs: plan
    if: >-
      github.run_attempt == '1' && github.ref == 'refs/heads/main'
      && inputs.operation == 'apply' && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: infra
    permissions:
      contents: read
    steps:
      # The Plan job's steps again, so this job applies its own saved plan, then the two it adds.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned OpenTofu
        run: bash ops/tofu/ci/tofu-ci.sh install
      - name: Prepare the values and the masks
        env:
          TOFU_VARS: ${{ secrets.TOFU_VARS }}
          STATE_BUCKET: ${{ secrets.TOFU_STATE_BUCKET }}
          STATE_ENDPOINT: ${{ secrets.TOFU_STATE_ENDPOINT }}
          REPLACE: ${{ inputs.replace }}
        run: bash ops/tofu/ci/tofu-ci.sh prepare
      - name: Initialize OpenTofu
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
        run: bash ops/tofu/ci/tofu-ci.sh init
      - name: Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash ops/tofu/ci/tofu-ci.sh plan
      - name: Summarize the plan
        id: summary
        env:
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
          ALLOW_ACCESS_REMOVAL: ${{ inputs.allow_access_removal }}
        run: bash ops/tofu/ci/tofu-ci.sh summarize
      - name: Compare with the approved plan
        env:
          APPROVED: ${{ needs.plan.outputs.changes }}
        run: bash ops/tofu/ci/tofu-ci.sh compare
      - name: Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash ops/tofu/ci/tofu-ci.sh apply
      - name: Clean up
        if: always()
        run: rm -rf -- "${RUNNER_TEMP:?}/tofu"
