# Documentation site. Pull requests that touch site/ get an advisory build (not part of CI result;
# docs-site.test.ts in CI's checks job is the required gate for page content). Main rebuilds the
# site and publishes it to GitHub Pages; manual dispatch from main redeploys the current content.
name: Documentation site

on:
  pull_request:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only main (pushes and manual runs from main) joins the deploy group: deploys run one at a
  # time and are never cancelled, so an older main can't finish deploying after a newer one.
  # Everything else, pull requests (refs/pull/N/merge) and build-only dispatches from other
  # branches, gets a group of its own and supersedes only its own stale builds, so it can never
  # cancel a pending main deploy.
  group: pages-${{ github.ref == 'refs/heads/main' && 'deploy' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the site's pnpm version
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json # packageManager; relative to the repository root
      - name: Install the site's Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/package.json # engines.node
      - name: Install locked site dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the site and check its internal links
        run: pnpm run build
      - name: Upload the site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact the build job uploaded
      id-token: write # OIDC proof that this workflow made the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
