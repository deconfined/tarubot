# Reusable for publish.yml only: build one runtime platform on its native runner and push it by
# digest, with its provenance and SBOM. No tag is written here; publish.yml tags a single index of
# both platform digests, and only while the release version is still absent.
name: Publish one platform

on:
  workflow_call:
    inputs:
      arch:
        description: "amd64 or arm64"
        type: string
        required: true
      runner:
        description: "The native GitHub-hosted runner for that architecture"
        type: string
        required: true
      version:
        description: "The validated release X.Y.Z, for the image labels"
        type: string
        required: true
    outputs:
      digest:
        description: "The platform's pushed index digest: its image plus attestation manifests"
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

jobs:
  build:
    name: Build ${{ inputs.arch }}
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      (inputs.arch == 'amd64' || inputs.arch == 'arm64')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=tarubot
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      # The runtime target only compiles: pull-request CI already ran the in-image suite for this
      # exact tree on this platform, and publish.yml's gate proved the tree is that one.
      - name: Build and push the ${{ inputs.arch }} image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: tarubot
          platforms: linux/${{ inputs.arch }}
          # Refresh Alpine packages at publication even when the upstream Bun tag is unchanged.
          no-cache-filters: base
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=tarubot-${{ inputs.arch }}
          cache-to: type=gha,mode=max,scope=tarubot-${{ inputs.arch }}
      - name: Require an exact pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: '[[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]'
