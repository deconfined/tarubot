# Reusable scanner: the build's index is input, not a tag. No provider/host or registry-write access.
name: Scan release platforms
on:
  workflow_call:
    inputs:
      digest:
        type: string
        required: true
permissions: {}
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install the pinned scanner
        run: |
          # GitHub's release asset SHA-256 is pinned independently of downloads and mutable tags.
          set -Eeuo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/scanner"
          curl -fsSL --proto '=https' --tlsv1.2 --max-time 120 \
            -o "$RUNNER_TEMP/scanner/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          printf '%s  %s\n' 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a "$RUNNER_TEMP/scanner/trivy.tar.gz" | sha256sum --check --strict --quiet
          tar -xzf "$RUNNER_TEMP/scanner/trivy.tar.gz" -C "$RUNNER_TEMP/scanner" trivy
          echo "$RUNNER_TEMP/scanner" >> "$GITHUB_PATH"
      - name: Scan both runtime digests
        env:
          DIGEST: ${{ inputs.digest }}
        run: bun scripts/release-scan.ts
      - name: Remove private scanner output
        if: always()
        run: rm -rf -- "${RUNNER_TEMP:?}/release-scan" "${RUNNER_TEMP:?}/scanner"
