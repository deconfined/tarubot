name: Publish containers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image
    needs: verify
    # Dispatches and reruns verify only; maintenance never overwrites an existing version.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: publish-version-${{ needs.verify.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version publication
        id: publication
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_REQUESTED: ${{ needs.verify.outputs.release }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ ! $VERSION =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$ ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Production requires stable X.Y.Z with at most four digits per component; this version is verification-only.'
            exit 0
          fi
          repository="${GITHUB_REPOSITORY,,}"
          token=$(printf 'user = "%s:%s"\n' "$GHCR_USER" "$GHCR_TOKEN" \
            | curl --config - --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull" \
            | jq -er '(.token // .access_token) | strings | select(test("\\A[A-Za-z0-9._~+/-]+=*\\z"))')
          echo "::add-mask::$token"
          status=$(printf 'header = "Authorization: Bearer %s"\n' "$token" \
            | curl --config - --silent --show-error --connect-timeout 10 --max-time 30 \
              --head --output /dev/null --write-out '%{http_code}' \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repository}/manifests/${VERSION}")
          case "$status" in
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            200)
              if [[ $RELEASE_REQUESTED == true ]]; then
                echo '::error::This release version already exists; use a new version.'
                exit 1
              fi
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              echo '::notice::Published maintenance version retained; no release image or deployment.' ;;
            *) echo '::error::Could not establish release version absence.'; exit 1 ;;
          esac
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.publication.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.publication.outputs.publish == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.publication.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        if: steps.publication.outputs.publish == 'true'
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=tarubot
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and publish both platforms
        id: build
        if: steps.publication.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: tarubot
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache-filters: base
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=tarubot
          cache-to: type=gha,mode=max,scope=tarubot

  scan:
    name: Scan built platforms
    needs: publish
    if: needs.publish.outputs.digest != '' && github.run_attempt == '1'
    uses: ./.github/workflows/scan.yml
    with:
      digest: ${{ needs.publish.outputs.digest }}
    permissions:
      contents: read

  attest:
    name: Sign build provenance
    needs: [publish, scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The signing job neither installs dependencies nor holds registry write credentials.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Validate exact subject and reviewed exception freshness
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          bun --no-env-file scripts/release-scan-exceptions.ts sign
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/deconfined/tarubot
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: false

  latest:
    name: Promote latest
    needs: [publish, attest]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ghcr-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote signed digest only while main is current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          bun --no-env-file scripts/release-scan-exceptions.ts promote
          current=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [[ $current != "$GITHUB_SHA" ]]; then
            echo '::notice::Main advanced; latest is unchanged.'
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:latest" "$image@$DIGEST"

  deploy:
    name: Production release
    needs: [verify, publish, attest, latest]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.run_attempt == '1' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      actions: read
      attestations: read
    with:
      target: production
      version: ${{ needs.verify.outputs.version }}
      commit: ${{ github.sha }}
      digest: ${{ needs.publish.outputs.digest }}
