name: Publish containers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

# A release is two images: ghcr.io/deconfined/tarubot:X.Y.Z (the bot and its tools) and :web-X.Y.Z
# (Caddy with TaruBot's Caddyfile and offline page, the Dockerfile's web stage). Every job may be
# re-run after a failure, and re-running really retries: publication resumes only with this
# commit's own tagged images, never over another commit's release, and a deployment verifies the
# release again and proceeds only on an approval given in its own attempt (deploy.yml). Downstream
# jobs name the results they need rather than relying on success(), which a deliberately skipped
# fallback would make false.
jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tested: ${{ steps.proof.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate version and release metadata
        id: version
        env:
          CI_BASE_SHA: ${{ github.event.before || '' }}
        run: bun run ci:version
      # The ruleset requires "CI result" on a branch that is up to date with main, and merges by
      # merge commit. So a merge commit whose tree equals its pull request's head carries exactly
      # the tree that pull-request CI tested: every check, and the in-image suite on native AMD64
      # and ARM64. Anything else (a direct push, a dispatch, a different tree) runs full CI.
      - name: Prove this exact tree passed pull-request CI
        id: proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          tested=false
          trap 'printf "tested=%s\n" "$tested" >> "$GITHUB_OUTPUT"' EXIT
          fallback() {
            echo "::notice::$1; running the full CI suite instead."
            exit 0
          }
          [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/main ]] ||
            fallback 'This run is not a push to main'
          pulls=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls") ||
            fallback 'The merged pull request could not be read'
          merged=$(jq -er --arg sha "$GITHUB_SHA" '
            [.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)]
            | if length == 1 then "\(.[0].number) \(.[0].head.sha)" else empty end' <<<"$pulls") ||
            fallback 'No single pull request was merged as this commit'
          number=${merged%% *}
          head=${merged#* }
          [[ $number =~ ^[1-9][0-9]{0,9}$ && $head =~ ^[0-9a-f]{40}$ ]] ||
            fallback 'The merged pull request has an unexpected number or head'
          [[ $(git rev-parse --verify --quiet "$GITHUB_SHA^2") == "$head" ]] ||
            fallback "This commit's second parent is not PR #$number's head"
          [[ $(git rev-parse "$GITHUB_SHA^{tree}") == "$(git rev-parse "$head^{tree}")" ]] ||
            fallback "The merged tree differs from PR #$number's tested head"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head&status=success&per_page=20") ||
            fallback 'Pull-request CI runs could not be read'
          run=$(jq -er --arg head "$head" '
            [.workflow_runs[] | select(.head_sha == $head and .event == "pull_request" and .conclusion == "success")]
            | max_by(.run_number) | .id // empty' <<<"$runs") ||
            fallback "PR #$number's head has no successful pull-request CI run"
          [[ $run =~ ^[1-9][0-9]{0,19}$ ]] || fallback 'The CI run ID is unexpected'
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=50") ||
            fallback "CI run $run's jobs could not be read"
          jq -e '[.jobs[] | select(.conclusion == "success") | .name] as $passed
            | ["Checks", "Container build (amd64)", "Container build (arm64)", "CI result"]
            | all(. as $name | $passed | index($name) != null)' <<<"$jobs" > /dev/null ||
            fallback "CI run $run lacks a passing check, platform test or result"
          tested=true
          echo "::notice::This tree is PR #$number's head, which CI run $run tested; publication does not run CI again."

  verify:
    name: Verify release
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml
    # Everything the gate's proof requires, including the in-image suite on both platforms.
    with:
      platform-tests: true

  prepare:
    name: Check version publication
    needs: [gate, verify]
    # The gate's proof or the full fallback suite must have passed; a skipped fallback alone proves
    # nothing. Dispatches verify only.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.gate.result == 'success' &&
      (needs.gate.outputs.tested == 'true' || needs.verify.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
    steps:
      - name: Check version publication
        id: publication
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          RELEASE_REQUESTED: ${{ needs.gate.outputs.release }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ ! $VERSION =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$ ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Production requires stable X.Y.Z with at most four digits per component; this version is verification-only.'
            exit 0
          fi
          repository="${GITHUB_REPOSITORY,,}"
          token=$(printf 'user = "%s:%s"\n' "$GHCR_USER" "$GHCR_TOKEN" \
            | curl --config - --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull" \
            | jq -er '(.token // .access_token) | strings | select(test("\\A[A-Za-z0-9._~+/-]+=*\\z"))')
          echo "::add-mask::$token"
          accept='Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          # A tag's HTTP status (404 absent, 200 present), and its index digest once present.
          status_of() {
            printf 'header = "Authorization: Bearer %s"\n' "$token" \
              | curl --config - --silent --show-error --connect-timeout 10 --max-time 30 \
                --head --output /dev/null --write-out '%{http_code}' --header "$accept" \
                "https://ghcr.io/v2/${repository}/manifests/$1"
          }
          digest_of() {
            printf 'header = "Authorization: Bearer %s"\n' "$token" \
              | curl --config - --fail --silent --show-error --connect-timeout 10 --max-time 30 \
                --head --output /dev/null --dump-header - --header "$accept" \
                "https://ghcr.io/v2/${repository}/manifests/$1" \
              | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }'
          }
          # This commit owns the published version when its own sha- tag names the same index.
          # The publish job writes that tag first, so a version tag never exists without it.
          own_release() {
            local mine released
            case "$(status_of "sha-$GITHUB_SHA")" in
              200) ;;
              404) return 1 ;;
              *) return 2 ;;
            esac
            mine=$(digest_of "sha-$GITHUB_SHA") && released=$(digest_of "$VERSION") || return 2
            [[ $mine =~ ^sha256:[0-9a-f]{64}$ && $released == "$mine" ]]
          }
          status=$(status_of "$VERSION")
          case "$status" in
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            200)
              # Re-run all jobs finds this run's own release, including a maintenance commit that
              # finished a release whose tag was never published: resume it, never skip it.
              if own_release; then
                echo 'publish=true' >> "$GITHUB_OUTPUT"
                echo '::notice::This commit already published this version; resuming with its own index.'
              elif (( $? == 2 )); then
                echo '::error::Could not read the published tags; re-run once GHCR answers.'
                exit 1
              elif [[ $RELEASE_REQUESTED != true ]]; then
                echo 'publish=false' >> "$GITHUB_OUTPUT"
                echo '::notice::Published maintenance version retained; no release image or deployment.'
              else
                echo '::error::This release version was already published from another commit; release a new version.'
                exit 1
              fi ;;
            *) echo '::error::Could not establish release version absence.'; exit 1 ;;
          esac

  amd64:
    name: Platform amd64
    needs: [gate, prepare]
    if: >-
      !cancelled() && needs.gate.result == 'success' && needs.prepare.result == 'success' &&
      needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/publish-platform.yml
    permissions:
      contents: read
      packages: write
    with:
      arch: amd64
      runner: ubuntu-24.04
      version: ${{ needs.gate.outputs.version }}

  arm64:
    name: Platform arm64
    needs: [gate, prepare]
    if: >-
      !cancelled() && needs.gate.result == 'success' && needs.prepare.result == 'success' &&
      needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/publish-platform.yml
    permissions:
      contents: read
      packages: write
    with:
      arch: arm64
      runner: ubuntu-24.04-arm
      version: ${{ needs.gate.outputs.version }}

  publish:
    name: Publish image
    needs: [gate, amd64, arm64]
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      needs.amd64.result == 'success' && needs.arm64.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Serializes the final absence check and tagging per version; never overwrites a release.
    concurrency:
      group: publish-version-${{ needs.gate.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag one index of both platforms while the version is absent
        id: merge
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          AMD64: ${{ needs.amd64.outputs.digest }}
          ARM64: ${{ needs.arm64.outputs.digest }}
          RELEASE_REQUESTED: ${{ needs.gate.outputs.release }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ $VERSION =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$ ]]
          [[ $AMD64 =~ ^sha256:[0-9a-f]{64}$ && $ARM64 =~ ^sha256:[0-9a-f]{64}$ && $AMD64 != "$ARM64" ]]
          repository="${GITHUB_REPOSITORY,,}"
          token=$(printf 'user = "%s:%s"\n' "$GHCR_USER" "$GHCR_TOKEN" \
            | curl --config - --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull" \
            | jq -er '(.token // .access_token) | strings | select(test("\\A[A-Za-z0-9._~+/-]+=*\\z"))')
          echo "::add-mask::$token"
          accept='Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          # A tag's HTTP status (404 absent, 200 present), and its index digest once present.
          status_of() {
            printf 'header = "Authorization: Bearer %s"\n' "$token" \
              | curl --config - --silent --show-error --connect-timeout 10 --max-time 30 \
                --head --output /dev/null --write-out '%{http_code}' --header "$accept" \
                "https://ghcr.io/v2/${repository}/manifests/$1"
          }
          digest_of() {
            printf 'header = "Authorization: Bearer %s"\n' "$token" \
              | curl --config - --fail --silent --show-error --connect-timeout 10 --max-time 30 \
                --head --output /dev/null --dump-header - --header "$accept" \
                "https://ghcr.io/v2/${repository}/manifests/$1" \
              | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }'
          }
          # This commit owns the published version when its own sha- tag names the same index.
          # The publish job writes that tag first, so a version tag never exists without it.
          own_release() {
            local mine released
            case "$(status_of "sha-$GITHUB_SHA")" in
              200) ;;
              404) return 1 ;;
              *) return 2 ;;
            esac
            mine=$(digest_of "sha-$GITHUB_SHA") && released=$(digest_of "$VERSION") || return 2
            [[ $mine =~ ^sha256:[0-9a-f]{64}$ && $released == "$mine" ]]
          }
          image="ghcr.io/$repository"
          status=$(status_of "$VERSION")
          case "$status" in
            404)
              # This commit's tag first, then the version from that exact index: a single index
              # source is re-tagged byte for byte, so both tags name one digest.
              docker buildx imagetools create --tag "$image:sha-$GITHUB_SHA" "$image@$AMD64" "$image@$ARM64"
              merged=$(digest_of "sha-$GITHUB_SHA")
              [[ $merged =~ ^sha256:[0-9a-f]{64}$ ]]
              docker buildx imagetools create --tag "$image:$VERSION" "$image@$merged" ;;
            200)
              # Only this commit's own earlier attempt may have tagged it: resume with that index.
              if own_release; then
                echo '::notice::This commit already tagged this version; resuming with that index.'
              elif (( $? == 2 )); then
                echo '::error::Could not read the published tags; re-run once GHCR answers.'
                exit 1
              elif [[ $RELEASE_REQUESTED != true ]]; then
                # A maintenance commit merged while its release was still publishing: the release
                # tagged first. No digest is written, so scan, signing and delivery skip.
                echo '::notice::Published maintenance version retained; no release image or deployment.'
                exit 0
              else
                echo '::error::This release version was already published from another commit; release a new version.'
                exit 1
              fi ;;
            *) echo '::error::Could not establish release version absence.'; exit 1 ;;
          esac
          digest=$(digest_of "$VERSION")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ && $digest == "$(digest_of "sha-$GITHUB_SHA")" ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  web:
    name: Publish web image
    needs: [gate, publish]
    if: >-
      !cancelled() && needs.gate.result == 'success' && needs.publish.result == 'success' &&
      needs.publish.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Serializes the final absence check and tagging per version; never overwrites a release.
    concurrency:
      group: publish-web-${{ needs.gate.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.tag.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The web stage only copies files onto the pinned Caddy index, so both platforms build here
      # without emulation. It is pushed by digest; the next step tags it only while it is absent.
      - name: Build and push both platforms of the web image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.title=tarubot-web
            org.opencontainers.image.description=TaruBot's web proxy: Caddy with TaruBot's Caddyfile and offline page
            org.opencontainers.image.version=${{ needs.gate.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only AND Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - name: Tag the web image while its version is absent
        id: tag
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          BUILT: ${{ steps.build.outputs.digest }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ $VERSION =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$ ]]
          [[ $BUILT =~ ^sha256:[0-9a-f]{64}$ ]]
          repository="${GITHUB_REPOSITORY,,}"
          token=$(printf 'user = "%s:%s"\n' "$GHCR_USER" "$GHCR_TOKEN" \
            | curl --config - --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull" \
            | jq -er '(.token // .access_token) | strings | select(test("\\A[A-Za-z0-9._~+/-]+=*\\z"))')
          echo "::add-mask::$token"
          accept='Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          # A tag's HTTP status (404 absent, 200 present), and its index digest once present.
          status_of() {
            printf 'header = "Authorization: Bearer %s"\n' "$token" \
              | curl --config - --silent --show-error --connect-timeout 10 --max-time 30 \
                --head --output /dev/null --write-out '%{http_code}' --header "$accept" \
                "https://ghcr.io/v2/${repository}/manifests/$1"
          }
          digest_of() {
            printf 'header = "Authorization: Bearer %s"\n' "$token" \
              | curl --config - --fail --silent --show-error --connect-timeout 10 --max-time 30 \
                --head --output /dev/null --dump-header - --header "$accept" \
                "https://ghcr.io/v2/${repository}/manifests/$1" \
              | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }'
          }
          image="ghcr.io/$repository"
          tag="web-$VERSION"
          status=$(status_of "$tag")
          case "$status" in
            404)
              # A single index source is re-tagged byte for byte.
              docker buildx imagetools create --tag "$image:$tag" "$image@$BUILT"
              digest=$(digest_of "$tag")
              [[ $digest == "$BUILT" ]] ;;
            200)
              # Only this commit's own earlier attempt may have tagged it, as the image's source
              # label says: resume with that index (a rebuild's digest differs), never retag it.
              digest=$(digest_of "$tag")
              [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
              if ! revision=$(docker buildx imagetools inspect "$image@$digest" --format '{{json .Image}}' \
                | jq -er '[if has("config") then . else .[] end
                  | .config.Labels["org.opencontainers.image.revision"]]
                  | unique | if length == 1 then .[0] else empty end | strings'); then
                echo '::error::Could not read the published web image; re-run once GHCR answers.'
                exit 1
              fi
              if [[ $revision != "$GITHUB_SHA" ]]; then
                echo "::error::This release version's web image was already published from another commit; release a new version."
                exit 1
              fi
              echo '::notice::This commit already tagged its web image; resuming with that index.' ;;
            *) echo '::error::Could not read the published web tag; re-run once GHCR answers.'; exit 1 ;;
          esac
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan built platforms
    needs: publish
    if: "!cancelled() && needs.publish.result == 'success' && needs.publish.outputs.digest != ''"
    uses: ./.github/workflows/scan.yml
    with:
      digest: ${{ needs.publish.outputs.digest }}
    permissions:
      contents: read

  attest:
    name: Sign build provenance
    needs: [publish, scan, web]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.publish.result == 'success' && needs.scan.result == 'success' &&
      needs.web.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The signing job neither installs dependencies nor holds registry write credentials.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Validate exact subjects and reviewed exception freshness
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          WEB_DIGEST: ${{ needs.web.outputs.digest }}
        run: |
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ && $WEB_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          bun --no-env-file scripts/release-scan-exceptions.ts sign
      - name: Sign the bot image's provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/deconfined/tarubot
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: false
      - name: Sign the web image's provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/deconfined/tarubot
          subject-digest: ${{ needs.web.outputs.digest }}
          push-to-registry: false

  latest:
    name: Promote latest
    needs: [publish, web, attest]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.publish.result == 'success' && needs.web.result == 'success' &&
      needs.attest.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ghcr-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote signed digests only while main is current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          WEB_DIGEST: ${{ needs.web.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ && $WEB_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          bun --no-env-file scripts/release-scan-exceptions.ts promote
          current=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [[ $current != "$GITHUB_SHA" ]]; then
            echo '::notice::Main advanced; latest is unchanged.'
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Web first, as in deploy.yml: a failure between the two leaves the bot where it was.
          docker buildx imagetools create --tag "$image:web-latest" "$image@$WEB_DIGEST"
          docker buildx imagetools create --tag "$image:latest" "$image@$DIGEST"

  deploy:
    name: Production release
    needs: [gate, publish, web, attest, latest]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      vars.DEPLOY_ENABLED == 'true' && needs.gate.result == 'success' &&
      needs.publish.result == 'success' && needs.web.result == 'success' &&
      needs.attest.result == 'success' && needs.latest.result == 'success'
    uses: ./.github/workflows/deploy.yml
    # Bind only the release package's write token's name. This job has no environment (and the
    # token must never be a repository or organization secret), so it passes nothing: the approved
    # `production` environment job resolves the environment's own secret, as the delivery key was
    # before 2.46.0, and only that job can move the production tags.
    secrets:
      RELEASE_REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
    # Read only: the channel tags are written with that token, never with this run's.
    permissions:
      contents: read
      actions: read
      attestations: read
      deployments: read
      packages: read
    with:
      target: production
      version: ${{ needs.gate.outputs.version }}
