# Dependabot version updates for TaruBot.
#
# Dependency-only maintenance may retain SemVer. A release version increase also needs its
# CHANGELOG entry (scripts/ci-version.ts); the maintainer completes release metadata before merging.
# Groups and cooldowns keep update proposals small.
#
# Deliberately not managed here:
# - Bun packages (package.json and bun.lock). Dependabot's updater can't read Bun's lockfile
#   version 2 (dependabot/dependabot-core#16026), so that entry failed on every run; it was removed
#   in 2.32.1. The Dependency audit workflow (bun audit) covers their advisories, and updates go
#   through a normal feature branch. Restore the entry once the updater supports the lockfile.
# - lodestone-css-selectors: the bot follows its HEAD live, and only `bun run selectors:update`
#   advances the bundled fallback, because it also rewrites
#   src/infrastructure/lodestone/upstream-revisions.json and runs the contract suite. (Nodestone and
#   its submodule were removed in 2.20.0, and the sidecar in 2.21.0.)
# - The CI PostgreSQL service image in .github/workflows/ci.yml: Dependabot reads only `uses:` in
#   workflows. tests/unit/runtime-pins.test.ts keeps the service image equal to docker-compose.yml.
version: 2

updates:
  # Bun runtime image: every Dockerfile stage derives from oven/bun, so all FROM lines update together.
  # The maintainer completes the runtime upgrade in packageManager, engines.bun, and @types/bun;
  # tests/unit/runtime-pins.test.ts fails until they agree.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7

  # Documentation build dependencies never reach the bot image.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # Astro, Starlight and the links validator declare peer ranges on each other; move them together.
      site:
        patterns: ["*"]

  # Compose images: only postgres has a fixed tag; the GHCR images are parameterized and skipped.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    ignore:
      # A new major image initializes an empty cluster instead of opening existing data. Plan
      # majors as a migration (dump/restore or pg_upgrade, plus the managed cluster's version).
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # SHA-pinned workflow actions; Dependabot updates each SHA and its "# vX.Y.Z" comment together.
  # GitHub raises no Dependabot alerts, and so no security updates, for SHA-pinned actions: this
  # grouped update, after its cooldown, is the only automated path to a patched action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
