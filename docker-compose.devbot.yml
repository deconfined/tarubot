# Development overlay for the local devbot profile: its own tarubot_dev database while sharing local
# dependency services. DevBot itself runs on the staging host (docker-compose.staging.yml).
# Apply with: docker compose -f docker-compose.yml -f docker-compose.devbot.yml ...
services:
  tarubot:
    environment:
      DATABASE_URL: postgresql://tarubot:${POSTGRES_PASSWORD}@postgres:5432/tarubot_dev
      # A development launch must never fall back to unrestricted guild scope.
      TEST_GUILD_ID: ${TEST_GUILD_ID:?Set TEST_GUILD_ID for DevBot}
      # Development observers requested public command/button output in this scoped test guild.
      PUBLIC_TEST_RESPONSES: ${PUBLIC_TEST_RESPONSES:-true}
