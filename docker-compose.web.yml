# Shared optional ingress: the release's own web image, the stock Caddy binary with TaruBot's
# Caddyfile and offline page built in (the Dockerfile's web stage), so the proxy follows the same
# tag as the bot. The bot and its readiness port stay on the private network.
services:
  caddy:
    image: ghcr.io/deconfined/tarubot:web-${TARUBOT_IMAGE_TAG:-latest}
    profiles: [web]
    # The fixed name is how a tag-following updater (the managed manifests' Watchtower) finds it.
    container_name: tarubot-web
    environment:
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:-}
      WEB_PORT: ${WEB_PORT:-8080}
    # Caddy treats a URL's trailing slash as a path matcher. Canonicalize the
    # optional slash accepted by webSettings for both serving and validation.
    entrypoint: [sh, -ec, 'export WEB_PUBLIC_ORIGIN="$${WEB_PUBLIC_ORIGIN%/}"; exec "$$@"', --]
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # No depends_on: the proxy starts with the bot and answers with the offline page until the bot
    # is ready, and an updater swapping the bot leaves the proxy running (a dependency would make
    # Watchtower stop it too). The booleans-only web contract distinguishes its listener from the
    # main health port, so a port collision cannot falsely mark the proxy ready.
    # Public DNS and certificate issuance still need an external HTTPS check.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:2019/config/ &&
          wget -q -O - "http://tarubot:$$WEB_PORT/health/ready" | grep -qx '{"ready":true}'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The official binary carries this file capability; dropping it also prevents exec.
    cap_add: [NET_BIND_SERVICE]

volumes:
  # Keep these across container recreation, upgrades and temporary web disablement.
  caddy_data:
  caddy_config:
