# Registry deployment: pull published images; source builds use docker-compose.build.yml.
# The bot applies its own pending migrations when it starts, so upgrading is starting a newer
# image. The optional `updates` profile follows the image tag (latest by default) with Watchtower.
include:
  - ./docker-compose.web.yml

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tarubot
      POSTGRES_USER: tarubot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 stores versioned data directories beneath this parent mount.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tarubot -d tarubot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  tarubot:
    # Runtime credentials are supplied here, independently of the compiled image.
    image: ${TARUBOT_IMAGE:-ghcr.io/deconfined/tarubot:${TARUBOT_IMAGE_TAG:-latest}}
    # Only the `updates` profile's Watchtower reads these; without it they do nothing.
    # The fixed name is how the updater finds the bot (see watchtower below).
    container_name: tarubot
    environment:
      DATABASE_URL: postgresql://tarubot:${POSTGRES_PASSWORD}@postgres:5432/tarubot
      # Optional provider root CA for deployments using an external TLS PostgreSQL endpoint.
      DATABASE_CA_CERT: ${DATABASE_CA_CERT:-}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:-}
      WEB_PORT: ${WEB_PORT:-8080}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTH_PORT: ${HEALTH_PORT:-3000}
      ENABLE_EFFECTS: ${ENABLE_EFFECTS:-false}
      TEST_GUILD_ID: ${TEST_GUILD_ID:-}
      PUBLIC_TEST_RESPONSES: ${PUBLIC_TEST_RESPONSES:-false}
      TEST_PLAN_CHANNEL_ID: ${TEST_PLAN_CHANNEL_ID:-}
      TEST_PLAN_FILE: ${TEST_PLAN_FILE:-test-plans/current.json}
      # Identity refresh, proof lifetime, and roster authority have separate schedules.
      ROSTER_INTERVAL_SECONDS: ${ROSTER_INTERVAL_SECONDS:-21600}
      VERIFICATION_SECONDS: ${VERIFICATION_SECONDS:-1800}
      GUEST_COOLDOWN_SECONDS: ${GUEST_COOLDOWN_SECONDS:-86400}
      # The Lodestone parser runs in the bot (2.21.0: no sidecar). Probes never fetch a page.
      LODESTONE_REGION: ${LODESTONE_REGION:-na}
      LODESTONE_CONCURRENCY: ${LODESTONE_CONCURRENCY:-2}
      LODESTONE_START_MS: ${LODESTONE_START_MS:-1000}
      LODESTONE_TIMEOUT_MS: ${LODESTONE_TIMEOUT_MS:-15000}
      LODESTONE_BODY_BYTES: ${LODESTONE_BODY_BYTES:-2000000}
      LODESTONE_REQUEST_TIMEOUT_MS: ${LODESTONE_REQUEST_TIMEOUT_MS:-35000}
      LODESTONE_JOB_TIMEOUT_MS: ${LODESTONE_JOB_TIMEOUT_MS:-300000}
      LODESTONE_ATTEMPTS: ${LODESTONE_ATTEMPTS:-3}
      LODESTONE_MAX_PAGES: ${LODESTONE_MAX_PAGES:-100}
      # Selectors follow xivapi/lodestone-css-selectors HEAD; 0 keeps the bundled set.
      LODESTONE_SELECTOR_CHECK_SECONDS: ${LODESTONE_SELECTOR_CHECK_SECONDS:-900}
      # Issue reports (2.18.0): empty saves reports without sending them.
      GITHUB_REPORTS_TOKEN: ${GITHUB_REPORTS_TOKEN:-}
      GITHUB_REPORTS_REPO: ${GITHUB_REPORTS_REPO:-deconfined/tarubot-reports}
      # Heartbeat (2.22.0): a healthchecks.io ping URL; empty turns it off.
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL:-}
      # Mod mail's encryption key (2.43.0): base64 for 32 bytes; empty leaves mod mail unavailable.
      MODMAIL_KEY: ${MODMAIL_KEY:-}
      # Optional backups (2.46.0): an empty endpoint turns daily backups off, and migrations then
      # apply without a backup first.
      BACKUP_STORAGE_ENDPOINT: ${BACKUP_STORAGE_ENDPOINT:-}
      BACKUP_STORAGE_ACCESS_KEY: ${BACKUP_STORAGE_ACCESS_KEY:-}
      BACKUP_STORAGE_SECRET_KEY: ${BACKUP_STORAGE_SECRET_KEY:-}
      BACKUP_STORAGE_REGION: ${BACKUP_STORAGE_REGION:-}
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-03:00}
      HEALTHCHECKS_BACKUP_URL: ${HEALTHCHECKS_BACKUP_URL:-}
      # Only for one-off restore and restore-check runs of this service; empty for the bot.
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:-}
      RESTORE_DATABASE_CA_CERT: ${RESTORE_DATABASE_CA_CERT:-}
    depends_on:
      # Local capabilities can operate while Lodestone is degraded; storage must be ready.
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, bun, -e, "const r=await fetch('http://localhost:'+(process.env.HEALTH_PORT||'3000')+'/health/ready');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      # A new bot is unready while it backs up and migrates.
      start_period: 300s
    restart: unless-stopped
    stop_grace_period: 30s
    # Container hardening (2.30.3, #51): the root filesystem is read-only, and the only writable
    # path is a small /tmp, where pg_dump and pg_restore read the database CA from a private file.
    # It binds no privileged port and needs no capability, and nothing in it may gain privileges.
    # The DevBot overlay inherits these; docker-compose.production.yml and docker-compose.staging.yml
    # repeat them.
    read_only: true
    tmpfs: ["/tmp:size=1m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  # Opt-in updates (COMPOSE_PROFILES=updates): the managed manifests' pinned Watchtower and flags,
  # following TARUBOT_IMAGE_TAG for the bot and the web profile's proxy. When the tag moves it
  # stops the old container, then starts the new image with the same configuration; the bot
  # migrates on start. The Docker socket is root-equivalent on this Docker host.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1.23.2@sha256:62fb91130ddb493f869cad7e198fa260dd16c5da293ed092cbd5d8781566f7a6
    profiles: [updates]
    command:
      - --interval
      - "300"
      - --stop-timeout
      - 40s
      - --include-restarting
      - --cleanup
      - --no-startup-message
      - tarubot
      - tarubot-web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  # Container recreation preserves this volume; deleting it is an explicit operator action.
  postgres_data:
