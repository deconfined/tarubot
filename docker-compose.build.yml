# Explicit source-build override for contributors; normal deployments use published GHCR images.
# Local build: docker compose -f docker-compose.yml -f docker-compose.build.yml ... (DevBot runs only
# published releases on the staging host; never start its application from a local build).
# A local build has no registry tag to follow: don't combine it with the `updates` profile.
services:
  tarubot:
    image: tarubot:local
    build:
      context: .
      target: tarubot
    # Source-based sessions can update their plan without rebuilding; registry images carry a default.
    volumes:
      - ./test-plans:/app/test-plans:ro
  # The web profile's proxy from the same tree: Caddy with this checkout's Caddyfile and offline page.
  caddy:
    image: tarubot-web:local
    build:
      context: .
      target: web
